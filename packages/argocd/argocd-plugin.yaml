apiVersion: argoproj.io/v1alpha1
kind: ConfigManagementPlugin
metadata:
  name: kustomize-pulumi-render
spec:
  version: v1.0
  discover:
    fileName: 'kustomization.yaml'
  generate:
    command: [sh, -c]
    args:
      - |
        cd "$(git rev-parse --show-toplevel)"
        sh ./scripts/cluster/main.sh deploy prod --dry-run --quiet
