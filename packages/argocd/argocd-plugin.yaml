apiVersion: argoproj.io/v1alpha1
kind: ConfigManagementPlugin
metadata:
  name: kustomize-sst-render
spec:
  version: v1.0
  discover:
    fileName: 'kustomization.yaml'
  init:
    command: [sh, -c]
    args:
      - |
        cd ../../..
        [ -f pnpm-workspace.yaml ] || { echo "Expected k3s/overlays/<env>" >&2; exit 1; }
        case "${ARGOCD_ENV_DEPLOY_ENV:-prod}" in
          dev | preview) render_stage=dev ;;
          prod) render_stage=production ;;
          *) echo "Unsupported deployment environment" >&2; exit 1 ;;
        esac
        pnpm install --frozen-lockfile --ignore-scripts --store-dir /tmp/pnpm-store
        pnpm sst install --stage "${render_stage}"
  generate:
    command: [sh, -c]
    args:
      - |
        cd ../../..
        [ -f pnpm-workspace.yaml ] || { echo "Expected k3s/overlays/<env>" >&2; exit 1; }
        sh ./scripts/cluster/main.sh deploy "${ARGOCD_ENV_DEPLOY_ENV:-prod}" --dry-run --quiet
