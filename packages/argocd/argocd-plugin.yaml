apiVersion: argoproj.io/v1alpha1
kind: ConfigManagementPlugin
metadata:
  name: kustomize-sst-render
spec:
  version: v1.0
  discover:
    fileName: 'kustomization.yaml'
  init:
    command: [sh, -c]
    args:
      - |
        repo_root=$PWD
        while [ "${repo_root}" != / ] && [ ! -f "${repo_root}/pnpm-workspace.yaml" ]; do
          repo_root=$(dirname "${repo_root}")
        done
        [ -f "${repo_root}/pnpm-workspace.yaml" ] || {
          echo "Unable to locate the repository root from ${PWD}" >&2
          exit 1
        }
        cd "${repo_root}"
        pnpm install --frozen-lockfile --ignore-scripts --store-dir /tmp/pnpm-store
        pnpm sst install --stage production
  generate:
    command: [sh, -c]
    args:
      - |
        repo_root=$PWD
        while [ "${repo_root}" != / ] && [ ! -f "${repo_root}/pnpm-workspace.yaml" ]; do
          repo_root=$(dirname "${repo_root}")
        done
        [ -f "${repo_root}/pnpm-workspace.yaml" ] || {
          echo "Unable to locate the repository root from ${PWD}" >&2
          exit 1
        }
        cd "${repo_root}"
        sh ./scripts/cluster/main.sh deploy prod --dry-run --quiet
