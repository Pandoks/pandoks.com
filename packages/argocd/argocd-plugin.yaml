apiVersion: argoproj.io/v1alpha1
kind: ConfigManagementPlugin
metadata:
  name: kustomize-sst-render
spec:
  version: v1.0
  discover:
    fileName: 'kustomization.yaml'
  init:
    command: [sh, -c]
    args:
      - |
        cd ../../..
        [ -f pnpm-workspace.yaml ] || { echo "Expected k3s/overlays/<env>" >&2; exit 1; }
        pnpm install --frozen-lockfile --ignore-scripts --store-dir /tmp/pnpm-store
        pnpm sst install --stage production
  generate:
    command: [sh, -c]
    args:
      - |
        cd ../../..
        [ -f pnpm-workspace.yaml ] || { echo "Expected k3s/overlays/<env>" >&2; exit 1; }
        sh ./scripts/cluster/main.sh deploy prod --dry-run --quiet
