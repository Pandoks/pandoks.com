# The app's slug, which names its resources and its path on the host
name: example
namespace: example
# Required: the app's image, built from packages/mobile-updates/Dockerfile with APP set to the app
image: ~
# Required: ${UpdatesDomain} in an app's kube
host: ~
# The secret with Cloudflare's origin certificate, which the ingress serves to Cloudflare
tlsSecret: cloudflare-origin-tls

signingKey:
  secret: mobile-updates-example-signing-key
  dataKey: private-key.pem

replicas: 2

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
