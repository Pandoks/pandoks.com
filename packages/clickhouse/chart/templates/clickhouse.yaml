{{- $storageMode := .Values.storage.mode -}}
{{- if not (has $storageMode (list "local" "object" "mixed")) -}}
{{- fail "storage.mode must be one of: local, object, mixed" -}}
{{- end -}}
{{- $objectStorageEnabled := or (eq $storageMode "object") (eq $storageMode "mixed") -}}
{{- $objectStorageDefault := eq $storageMode "object" -}}
{{- $objectStorageCacheEnabled := and $objectStorageEnabled (ne (toString .Values.storage.object.cacheSize) "0") -}}
{{- if $objectStorageEnabled -}}
{{- $_ := required "storage.object.endpoint is required when storage.mode is object or mixed" .Values.storage.object.endpoint -}}
{{- $_ := required "storage.object.bucket is required when storage.mode is object or mixed" .Values.storage.object.bucket -}}
{{- $_ := required "storage.object.credentialsSecret is required when storage.mode is object or mixed" .Values.storage.object.credentialsSecret -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-{{ .Values.name }}-config
  namespace: {{ .Values.namespace }}
data:
  config.yaml: |
{{ .Files.Get "files/config.yaml" | indent 4 }}
{{ if $objectStorageEnabled }}
    storage_configuration:
      disks:
        object:
          type: object_storage
          object_storage_type: s3
          metadata_type: local
          endpoint: '${CLICKHOUSE_OBJECT_STORAGE_ENDPOINT}/${CLICKHOUSE_OBJECT_STORAGE_BUCKET}/clickhouse/${NAMESPACE}/${CLUSTER_NAME}/${SHARD_ID}/${REPLICA_ID}/'
          region: '${CLICKHOUSE_OBJECT_STORAGE_REGION}'
          access_key_id: '${AWS_ACCESS_KEY_ID}'
          secret_access_key: '${AWS_SECRET_ACCESS_KEY}'
{{ if $objectStorageCacheEnabled }}
        object_cache:
          type: cache
          disk: object
          path: /var/lib/clickhouse/disks/object_cache/
          max_size: {{ .Values.storage.object.cacheSize | quote }}
{{ end }}
      policies:
        object:
          volumes:
            main:
              disk: {{ ternary "object_cache" "object" $objectStorageCacheEnabled }}
{{ if $objectStorageDefault }}

    merge_tree:
      storage_policy: object
{{ end }}
{{ end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-{{ .Values.name }}-users
  namespace: {{ .Values.namespace }}
data:
  users.yaml: |
{{ .Files.Get "files/users.yaml" | indent 4 }}

---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-{{ .Values.name }}
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: clickhouse-{{ .Values.name }}
  ports:
    - name: http
      port: &client-port 8123
      targetPort: *client-port
    - name: tcp
      port: &binary-port 9000
      targetPort: *binary-port

---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse-{{ .Values.name }}-headless
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: clickhouse
    database: {{ .Values.name }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: clickhouse-{{ .Values.name }}
  ports:
    - name: http
      port: &client-port 8123
      targetPort: *client-port
    - name: tcp
      port: &binary-port 9000
      targetPort: *binary-port
    - name: bus
      port: &interserver-port 9009
      targetPort: *interserver-port
    - name: metrics
      port: &metrics-port 9363
      targetPort: *metrics-port
{{- range $shardIndex := until (int $.Values.clickhouse.shards) }}

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse-{{ $.Values.name }}-shard-{{ $shardIndex }}
  namespace: {{ $.Values.namespace }}
spec:
  serviceName: clickhouse-{{ $.Values.name }}-headless
  replicas: {{ $.Values.clickhouse.replicasPerShard }}
  selector:
    matchLabels:
      app: &app clickhouse-{{ $.Values.name }}
      shard: &shard {{ $shardIndex | quote }}
  template:
    metadata:
      annotations:
        checksum/config: {{ printf "%s:%s" ($.Files.Get "files/config.yaml") (toJson $.Values.storage) | sha256sum }}
        checksum/users: {{ $.Files.Get "files/users.yaml" | sha256sum }}
      labels:
        app: *app
        shard: *shard
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: *app
                  shard: *shard
              topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          image: {{ $.Values.clickhouse.image }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: &client-port 8123
            - name: tcp
              containerPort: 9000
            - name: bus
              containerPort: 9009
            - name: metrics
              containerPort: 9363
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CLUSTER_NAME
              value: {{ $.Values.name }}
            - name: SHARD_ID
              value: {{ $shardIndex | quote }}
            - name: REPLICA_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KEEPER_REPLICAS
              value: {{ $.Values.keeper.replicas | quote }}
            - name: SHARDS
              value: {{ $.Values.clickhouse.shards | quote }}
            - name: REPLICAS_PER_SHARD
              value: {{ $.Values.clickhouse.replicasPerShard | quote }}
            - name: CLICKHOUSE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: &creds-secret {{ $.Values.credentials.secret }}
                  key: {{ $.Values.credentials.dataKeys.adminPassword }}
            - name: CLICKHOUSE_CLIENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: *creds-secret
                  key: {{ $.Values.credentials.dataKeys.clientPassword }}
{{- if $objectStorageEnabled }}
            - name: CLICKHOUSE_OBJECT_STORAGE_ENDPOINT
              value: {{ trimSuffix "/" $.Values.storage.object.endpoint | quote }}
            - name: CLICKHOUSE_OBJECT_STORAGE_REGION
              value: {{ $.Values.storage.object.region | quote }}
            - name: CLICKHOUSE_OBJECT_STORAGE_BUCKET
              value: {{ $.Values.storage.object.bucket | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: &object-storage-secret {{ $.Values.storage.object.credentialsSecret }}
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: *object-storage-secret
                  key: AWS_SECRET_ACCESS_KEY
{{- end }}
          volumeMounts:
            - name: &data data
              mountPath: /var/lib/clickhouse
            - name: &logs logs
              mountPath: /var/log/clickhouse-server
            - name: &clickhouse-{{ $.Values.name }}-config config
              mountPath: /tmp/conf_templates/config.yaml
              subPath: config.yaml
            - name: &clickhouse-{{ $.Values.name }}-users users
              mountPath: /tmp/conf_templates/users.yaml
              subPath: users.yaml
            - name: &etc-clickhouse etc-clickhouse
              mountPath: /etc/clickhouse-server
            - name: &tmp tmp
              mountPath: /tmp
            - name: &run run
              mountPath: /var/run/clickhouse-server
          livenessProbe:
            httpGet:
              path: /ping
              port: *client-port
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: *client-port
            initialDelaySeconds: 10
            periodSeconds: 5
          {{- with $.Values.clickhouse.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: *clickhouse-{{ $.Values.name }}-config
          configMap:
            name: clickhouse-{{ $.Values.name }}-config
        - name: *clickhouse-{{ $.Values.name }}-users
          configMap:
            name: clickhouse-{{ $.Values.name }}-users
        - name: *etc-clickhouse
          emptyDir: {}
        - name: *tmp
          emptyDir: {}
        - name: *run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: *data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 999Pi # local-path does not support storage requests so we use a big number just to show that it's uncapped
    - metadata:
        name: *logs
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 999Pi # local-path does not support storage requests so we use a big number just to show that it's uncapped
{{- end }}
