name: example
namespace: example

credentials:
  secret: clickhouse-example-creds
  dataKeys:
    adminPassword: ADMIN_PASSWORD
    clientPassword: CLIENT_PASSWORD

clickhouse:
  image: ghcr.io/pandoks/clickhouse:latest@sha256:1b1f771c3fd7eb636c0d58144d95b389a88c5b13bc86fac8e2d2172483d39bde
  shards: 1
  replicasPerShard: 2
  # NOTE: no CPU limits here or on keeper; throttling stalls queries and Raft heartbeats
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 4Gi

keeper:
  image: ghcr.io/pandoks/clickhouse-keeper:latest@sha256:8851bec98622e6e065c66997f156933bfd45fe1fe09d7927bba4a7d0e5127145
  replicas: 3
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 4Gi

# Dedicated database nodes for ClickHouse and Keeper
# options: { role: db } | ~
nodeSelector: ~
# options: [{ key: role, operator: Equal, value: db, effect: NoSchedule }] | ~
tolerations: ~

backup:
  enabled: true
  credentials:
    secret: backup-bucket-creds
    dataKeys:
      accessKey: S3_ACCESS_KEY
      secretKey: S3_SECRET_KEY
  image: ghcr.io/pandoks/clickhouse-backup:latest@sha256:40b0010b07cbaf8676be0f94343954d25cb43a5a13efd21405da8d7a9a08a910
  bucket: backups
  path: kubernetes/example/clickhouse
  schedules:
    full: '0 2 * * 0'
    diff: '0 2 * * 3,6'
    incr: '0 2 * * 1,2,4,5'
  retention:
    full: 3
    diff: 6
    incr: 24
  resources: {}

s3:
  region: us-west-1
  endpoint: http://host.k3d.internal:4566
