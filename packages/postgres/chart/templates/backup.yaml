{{- range $group := until (add1 $.Values.patroni.workers | int) }}
  {{- range $type, $schedule := $.Values.backup.schedules }}
    {{- if and $.Values.backup.enabled $schedule }}
---
{{ include "pgbackrest.cronjob" (dict "context" $ "type" $type "schedule" $schedule "group" $group) }}
    {{- end }}
  {{- end }}
{{- end }}

{{- if .Values.backup.enabled }}
---
# NOTE: the only targets every group can be restored to consistently, see the README
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Values.db }}-citus-restore-point
  namespace: {{ .Values.namespace }}
spec:
  schedule: {{ .Values.backup.restorePointSchedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restore-point
              image: {{ .Values.patroni.image }}
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              command:
                - sh
                - -c
                - |
                  set -eu
                  name="$(date -u +%Y%m%dT%H%MZ)"
                  psql -v ON_ERROR_STOP=1 -c "SELECT citus_create_restore_point('${name}')"
                  echo "Created restore point ${name}"
              env:
                - name: PGHOST
                  value: patroni-{{ .Values.db }}-primary-group-0
                - name: PGDATABASE
                  value: {{ .Values.db }}
                - name: PGUSER
                  value: postgres
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.credentials.secret }}
                      key: {{ .Values.credentials.dataKeys.superuserPassword }}
          restartPolicy: OnFailure
      backoffLimit: 4
{{- end }}

{{- define "pgbackrest.cronjob" -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .context.Values.db }}-group-{{ .group }}-pgbackrest-backup-{{ .type }}
  namespace: {{ .context.Values.namespace }}
spec:
  schedule: {{ .schedule }}
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pgbackrest
              image: {{ .context.Values.backup.image }}
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              args:
                - pgbackrest
                - --stanza={{ .context.Values.db }}-group-{{ .group }}
                - --type={{ .type }}
                - backup
              env:
                - name: MASTER_HOST
                  value: patroni-{{ .context.Values.db }}-primary-group-{{ .group }}.{{ .context.Values.namespace }}.svc.cluster.local
                - name: CLIENT_COMMON_NAME
                  value: patroni-{{ .context.Values.db }}-group-{{ .group }}
                - name: BACKUP_BUCKET
                  value: {{ .context.Values.backup.bucket }}
                - name: BACKUP_PATH
                  value: {{ .context.Values.backup.path }}
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: &backup-secret {{ .context.Values.backup.credentials.secret }}
                      key: {{ .context.Values.backup.credentials.dataKeys.accessKey }}
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: *backup-secret
                      key: {{ .context.Values.backup.credentials.dataKeys.secretKey }}
                - name: S3_REGION
                  value: {{ .context.Values.s3.region }}
                - name: S3_HOST
                  value: {{ .context.Values.s3.host }}
                - name: S3_TLS
                  value: {{ .context.Values.s3.tls | quote }}
                - name: S3_URI_STYLE
                  value: {{ .context.Values.s3.uriStyle }}
                - name: ENCRYPTION_KEY
                  value: {{ .context.Values.backup.encryptionKey }}
                - name: STANZA
                  value: {{ .context.Values.db }}-group-{{ .group }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .context.Values.credentials.secret }}
                      key: {{ .context.Values.credentials.dataKeys.superuserPassword }}
                - name: FULL_RETENTION
                  value: {{ .context.Values.backup.retention.full | quote }}
                - name: DIFF_RETENTION
                  value: {{ .context.Values.backup.retention.diff | quote }}
              {{- with .context.Values.backup.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              volumeMounts:
                - name: &config pgbackrest-config
                  mountPath: /tmp/conf_templates/pgbackrest.conf
                  subPath: pgbackrest.conf
                - name: &etc-pgbackrest etc-pgbackrest
                  mountPath: /etc/pgbackrest
                - name: &tls pgbackrest-tls
                  mountPath: /etc/pgbackrest/certs
                  readOnly: true
                - name: &tmp tmp
                  mountPath: /tmp
          volumes:
            - name: *config
              configMap:
                name: pgbackrest-{{ .context.Values.db }}-backup-server-config
            - name: *etc-pgbackrest
              emptyDir: {}
            - name: *tmp
              emptyDir: {}
            - name: *tls
              secret:
                secretName: {{ .context.Values.db }}-group-{{ .group }}-pgbackrest-backup-tls
                defaultMode: 0600
                items:
                  - key: tls.crt
                    path: server.crt
                  - key: tls.key
                    path: server.key
                  - key: ca.crt
                    path: ca.crt
          restartPolicy: OnFailure
      backoffLimit: 4
{{- end }}
