{{- /* PgDog Service name, mirroring the pgdog chart's fullname rule. */}}
{{- $release := .Values.pgdogReleaseName | default (printf "%s-pgdog" .Values.db) }}
{{- $name := .Values.pgdog.nameOverride | default "pgdog" }}
{{- $pgdog := .Values.pgdog.fullnameOverride | default (ternary $release (printf "%s-%s" $release $name) (contains $name $release)) | trunc 63 | trimSuffix "-" }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: patroni-{{ .Values.db }}
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    app.kubernetes.io/name: patroni
    database: {{ .Values.db }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Values.namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/name: patroni
      database: {{ .Values.db }}
  endpoints:
    - port: patroni
      path: /metrics
      interval: 30s
      scheme: http

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-{{ .Values.db }}
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    app.kubernetes.io/name: postgres
    database: {{ .Values.db }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Values.namespace }}
  selector:
    matchLabels:
      app.kubernetes.io/name: patroni
      database: {{ .Values.db }}
  endpoints:
    - port: pg-metrics
      path: /metrics
      interval: 30s
      scheme: http
      scrapeTimeout: 25s

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-postgres-{{ .Values.namespace }}-{{ .Values.db }}
  namespace: {{ .Values.monitoringNamespace }}
  labels:
    grafana_dashboard: "1"
data:
  postgres-{{ .Values.namespace }}-{{ .Values.db }}.json: |
{{ tpl (.Files.Get "files/grafana-dashboard.json" | replace "service=~" `namespace=\"{{ .Values.namespace }}\", service=~` | replace "{{ .Values.db }}-pgdog" $pgdog) . | indent 4 }}
