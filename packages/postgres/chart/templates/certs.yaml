{{- range $shardIndex := until (int $.Values.patroni.shards) }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: patroni-{{ $.Values.db }}-shard-{{ $shardIndex }}
  namespace: {{ $.Values.namespace }}
spec:
  commonName: patroni-{{ $.Values.db }}-shard-{{ $shardIndex }}
  secretName: patroni-{{ $.Values.db }}-shard-{{ $shardIndex }}-tls
  dnsNames:
    - patroni-{{ $.Values.db }}-primary-shard-{{ $shardIndex }}.{{ $.Values.namespace }}.svc.cluster.local
    - patroni-{{ $.Values.db }}-replicas-shard-{{ $shardIndex }}.{{ $.Values.namespace }}.svc.cluster.local
  usages:
    - client auth
    - server auth
  issuerRef:
    name: internal-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $.Values.db }}-shard-{{ $shardIndex }}-pgbackrest-backup
  namespace: {{ $.Values.namespace }}
spec:
  commonName: {{ $.Values.db }}-shard-{{ $shardIndex }}-pgbackrest-backup
  secretName: {{ $.Values.db }}-shard-{{ $shardIndex }}-pgbackrest-backup-tls
  dnsNames:
    - patroni-{{ $.Values.db }}-primary-shard-{{ $shardIndex }}.{{ $.Values.namespace }}.svc.cluster.local
    - patroni-{{ $.Values.db }}-replicas-shard-{{ $shardIndex }}.{{ $.Values.namespace }}.svc.cluster.local
  usages:
    - client auth
    - server auth
  issuerRef:
    name: internal-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
