{{- if $.Values.backup.enabled }}
{{- range $group := until (add1 $.Values.patroni.workers | int) }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: patroni-{{ $.Values.db }}-group-{{ $group }}
  namespace: {{ $.Values.namespace }}
spec:
  commonName: patroni-{{ $.Values.db }}-group-{{ $group }}
  secretName: patroni-{{ $.Values.db }}-group-{{ $group }}-tls
  dnsNames:
    - patroni-{{ $.Values.db }}-primary-group-{{ $group }}.{{ $.Values.namespace }}.svc.cluster.local
  usages:
    - client auth
    - server auth
  issuerRef:
    name: internal-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $.Values.db }}-group-{{ $group }}-pgbackrest-backup
  namespace: {{ $.Values.namespace }}
spec:
  commonName: {{ $.Values.db }}-group-{{ $group }}-pgbackrest-backup
  secretName: {{ $.Values.db }}-group-{{ $group }}-pgbackrest-backup-tls
  dnsNames:
    - patroni-{{ $.Values.db }}-primary-group-{{ $group }}.{{ $.Values.namespace }}.svc.cluster.local
  usages:
    - client auth
    - server auth
  issuerRef:
    name: internal-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
{{- end }}
{{- end }}
