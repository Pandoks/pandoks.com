db: example
namespace: example

credentials:
  secret: postgres-example-creds
  dataKeys:
    superuserPassword: SUPERUSER_PASSWORD
    adminPassword: ADMIN_PASSWORD
    clientPassword: CLIENT_PASSWORD
    replicationPassword: REPLICATION_PASSWORD
    patroniPassword: PATRONI_PASSWORD
    pgbouncerUserlist: userlist.txt # NOTE: PgBouncer's auth_file, with admin and client passwords

backup:
  enabled: true # WARNING: set before first create; Patroni ignores later archive_mode changes
  credentials:
    secret: backup-bucket-creds
    dataKeys:
      accessKey: S3_ACCESS_KEY
      secretKey: S3_SECRET_KEY
  bucket: backups
  image: ghcr.io/pandoks/pgbackrest:latest@sha256:c7b25e244534fe610a91277a8ad7cd4484b7832aa0be84149681db755cf3eaf4
  encryptionKey: openssl-rand-hex-32
  path: kubernetes/examples/postgres
  schedules:
    full: '0 2 * * 0'
    diff: '0 2 * * 3,6'
    incr: '0 2 * * 1,2,4,5'
  retention:
    full: 4
    diff: 2
  # NOTE: PITR across groups can only stop at these, see the README
  restorePointSchedule: '*/15 * * * *'
  resources: {}

s3:
  region: us-west-1
  host: host.k3d.internal:4566
  tls: 'n'
  uriStyle: path

patroni:
  workers: 0 # NOTE: Citus worker groups; 0 keeps every shard on the coordinator
  replicasPerGroup: 3 # NOTE: pods per group = primary (1) + replicas (n - 1)
  image: ghcr.io/pandoks/patroni:latest@sha256:66ad4100ceb1e8897759558603e2cae6164bd24c7374abd645bbd02ebcf0e236
  reconcilerImage: ghcr.io/pandoks/postgres-reconciler:latest
  # NOTE: new clusters start with these, and a Job applies them to running clusters after every
  # install, upgrade and rollback. Ones that need a restart wait for `patronictl restart`, and a key
  # removed here keeps its last value
  parameters:
    max_connections: 100
    max_locks_per_transaction: 64
    max_worker_processes: 20
    max_wal_senders: 20
    max_replication_slots: 20
    wal_keep_size: 16384MB
    max_slot_wal_keep_size: 16384MB
    max_wal_size: 4GB
    min_wal_size: 1GB
    wal_compression: 'on'
    shared_buffers: 128MB
    effective_cache_size: 4GB
    work_mem: 4MB
    maintenance_work_mem: 64MB
  resources:
    patroni: {}
    pgbackrest: {}
    postgresExporter: {}

# Dedicated database nodes for Patroni (PgBouncer stays with the apps)
# options: { role: db } | ~
nodeSelector: ~
# options: [{ key: role, operator: Equal, value: db, effect: NoSchedule }] | ~
tolerations: ~

pgbouncer:
  image: ghcr.io/cloudnative-pg/pgbouncer:1.26.1@sha256:3164c7e929c05deef00175c0bb81f3446a59f7254715b43a865ec8cdb83f869e
  replicas: 2
  # https://www.pgbouncer.org/config.html
  settings:
    pool_mode: transaction
    default_pool_size: 15
    max_client_conn: 1000
  resources: {}
