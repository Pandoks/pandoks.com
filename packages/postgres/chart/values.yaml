db: example
namespace: example

credentials:
  secret: postgres-example-creds
  dataKeys:
    superuserPassword: SUPERUSER_PASSWORD
    adminPassword: ADMIN_PASSWORD
    clientPassword: CLIENT_PASSWORD
    replicationPassword: REPLICATION_PASSWORD
    patroniPassword: PATRONI_PASSWORD

backup:
  enabled: true # WARNING: set before first create; Patroni ignores later archive_mode changes
  credentials:
    secret: backup-bucket-creds
    dataKeys:
      accessKey: S3_ACCESS_KEY
      secretKey: S3_SECRET_KEY
  bucket: backups
  image: ghcr.io/pandoks/pgbackrest:latest@sha256:e20d6d0f5666e4cbd3bad11414bc815441fddb347c7629a2496d902c740820f0
  encryptionKey: openssl-rand-hex-32
  path: kubernetes/examples/postgres
  schedules:
    full: '0 2 * * 0'
    diff: '0 2 * * 3,6'
    incr: '0 2 * * 1,2,4,5'
  retention:
    full: 4
    diff: 2
  resources: {}

s3:
  region: us-west-1
  host: host.k3d.internal:4566
  tls: 'n'
  uriStyle: path

patroni:
  shards: 1
  replicasPerShard: 3 # NOTE: replicasPerShard = primary (1) + replicas (n - 1)
  image: ghcr.io/pandoks/patroni:latest@sha256:db634887b4c6407e654e4391a888a88b6f628e077b057a5d8896ab1fd989eee4
  resources:
    patroni: {}
    pgbackrest: {}
    postgresExporter: {}

# Dedicated database nodes for Patroni (PgDog stays with the apps)
# options: { role: db } | ~
nodeSelector: ~
# options: [{ key: role, operator: Equal, value: db, effect: NoSchedule }] | ~
tolerations: ~

# https://github.com/pgdogdev/helm/blob/main/values.yaml
pgdog:
  replicas: 2
  workers: 2
  defaultPoolSize: 15
  lsnCheckDelay: 0
  lsnCheckInterval: 1000
  loadBalancingStrategy: least_active_connections
  readWriteSplit: include_primary_if_replica_banned
