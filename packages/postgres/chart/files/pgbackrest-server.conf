[global]
repo1-path=${BACKUP_PATH}
repo1-type=s3
repo1-s3-bucket=${BACKUP_BUCKET}
repo1-s3-key=${S3_ACCESS_KEY}
repo1-s3-key-secret=${S3_SECRET_KEY}
repo1-s3-region=${S3_REGION}
repo1-s3-endpoint=${S3_HOST}
repo1-storage-verify-tls=${S3_TLS}
repo1-s3-uri-style=${S3_URI_STYLE}
repo1-cipher-pass=${ENCRYPTION_KEY}
repo1-cipher-type=aes-256-cbc

compress-type=zst

repo1-block=y
repo1-bundle=y

repo1-retention-full=${FULL_RETENTION}
repo1-retention-diff=${DIFF_RETENTION}

log-level-console=info
log-level-file=debug
log-timestamp=y

process-max=4
start-fast=y
delta=y
archive-async=y
spool-path=/var/spool/pgbackrest

tls-server-cert-file=/etc/pgbackrest/certs/server.crt
tls-server-key-file=/etc/pgbackrest/certs/server.key
tls-server-ca-file=/etc/pgbackrest/certs/ca.crt
tls-server-auth=${CLIENT_COMMON_NAME}=${STANZA}
