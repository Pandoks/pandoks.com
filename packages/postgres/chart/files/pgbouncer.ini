[databases]
{{ .Values.db }} = host=patroni-{{ .Values.db }}-primary-group-0 port=5432 dbname={{ .Values.db }}
{{ .Values.db }}_replicas = host=patroni-{{ .Values.db }}-replicas-group-0 port=5432 dbname={{ .Values.db }} connect_query='SET default_transaction_read_only = on'

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
unix_socket_dir =
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
ignore_startup_parameters = extra_float_digits
{{- range $name, $value := .Values.pgbouncer.settings }}
{{ $name }} = {{ $value }}
{{- end }}
