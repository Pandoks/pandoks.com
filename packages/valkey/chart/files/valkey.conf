bind 0.0.0.0
port 6379
protected-mode no

dir /data

logfile ""

cluster-enabled yes
cluster-config-file nodes.conf

cluster-announce-hostname ${POD_NAME}.${HEADLESS_SERVICE}.${NAMESPACE}.svc.cluster.local
cluster-preferred-endpoint-type hostname
cluster-announce-human-nodename ${POD_NAME}
cluster-announce-port 6379
cluster-announce-bus-port 16379

aclfile /etc/valkey/users.acl

primaryuser admin
primaryauth "${ESCAPED_ADMIN_PASSWORD}"

# NOTE: a primary without persistence restarts empty with its node id, so hand its slots to a synced replica first
shutdown-on-sigterm failover
