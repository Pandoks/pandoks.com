name: example
namespace: example
image: ghcr.io/pandoks/valkey:latest@sha256:da0b51d171e30361a48f4d5cc03968d9994e74d5e1d811705c4904bc967cb100

credentials:
  secret: valkey-example-creds
  dataKeys:
    adminPassword: ADMIN_PASSWORD
    clientPassword: CLIENT_PASSWORD

cluster:
  masters: 1
  replicasPerMaster: 0
  reconcilerImage: ghcr.io/pandoks/valkey-reconciler:latest@sha256:d714c90df2854eae7c70b5ab35894a06772e36fa1ead12d0262bce1cc927acda

# No persistence by default
# options: rdb,aof | rdb | aof | ~
persistence: ~

# Valkey settings, applied to running nodes without a restart. Quote values: unquoted, yes renders as true and
# 104857600 as 1.048576e+08
# NOTE: a key removed here keeps its last value until its pod restarts
parameters:
  loglevel: notice
  cluster-allow-reads-when-down: 'yes'
  replica-read-only: 'yes'
  cluster-node-timeout: '5000'

# NOTE: no CPU limit; throttling adds latency spikes
resources:
  requests:
    cpu: 1000m
    memory: 1Gi
  limits:
    memory: 1Gi

# Dedicated database nodes
# options: { role: db } | ~
nodeSelector: ~
# options: [{ key: role, operator: Equal, value: db, effect: NoSchedule }] | ~
tolerations: ~

hooks:
  ttlSecondsAfterFinished: ~
  backoffLimit: ~
  restartPolicy: OnFailure
  hookDeletePolicy: before-hook-creation,hook-succeeded
