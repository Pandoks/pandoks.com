{{- define "valkey.parameters" }}
{{- /* NOTE: entrypoint.sh sets these for persistence */}}
{{- $chartKeys := list "save" "rdb-del-sync-files" "appendonly" "appendfsync" }}
{{- range splitList "\n" (.Files.Get "files/valkey.conf") }}
{{- $line := trim . }}
{{- if and $line (not (hasPrefix "#" $line)) }}
{{- $chartKeys = append $chartKeys (first (splitList " " $line)) }}
{{- end }}
{{- end }}
{{- /* NOTE: Valkey 9.1's aliases (src/config.c), so a key and its alias can't both be set */}}
{{- $aliasKeys := dict "aof_rewrite_cpulist" "aof-rewrite-cpulist" "bgsave_cpulist" "bgsave-cpulist" "bio_cpulist" "bio-cpulist" "lua-time-limit" "busy-reply-threshold" "cluster-slave-no-failover" "cluster-replica-no-failover" "cluster-slave-validity-factor" "cluster-replica-validity-factor" "slowlog-log-slower-than" "commandlog-execution-slower-than" "slowlog-max-len" "commandlog-slow-execution-max-len" "hash-max-ziplist-entries" "hash-max-listpack-entries" "hash-max-ziplist-value" "hash-max-listpack-value" "list-max-ziplist-size" "list-max-listpack-size" "lua-enable-deprecated-api" "lua-enable-insecure-api" "min-slaves-max-lag" "min-replicas-max-lag" "min-slaves-to-write" "min-replicas-to-write" "masterauth" "primaryauth" "masteruser" "primaryuser" "repl-ping-slave-period" "repl-ping-replica-period" "slave-announce-ip" "replica-announce-ip" "slave-announce-port" "replica-announce-port" "slave-ignore-maxmemory" "replica-ignore-maxmemory" "slave-lazy-flush" "replica-lazy-flush" "slave-priority" "replica-priority" "slave-read-only" "replica-read-only" "slave-serve-stale-data" "replica-serve-stale-data" "slaveof" "replicaof" "server_cpulist" "server-cpulist" "zset-max-ziplist-entries" "zset-max-listpack-entries" "zset-max-ziplist-value" "zset-max-listpack-value" }}
{{- /* NOTE: Valkey 9.1's IMMUTABLE_CONFIG and PROTECTED_CONFIG settings (src/config.c) */}}
{{- $runtimeLockedKeys := list "rdbchecksum" "daemonize" "always-show-logo" "set-proc-title" "repl-mptcp" "syslog-enabled" "cluster-enabled" "disable-thp" "enable-debug-assert" "lua-enable-insecure-api" "aclfile" "unixsocket" "unixsocketgroup" "pidfile" "cluster-config-file" "syslog-ident" "dbfilename" "appendfilename" "appenddirname" "server-cpulist" "bio-cpulist" "aof-rewrite-cpulist" "bgsave-cpulist" "logfile" "req-res-logfile" "hash-seed" "supervised" "syslog-facility" "enable-protected-configs" "enable-debug-command" "enable-module-command" "databases" "cluster-databases" "tcp-backlog" "mptcp" "cluster-port" "rdma-rx-size" "rdma-completion-vector" "unixsocketperm" "socket-mark-id" "client-default-resp" "dir" "replicaof" }}
{{- /* NOTE: Valkey 9.1's SENSITIVE_CONFIG settings, besides the chart's primaryuser and primaryauth */}}
{{- $sensitiveKeys := list "requirepass" "tls-key-file-pass" "tls-client-key-file-pass" }}
{{- $parameters := dict }}
{{- $keysByCanonicalKey := dict }}
{{- range $name, $value := .Values.parameters }}
{{- $canonicalKey := get $aliasKeys (lower $name) | default (lower $name) }}
{{- if hasKey $keysByCanonicalKey $canonicalKey }}
{{- fail (printf "parameters.%s: parameters.%s sets the same setting" $name (get $keysByCanonicalKey $canonicalKey)) }}
{{- end }}
{{- $_ := set $keysByCanonicalKey $canonicalKey $name }}
{{- if has $canonicalKey $runtimeLockedKeys }}
{{- fail (printf "parameters.%s: Valkey can't change it on running nodes, so set it in files/valkey.conf, which restarts them" $name) }}
{{- end }}
{{- if has $canonicalKey $sensitiveKeys }}
{{- fail (printf "parameters.%s: it would show in the ConfigMap and apply-config's logs, so keep secrets out of parameters" $name) }}
{{- end }}
{{- if has $canonicalKey $chartKeys }}
{{- fail (printf "parameters.%s: the chart sets it in files/valkey.conf or entrypoint.sh" $name) }}
{{- end }}
{{- $_ := set $parameters $name (toString $value) }}
{{- end }}
{{- toJson $parameters }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: valkey-{{ .Values.name }}-config
  namespace: {{ .Values.namespace }}
data:
  valkey.conf: |
{{ .Files.Get "files/valkey.conf" | indent 4 }}
    {{- range $name, $value := include "valkey.parameters" . | fromJson }}
    {{ $name }} {{ quote $value }}
    {{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: valkey-{{ .Values.name }}-acl
  namespace: {{ .Values.namespace }}
data:
  users.acl: |
{{ .Files.Get "files/users.acl" | indent 4 }}

---
# NOTE: a hook for the same reason as the applied Role, and lookup keeps the generated password on upgrades
apiVersion: v1
kind: Secret
metadata:
  name: valkey-{{ .Values.name }}-metrics
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  password: {{ dig "data" "password" (randAlphaNum 32 | b64enc) (lookup "v1" "Secret" .Values.namespace (printf "valkey-%s-metrics" .Values.name)) }}

{{- if not (lookup "v1" "Secret" .Values.namespace (printf "valkey-%s-applied" .Values.name)) }}
---
# NOTE: empty for apply-config to fill; no pre-rollback, which would rerun a stored, empty copy
apiVersion: v1
kind: Secret
metadata:
  name: valkey-{{ .Values.name }}-applied
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-1"
{{- end }}

---
apiVersion: v1
kind: Service
metadata:
  name: valkey-{{ .Values.name }}-headless
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: valkey
    database: {{ .Values.name }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: valkey-{{ .Values.name }}
  ports:
    - name: client
      port: 6379
      targetPort: 6379
    - name: bus
      port: 16379
      targetPort: 16379
    - name: metrics
      port: 9121
      targetPort: 9121

---
apiVersion: v1
kind: Service
metadata:
  name: valkey-{{ .Values.name }}-cluster
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: valkey-{{ .Values.name }}
  ports:
    - port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey-{{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: valkey-{{ .Values.name }}
spec:
  serviceName: &service valkey-{{ .Values.name }}-headless
  podManagementPolicy: Parallel
  replicas: {{ add .Values.cluster.masters (mul .Values.cluster.masters .Values.cluster.replicasPerMaster) }}
  selector:
    matchLabels:
      app: &app valkey-{{ .Values.name }}
  template:
    metadata:
      labels:
        app: *app
      annotations:
        # NOTE: parameters and users.acl apply live through the apply-config hook, so only the fixed valkey.conf restarts pods
        checksum/config: {{ .Files.Get "files/valkey.conf" | sha256sum }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: *app
              topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: {{ .Values.image }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: client
              containerPort: 6379
            - name: bus
              containerPort: 16379
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HEADLESS_SERVICE
              value: *service
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.persistence }}
            - name: PERSISTENCE
              value: {{ .Values.persistence }}
            {{- end }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: &creds-secret {{ .Values.credentials.secret }}
                  key: &admin-key {{ .Values.credentials.dataKeys.adminPassword }}
            - name: CLIENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: *creds-secret
                  key: {{ .Values.credentials.dataKeys.clientPassword }}
            - name: METRICS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: &metrics-secret valkey-{{ .Values.name }}-metrics
                  key: &metrics-key password
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: &data data
              mountPath: /data
            - name: &config config
              mountPath: /tmp/conf_templates/valkey.conf
              subPath: valkey.conf
            - name: &acl acl
              mountPath: /tmp/conf_templates/users.acl
              subPath: users.acl
            - name: &etc-valkey etc-valkey
              mountPath: /etc/valkey
            - name: &tmp tmp
              mountPath: /tmp
            - name: &admin-passwords admin-passwords
              mountPath: /etc/valkey-admin
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 20
            periodSeconds: 10
          # NOTE: replicas turn ready only once synced, so a rollout waits for each restarted replica before the next pod.
          # The secret can change before apply-config applies it, so fall back to the admin password it last applied
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  for password_file in /etc/valkey-admin/current /etc/valkey-admin/applied; do
                  valkey-cli --user admin -a "$(cat "$password_file")" info replication | grep -qE '^(role:master|master_link_status:up)' && exit 0;
                  done; exit 1
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
        - name: prometheus-exporter
          image: oliver006/redis_exporter:v1.96.0@sha256:3d57b9eb142a62ffc600063606a41cd471cd53d81bed10be5b56b3a8918f2c26
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 9121
              protocol: TCP
          env:
            - name: REDIS_ADDR
              value: "redis://localhost:6379"
            - name: REDIS_USER
              value: "metrics"
            # NOTE: CONFIG GET would show primaryauth, the admin password
            - name: REDIS_EXPORTER_CONFIG_COMMAND
              value: "-"
            # NOTE: /scrape?target= sends the metrics password anywhere; Prometheus uses /metrics
            - name: REDIS_EXPORTER_DISABLE_SCRAPE_ENDPOINT
              value: "true"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: *metrics-secret
                  key: *metrics-key
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 9121
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 9121
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: *config
          configMap:
            name: valkey-{{ .Values.name }}-config
        - name: *acl
          configMap:
            name: valkey-{{ .Values.name }}-acl
        - name: *etc-valkey
          emptyDir: {}
        - name: *tmp
          emptyDir: {}
        # NOTE: no subPath, so the kubelet refreshes both files when their secrets change
        - name: *admin-passwords
          projected:
            sources:
              - secret:
                  name: *creds-secret
                  items:
                    - key: *admin-key
                      path: current
              - secret:
                  name: valkey-{{ .Values.name }}-applied
                  optional: true
                  items:
                    - key: adminPassword
                      path: applied
  volumeClaimTemplates:
    - metadata:
        name: *data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 999Pi # local-path does not support storage requests so we use a big number just to show that it's uncapped
