{{- define "valkey.parameters" }}
{{- /* NOTE: entrypoint.sh sets these for persistence, and masteruser and masterauth alias primaryuser and primaryauth */}}
{{- $chartKeys := list "save" "rdb-del-sync-files" "appendonly" "appendfsync" "masteruser" "masterauth" }}
{{- range splitList "\n" (.Files.Get "files/valkey.conf") }}
{{- $line := trim . }}
{{- if and $line (not (hasPrefix "#" $line)) }}
{{- $chartKeys = append $chartKeys (first (splitList " " $line)) }}
{{- end }}
{{- end }}
{{- /* NOTE: Valkey 9.1's IMMUTABLE_CONFIG and PROTECTED_CONFIG settings (src/config.c) and their aliases */}}
{{- $runtimeLockedKeys := list "rdbchecksum" "daemonize" "always-show-logo" "set-proc-title" "repl-mptcp" "syslog-enabled" "cluster-enabled" "disable-thp" "enable-debug-assert" "lua-enable-insecure-api" "lua-enable-deprecated-api" "aclfile" "unixsocket" "unixsocketgroup" "pidfile" "cluster-config-file" "syslog-ident" "dbfilename" "appendfilename" "appenddirname" "server-cpulist" "server_cpulist" "bio-cpulist" "bio_cpulist" "aof-rewrite-cpulist" "aof_rewrite_cpulist" "bgsave-cpulist" "bgsave_cpulist" "logfile" "req-res-logfile" "hash-seed" "supervised" "syslog-facility" "enable-protected-configs" "enable-debug-command" "enable-module-command" "databases" "cluster-databases" "tcp-backlog" "mptcp" "cluster-port" "rdma-rx-size" "rdma-completion-vector" "unixsocketperm" "socket-mark-id" "client-default-resp" "dir" "replicaof" "slaveof" }}
{{- $parameters := dict }}
{{- range $name, $value := .Values.parameters }}
{{- if has (lower $name) $runtimeLockedKeys }}
{{- fail (printf "parameters.%s: Valkey can't change it on running nodes, so set it in files/valkey.conf, which restarts them" $name) }}
{{- end }}
{{- if has (lower $name) $chartKeys }}
{{- fail (printf "parameters.%s: the chart sets it in files/valkey.conf or entrypoint.sh" $name) }}
{{- end }}
{{- $_ := set $parameters $name (toString $value) }}
{{- end }}
{{- toJson $parameters }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: valkey-{{ .Values.name }}-config
  namespace: {{ .Values.namespace }}
data:
  valkey.conf: |
{{ .Files.Get "files/valkey.conf" | indent 4 }}
    {{- range $name, $value := include "valkey.parameters" . | fromJson }}
    {{ $name }} {{ quote $value }}
    {{- end }}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: valkey-{{ .Values.name }}-acl
  namespace: {{ .Values.namespace }}
data:
  users.acl: |
{{ .Files.Get "files/users.acl" | indent 4 }}

---
apiVersion: v1
kind: Service
metadata:
  name: valkey-{{ .Values.name }}-headless
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: valkey
    database: {{ .Values.name }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: valkey-{{ .Values.name }}
  ports:
    - name: client
      port: 6379
      targetPort: 6379
    - name: bus
      port: 16379
      targetPort: 16379
    - name: metrics
      port: 9121
      targetPort: 9121

---
apiVersion: v1
kind: Service
metadata:
  name: valkey-{{ .Values.name }}-cluster
  namespace: {{ .Values.namespace }}
spec:
  type: ClusterIP
  selector:
    app: valkey-{{ .Values.name }}
  ports:
    - port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey-{{ .Values.name }}
  namespace: {{ .Values.namespace }}
  labels:
    app: valkey-{{ .Values.name }}
spec:
  serviceName: &service valkey-{{ .Values.name }}-headless
  podManagementPolicy: Parallel
  replicas: {{ add .Values.cluster.masters (mul .Values.cluster.masters .Values.cluster.replicasPerMaster) }}
  selector:
    matchLabels:
      app: &app valkey-{{ .Values.name }}
  template:
    metadata:
      labels:
        app: *app
      annotations:
        # NOTE: parameters and users.acl apply live through the apply-config hook, so only the fixed valkey.conf restarts pods
        checksum/config: {{ .Files.Get "files/valkey.conf" | sha256sum }}
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: *app
              topologyKey: kubernetes.io/hostname
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: {{ .Values.image }}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: client
              containerPort: 6379
            - name: bus
              containerPort: 16379
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: HEADLESS_SERVICE
              value: *service
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.persistence }}
            - name: PERSISTENCE
              value: {{ .Values.persistence }}
            {{- end }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: &creds-secret {{ .Values.credentials.secret }}
                  key: &admin-key {{ .Values.credentials.dataKeys.adminPassword }}
            - name: CLIENT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: *creds-secret
                  key: {{ .Values.credentials.dataKeys.clientPassword }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: &data data
              mountPath: /data
            - name: &config config
              mountPath: /tmp/conf_templates/valkey.conf
              subPath: valkey.conf
            - name: &acl acl
              mountPath: /tmp/conf_templates/users.acl
              subPath: users.acl
            - name: &etc-valkey etc-valkey
              mountPath: /etc/valkey
            - name: &tmp tmp
              mountPath: /tmp
            - name: &admin-passwords admin-passwords
              mountPath: /etc/valkey-admin
              readOnly: true
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 20
            periodSeconds: 10
          # NOTE: replicas turn ready only once synced, so a rollout waits for each restarted replica before the next pod.
          # The secret can change before apply-config applies it, so fall back to the admin password it last applied
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - >-
                  for password_file in /etc/valkey-admin/current /etc/valkey-admin/applied; do
                  valkey-cli --user admin -a "$(cat "$password_file")" info replication | grep -qE '^(role:master|master_link_status:up)' && exit 0;
                  done; exit 1
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3
        - name: prometheus-exporter
          image: oliver006/redis_exporter:v1.96.0@sha256:3d57b9eb142a62ffc600063606a41cd471cd53d81bed10be5b56b3a8918f2c26
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: metrics
              containerPort: 9121
              protocol: TCP
          env:
            - name: REDIS_ADDR
              value: "redis://localhost:6379"
            - name: REDIS_USER
              value: "admin"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: *creds-secret
                  key: *admin-key
          resources:
            limits:
              cpu: 50m
              memory: 64Mi
            requests:
              cpu: 10m
              memory: 32Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 9121
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 9121
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: *config
          configMap:
            name: valkey-{{ .Values.name }}-config
        - name: *acl
          configMap:
            name: valkey-{{ .Values.name }}-acl
        - name: *etc-valkey
          emptyDir: {}
        - name: *tmp
          emptyDir: {}
        # NOTE: no subPath, so the kubelet refreshes both files when their secrets change
        - name: *admin-passwords
          projected:
            sources:
              - secret:
                  name: *creds-secret
                  items:
                    - key: *admin-key
                      path: current
              - secret:
                  name: valkey-{{ .Values.name }}-applied
                  optional: true
                  items:
                    - key: adminPassword
                      path: applied
  volumeClaimTemplates:
    - metadata:
        name: *data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 999Pi # local-path does not support storage requests so we use a big number just to show that it's uncapped
