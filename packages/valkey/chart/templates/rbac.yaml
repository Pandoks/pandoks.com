apiVersion: v1
kind: ServiceAccount
metadata:
  name: valkey-{{ .Values.name }}-reconciler
  namespace: {{ .Values.namespace }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: valkey-{{ .Values.name }}-reconciler
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: valkey-reconciler
subjects:
  - kind: ServiceAccount
    name: valkey-{{ .Values.name }}-reconciler
    namespace: {{ .Values.namespace }}

---
# NOTE: create can't be limited to resourceNames. Hooks, since Helm creates the release's resources only after the
# pre-upgrade apply-config needs them
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: valkey-{{ .Values.name }}-applied
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  - apiGroups:
      - ''
    resources:
      - secrets
    resourceNames:
      - valkey-{{ .Values.name }}-applied
    verbs:
      - get
      - update
  - apiGroups:
      - ''
    resources:
      - secrets
    verbs:
      - create

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: valkey-{{ .Values.name }}-applied
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade,pre-rollback
    "helm.sh/hook-weight": "-1"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: valkey-{{ .Values.name }}-applied
subjects:
  - kind: ServiceAccount
    name: valkey-{{ .Values.name }}-reconciler
    namespace: {{ .Values.namespace }}
