apiVersion: v1
kind: Secret
metadata:
  name: sst-credentials
  namespace: argocd
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: ${KubernetesArgocdAccessKeyId | quote}
  AWS_SECRET_ACCESS_KEY: ${KubernetesArgocdSecretAccessKey | quote}
  AWS_REGION: ${AwsRegion | quote}
  CLOUDFLARE_API_TOKEN: ${CloudflareApiKey | quote}

---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-auth
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  url: https://github.com/Pandoks/pandoks.com
  username: Pandoks
  password: ${GithubPersonalAccessToken | quote}
