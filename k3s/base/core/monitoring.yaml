# Patch existing Grafana service to add Tailscale annotations
apiVersion: v1
kind: Service
metadata:
  name: kube-prometheus-stack-grafana
  namespace: monitoring
  annotations:
    tailscale.com/expose: 'true'
    tailscale.com/hostname: dev-grafana
    tailscale.com/tags: tag:k8s,tag:dev
spec:
  type: ClusterIP

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana
  namespace: monitoring
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-secrets
  target:
    template:
      mergePolicy: Merge
      data:
        username: admin
  data:
    - secretKey: password
      remoteRef:
        key: KubernetesGrafanaAdminPassword
