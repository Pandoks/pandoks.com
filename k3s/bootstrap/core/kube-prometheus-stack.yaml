apiVersion: v1
kind: Namespace
metadata:
  name: monitoring

---
apiVersion: v1
kind: Secret
metadata:
  name: grafana
  namespace: monitoring
type: Opaque
stringData:
  username: admin
  password: ${KubernetesGrafanaAdminPassword | quote}

---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: kube-prometheus-stack
  namespace: kube-system
spec:
  repo: https://prometheus-community.github.io/helm-charts
  chart: kube-prometheus-stack
  version: 92.17.1
  targetNamespace: monitoring
  createNamespace: true
  failurePolicy: abort
  valuesContent: |-
    # Helm skips crds/ on upgrade, so this pre-upgrade Job applies the chart's CRDs first.
    crds:
      upgradeJob:
        enabled: true
        image:
          busybox:
            # renovate: datasource=docker depName=busybox
            tag: 1.38@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
          kubectl:
            # renovate: datasource=docker depName=registry.k8s.io/kubectl
            tag: v1.36.5@sha256:0667e3f3e6ef435d7cd4c16684244703ebd67314c17511c2a9f87ea44f6cdf6b

    # etcd monitoring disabled by default - enable via HelmChartConfig in overlays
    kubeEtcd:
      enabled: false

    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false

    prometheus:
      prometheusSpec:
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        retention: 7d

    grafana:
      persistence:
        enabled: true
        size: 1Gi
      admin:
        existingSecret: grafana
        userKey: username
        passwordKey: password
