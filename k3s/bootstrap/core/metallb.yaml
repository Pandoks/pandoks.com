apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system

---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: metallb
  namespace: metallb-system
spec:
  repo: https://metallb.github.io/metallb
  chart: metallb
  version: 0.16.1
  targetNamespace: metallb-system
  createNamespace: true
  valuesContent: |-
    # L2-only: no BGPPeer or BFDProfile, so 0.16's default frr-k8s backend is off
    frrk8s:
      enabled: false
