apiVersion: v1
kind: Namespace
metadata:
  name: ingress-controller

---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: haproxy-ingress
  namespace: kube-system
spec:
  repo: https://haproxy-ingress.github.io/charts
  chart: haproxy-ingress
  version: 0.16.2
  targetNamespace: ingress-controller
  createNamespace: true
  # NOTE: if you want to change the ports, look into dual service cutover for zero downtime.
  # we want to let the helm chart manage the service so we don't have to worry about updates and breaking changes.
  # only when we're changing the ports (which should be once in a blue moon) will we then manually
  # manage the service so that we can do the dual service cutover, but then we'll change it back
  # https://github.com/haproxy-ingress/charts/blob/release-0.16/haproxy-ingress/values.yaml
  valuesContent: |-
    controller:
      ingressClassResource:
        enabled: true
      kind: DaemonSet
      # NOTE: the chart only renders the minAvailable PodDisruptionBudget when replicaCount > minAvailable;
      # replicaCount is otherwise unused by the DaemonSet.
      replicaCount: 2
      # NOTE: nodes only have internal IPs, so without this the Ingress status stays empty and Argo
      # reports every Ingress as Progressing.
      extraArgs:
        report-node-internal-ip-address: "true"
      service:
        httpPorts:
          - port: 80
            targetPort: http
            nodePort: 30080
        httpsPorts:
          - port: 443
            targetPort: https
            nodePort: 30443
      config:
        # NOTE: X-Forwarded-For keeps Cloudflare's value and ends with the Cloudflare edge address, so apps
        # should read the client IP from CF-Connecting-IP.
        forwardfor: update
        balance-algorithm: roundrobin
      stats:
        enabled: true
      metrics:
        enabled: true
        embedded: true
        port: 9101
      serviceMonitor:
        enabled: true
        interval: 30s
