apiVersion: v1
kind: Namespace
metadata:
  name: argocd

---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: kube-system
spec:
  repo: https://argoproj.github.io/argo-helm
  chart: argo-cd
  version: 9.7.1
  targetNamespace: argocd
  valuesContent: |-
    configs:
      cm:
        timeout.reconciliation: 180s
        # NOTE: helm-controller sets Failed only once the install Job exhausts its retries (1000 by
        # default), so this rarely fires; deploy-infra.yaml's job and rollout waits are the real gate.
        resource.customizations.health.helm.cattle.io_HelmChart: |
          hs = { status = "Healthy" }
          for _, condition in ipairs((obj.status or {}).conditions or {}) do
            if condition.type == "Failed" and condition.status == "True" then
              hs.status = "Degraded"
              hs.message = condition.message
            end
          end
          return hs
      params:
        server.insecure: true

    server:
      service:
        type: ClusterIP
        annotations:
          tailscale.com/expose: 'true'
          tailscale.com/hostname: ${StageName}-argocd
          tailscale.com/tags: tag:k8s,tag:${StageName}

    repoServer:
      volumes:
        - name: cmp-tmp
          emptyDir: {}
