apiVersion: v1
kind: Namespace
metadata:
  name: argocd

---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argocd
  namespace: kube-system
spec:
  repo: https://argoproj.github.io/argo-helm
  chart: argo-cd
  version: 9.7.1
  targetNamespace: argocd
  valuesContent: |-
    configs:
      cm:
        timeout.reconciliation: 180s
        # NOTE: helm-controller sets Failed only after 1000 Job retries, so this rarely fires.
        resource.customizations.health.helm.cattle.io_HelmChart: |
          local health_status = { status = "Healthy" }
          local helm_chart_status = obj.status or {}
          local helm_chart_conditions = helm_chart_status.conditions or {}
          for _, condition in ipairs(helm_chart_conditions) do
            local helm_job_failed = condition.type == "Failed" and condition.status == "True"
            if helm_job_failed then
              health_status.status = "Degraded"
              health_status.message = condition.message
            end
          end
          return health_status
      params:
        server.insecure: true

    server:
      service:
        type: ClusterIP
        annotations:
          tailscale.com/expose: 'true'
          tailscale.com/hostname: ${StageName}-argocd
          tailscale.com/tags: tag:k8s,tag:${StageName}

    repoServer:
      volumes:
        - name: cmp-tmp
          emptyDir: {}
