# NOTE: placeholders so local needs no AWS or Pulumi stack; keys the local overlay renders need one
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cluster-secrets
spec:
  provider:
    fake:
      data:
        - key: KubernetesGrafanaAdminPassword
          value: local-grafana-admin-password
        - key: HetznerOriginTlsCrt
          value: local-placeholder-not-a-certificate
        - key: HetznerOriginTlsKey
          value: local-placeholder-not-a-key
        - key: CloudflareBackupAccessKey
          value: local-backup-access-key
        - key: CloudflareBackupSecretKey
          value: local-backup-secret-key
        - key: MainMainPostgresSuperuserPassword
          value: local-postgres-superuser-password
        - key: MainMainPostgresAdminPassword
          value: local-postgres-admin-password
        - key: MainMainPostgresClientPassword
          value: local-postgres-client-password
        - key: MainMainPostgresReplicationPassword
          value: local-postgres-replication-password
        - key: MainMainPostgresPatroniPassword
          value: local-postgres-patroni-password
        - key: MainMainValkeyAdminPassword
          value: local-valkey-admin-password
        - key: MainMainValkeyClientPassword
          value: local-valkey-client-password
        - key: MainMainClickhouseAdminPassword
          value: local-clickhouse-admin-password
        - key: MainMainClickhouseClientPassword
          value: local-clickhouse-client-password
