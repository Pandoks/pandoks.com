apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: main-postgres-main-cluster
  namespace: kube-system
spec:
  chart: oci://local-registry:5000/charts/postgres
  plainHTTP: true
  set:
    backup.image: local-registry:5000/pgbackrest:latest
    patroni.image: local-registry:5000/patroni:latest

---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: main-valkey-main-cluster
  namespace: kube-system
spec:
  chart: oci://local-registry:5000/charts/valkey
  plainHTTP: true
  set:
    image: local-registry:5000/valkey:latest
    cluster.reconcilerImage: local-registry:5000/valkey-reconciler:latest

---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: main-clickhouse-main-cluster
  namespace: kube-system
spec:
  chart: oci://local-registry:5000/charts/clickhouse
  plainHTTP: true
  set:
    clickhouse.image: local-registry:5000/clickhouse:latest
    keeper.image: local-registry:5000/clickhouse-keeper:latest
    backup.image: local-registry:5000/clickhouse-backup:latest
