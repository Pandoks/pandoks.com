# NOTE: only the Hetzner load balancer's 443 -> 30443 service sends the PROXY protocol
# (/infra/vps/load-balancers.ts), so only the https bind expects it; 30080 stays plain HTTP.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: haproxy-ingress
  namespace: kube-system
spec:
  valuesContent: |-
    controller:
      config:
        bind-https: ":443 accept-proxy"
