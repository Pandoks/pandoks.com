# NOTE: infra/kubernetes.ts publishes the parameters, and the bootstrap node's cloud-config creates
# the access key Secret (/infra/vps/cloud-config.yaml)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: cluster-secrets
spec:
  provider:
    aws:
      service: ParameterStore
      region: us-west-1
      prefix: /kubernetes/dev/
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: external-secrets-aws
            namespace: external-secrets
            key: access-key-id
          secretAccessKeySecretRef:
            name: external-secrets-aws
            namespace: external-secrets
            key: secret-access-key
