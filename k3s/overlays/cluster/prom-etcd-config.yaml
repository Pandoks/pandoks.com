# NOTE: infra/vps/servers.ts gives the first cluster's control plane 10.0.1.10 onward
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: kube-prometheus-stack
  namespace: kube-system
spec:
  # NOTE: must be abort here too, or a failed upgrade is uninstalled, deleting Grafana's PVC
  failurePolicy: abort
  valuesContent: |-
    kubeEtcd:
      enabled: true
      endpoints:
        - 10.0.1.10
        - 10.0.1.11  # uncomment when adding control-plane-1
        - 10.0.1.12  # uncomment when adding control-plane-2
      service:
        enabled: true
        port: 2381
        targetPort: 2381
