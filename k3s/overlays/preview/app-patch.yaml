# Apps and databases share one disposable namespace in each preview.
apiVersion: v1
kind: Namespace
metadata:
  name: main
$patch: delete
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-auth
  namespace: main
$patch: delete
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: main
$patch: delete
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: main-postgres-main-cluster
  namespace: kube-system
spec:
  createNamespace: false
  set:
    patroni.replicasPerShard: 1
    pgdog.replicas: 1
    pgdog.releaseName: preview-pgdog
    backup.enabled: 'false'
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: main-clickhouse-main-cluster
  namespace: kube-system
spec:
  createNamespace: false
  set:
    clickhouse.replicasPerShard: 1
    keeper.replicas: 1
    backup.enabled: 'false'
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: main-valkey-main-cluster
  namespace: kube-system
spec:
  createNamespace: false
