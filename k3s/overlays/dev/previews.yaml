apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: previews
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: [missingkey=error]
  generators:
    - pullRequest:
        github:
          owner: Pandoks
          repo: pandoks.com
          labels: [preview]
          tokenRef:
            secretName: ghcr-auth
            key: password
        filters:
          - targetBranchMatch: ^main$
        requeueAfterSeconds: 60
  template:
    metadata:
      name: 'preview-{{.number}}'
    spec:
      project: default
      destination:
        server: https://kubernetes.default.svc
        namespace: 'preview-{{.number}}'
      source:
        repoURL: https://github.com/Pandoks/pandoks.com
        targetRevision: 'deploy/preview-{{.number}}'
        path: k3s/overlays/preview
        plugin:
          name: kustomize-sst-render-v1.0
          env:
            - name: DEPLOY_ENV
              value: preview
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - ServerSideApply=true
