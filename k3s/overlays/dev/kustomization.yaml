apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/core
  - ../../base/monitoring
  - ../../bootstrap/dev
  - ../cluster
  - argocd.yaml
  - previews.yaml
components:
  - ../../components/images
patches:
