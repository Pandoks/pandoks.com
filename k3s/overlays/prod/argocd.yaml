apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-cluster
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
  project: default
  source:
    path: k3s/overlays/prod
    plugin:
      name: kustomize-sst-render-v1.0
      env:
        - name: DEPLOY_ENV
          value: prod
    repoURL: https://github.com/Pandoks/pandoks.com
    targetRevision: deploy/production
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-application-annotator
rules:
  - apiGroups: ['argoproj.io']
    resources: ['applications']
    verbs: ['get', 'patch', 'update']

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-deployer-binding
subjects:
  - kind: Group
    name: argocd-deployer
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: argocd-application-annotator
  apiGroup: rbac.authorization.k8s.io
