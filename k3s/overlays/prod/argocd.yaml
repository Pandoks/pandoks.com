apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-cluster
  namespace: argocd
spec:
  destination:
    server: https://kubernetes.default.svc
  project: default
  source:
    path: k3s/overlays/prod
    plugin:
      name: kustomize-sst-render-v1.0
      env:
        - name: DEPLOY_ENV
          value: prod
    repoURL: https://github.com/Pandoks/pandoks.com
    targetRevision: deploy/production
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
