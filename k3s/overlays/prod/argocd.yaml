# patches argocd to include a sidecar container plugin to render kustomize with image variables
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      securityContext:
        runAsUser: 999
      containers:
        - name: kustomize-pulumi-render
          image: ghcr.io/pandoks/argocd-pulumi-plugin:main
          # The mutable tag must be re-pulled on restart, or a node keeps serving a cached old renderer.
          imagePullPolicy: Always
          command: [/var/run/argocd/argocd-cmp-server]
          securityContext:
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: var-files
              mountPath: /var/run/argocd
            - name: plugins
              mountPath: /home/argocd/cmp-server/plugins
            - name: cmp-tmp
              mountPath: /tmp

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-cluster
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Pandoks/pandoks.com
    targetRevision: main
    path: k3s/overlays/prod
    plugin:
      name: kustomize-pulumi-render-v1.0
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-application-annotator
rules:
  - apiGroups: ['argoproj.io']
    resources: ['applications']
    verbs: ['get', 'patch', 'update']

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-deployer-binding
subjects:
  - kind: Group
    name: argocd-deployer
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: argocd-application-annotator
  apiGroup: rbac.authorization.k8s.io

---
# NOTE: deploy-infra.yaml writes the External Secrets access key after every production `pulumi up`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-aws-writer
  namespace: external-secrets
rules:
  - apiGroups: ['']
    resources: ['secrets']
    resourceNames: ['external-secrets-aws']
    verbs: ['patch']

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-deployer-external-secrets-aws
  namespace: external-secrets
subjects:
  - kind: Group
    name: argocd-deployer
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: external-secrets-aws-writer
  apiGroup: rbac.authorization.k8s.io
