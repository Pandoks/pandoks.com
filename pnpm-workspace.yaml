packages:
  - apps/*
  - packages/*
  - scripts/claude-review

engineStrict: true
nodeLinker: hoisted # needed for electron
publicHoistPattern:
  - electron
enablePrePostScripts: false # supply-chain: block pre/post lifecycle scripts on `pnpm <script>`

# pnpm 12 records packageManagerDependencies as a second YAML document by default;
# ignore keeps a single-document lockfile (Codex/CI single-doc consumers).
pmOnFail: ignore

# supply-chain: dependency build-script allowlist (enablePrePostScript exceptions)
allowBuilds:
  esbuild: true
  electron: true
  electron-winstaller: true
  sharp: true
  fs-xattr: true # @electron-forge/maker-dmg (packaging)
  macos-alias: true # @electron-forge/maker-dmg (packaging)
  '@parcel/watcher': false # jest (prebuilt binary)
  unrs-resolver: false # jest (prebuilt binary)

# TODO: remove override when upstream bumps its pinned dep (fix CVEs)
overrides:
  '@expo/plist@0.0.18>@xmldom/xmldom': 0.8.15 # @bacons/apple-targets → @bacons/xcode → @expo/plist@0.0.18; 0.9 needs a mimeType it omits
  picomatch: 4.0.7 # @electron-forge/cli + vite-plugin-static-copy → anymatch@^2.x
  tar: 7.5.22 # @electron-forge/cli → @electron/node-gyp@^6.x; floor for GHSA-23hp-3jrh-7fpw + 5 more tar CVEs
  tmp: 0.2.7 # @electron-forge/cli → external-editor@^0.0.33; floor for GHSA-ph9p-34f9-6g65
  '@electron/node-gyp': 10.2.0-electron.2 # @electron-forge/cli → @electron/rebuild@3.7
  sharp: 0.35.5 # @sveltejs/enhanced-img + vite-imagetools pin ^0.34.1; floor for GHSA-f88m-g3jw-g9cj
  react: 19.3.0 # one hoisted copy: react-native needs this exact version, and electron-forge's ink logger breaks on two
