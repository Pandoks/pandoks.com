vulnerabilities:
  # Go stdlib + x/net + x/text CVEs in kubectl (argocd image). As of 2026-08-14 the latest kubectl
  # v1.36.3 builds on Go 1.26.5 with x/net v0.49.0 and x/text v0.33.0; these need x/net 0.56.0
  # (GO-2026-5029/5030/5026 need 0.55.0, CVE-2026-46600 needs 0.56.0), x/text 0.39.0
  # (CVE-2026-56852), and Go 1.26.6 (CVE-2026-39821/46600 stdlib). release-1.36 HEAD already
  # carries x/net v0.56.0, so the next patch release (v1.36.4) should clear the set. Unreachable:
  # kubectl only talks to the cluster API. Drop once a kubectl built on Go 1.26.6+, x/net 0.56.0+
  # and x/text 0.39.0+ lands; expired_at forces re-review otherwise.
  - id: CVE-2026-25681
    paths:
      - usr/local/bin/kubectl
    statement: x/net/html XSS; kubectl parses no untrusted HTML
    expired_at: 2026-11-12
  - id: CVE-2026-27136
    paths:
      - usr/local/bin/kubectl
    statement: x/net/html parsing-bypass XSS; kubectl parses no untrusted HTML
    expired_at: 2026-11-12
  - id: CVE-2026-33814
    paths:
      - usr/local/bin/kubectl
    statement: x/net http2 SETTINGS-frame DoS needs a malicious server; kubectl talks only to in-cluster API
    expired_at: 2026-11-12
  - id: CVE-2026-39821
    paths:
      - usr/local/bin/kubectl
    statement: x/net/idna Punycode privilege escalation; kubectl resolves hosts from kubeconfig only
    expired_at: 2026-11-12
  - id: CVE-2026-46600
    paths:
      - usr/local/bin/kubectl
    statement: x/net dnsmessage DoS via invalid DNS records; kubectl resolves hosts from kubeconfig only
    expired_at: 2026-11-12
  - id: CVE-2026-56852
    paths:
      - usr/local/bin/kubectl
    statement: x/text DoS via invalid UTF-8; kubectl processes trusted cluster API output only
    expired_at: 2026-11-12

misconfigurations:
  # KSV-0109 false positive: flags `password:`/`secret:`-named keys in these ConfigMaps, but the
  # values are envsubst placeholders or nulls — real secrets come from a Secret via secretKeyRef.
  - id: AVD-KSV-0109
    paths:
      - templates/clickhouse.yaml
      - templates/patroni.yaml
    statement: ConfigMap holds envsubst placeholders, not real secrets
  # KSV-0056: Patroni needs write access to endpoints & services for endpoint-DCS leader election (matches upstream patroni/patroni example RBAC).
  # The patroni ServiceAccount is already trusted for HA state.
  - id: AVD-KSV-0056
    paths:
      - base/core/postgres.yaml
    statement: Patroni endpoint-DCS leader election requires endpoints write
