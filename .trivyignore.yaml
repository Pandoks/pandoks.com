vulnerabilities:
  # kubectl v1.36.3 is the latest stable release but is still compiled with Go 1.26.5 and vendors
  # x/net v0.49.0 and x/text v0.33.0. These parser/network CVEs are not exposed as services:
  # kubectl talks to the configured cluster API and processes operator-controlled manifests. Drop
  # when Kubernetes ships a stable kubectl compiled with fixed dependencies; expired_at forces
  # re-review otherwise.
  - id: CVE-2026-25681
    paths:
      - usr/local/bin/kubectl
    statement: x/net/html XSS; kubectl parses no untrusted HTML
    expired_at: 2026-11-10
  - id: CVE-2026-27136
    paths:
      - usr/local/bin/kubectl
    statement: x/net/html parsing-bypass XSS; kubectl parses no untrusted HTML
    expired_at: 2026-11-10
  - id: CVE-2026-33814
    paths:
      - usr/local/bin/kubectl
    statement: x/net http2 SETTINGS-frame DoS needs a malicious server; kubectl talks only to in-cluster API
    expired_at: 2026-11-10
  - id: CVE-2026-39821
    paths:
      - usr/local/bin/kubectl
    statement: x/net/idna Punycode privilege escalation; kubectl resolves hosts from kubeconfig only
    expired_at: 2026-11-10
  - id: CVE-2026-46600
    paths:
      - usr/local/bin/kubectl
    statement: x/net DNS parser DoS requires malformed DNS input; kubectl uses operator-selected cluster endpoints
    expired_at: 2026-11-10
  - id: CVE-2026-56852
    paths:
      - usr/local/bin/kubectl
    statement: x/text invalid UTF-8 DoS is limited to operator-controlled manifests and cluster responses
    expired_at: 2026-11-10
  - id: CVE-2026-33818
    paths:
      - usr/local/bin/kubectl
    statement: encoding/asn1 recursion DoS is limited to operator-controlled manifests and cluster responses
    expired_at: 2026-11-10
  - id: CVE-2026-56853
    paths:
      - usr/local/bin/kubectl
    statement: cleartext HTTP/2 DoS requires a malicious endpoint; kubectl uses operator-selected cluster APIs
    expired_at: 2026-11-10
  - id: CVE-2026-56858
    paths:
      - usr/local/bin/kubectl
    statement: html/template XSS is unreachable because kubectl does not render untrusted HTML templates
    expired_at: 2026-11-10
  - id: CVE-2026-56859
    paths:
      - usr/local/bin/kubectl
    statement: XML recursion DoS is limited to operator-controlled manifests and cluster responses
    expired_at: 2026-11-10
  - id: CVE-2026-56860
    paths:
      - usr/local/bin/kubectl
    statement: net/url path DoS requires input from an operator-selected cluster or manifest
    expired_at: 2026-11-10
  - id: CVE-2026-56862
    paths:
      - usr/local/bin/kubectl
    statement: TLS KeyUpdate DoS requires a malicious endpoint; kubectl uses operator-selected cluster APIs
    expired_at: 2026-11-10

misconfigurations:
  # KSV-0109 false positive: flags `password:`/`secret:`-named keys in these ConfigMaps, but the
  # values are envsubst placeholders or nulls — real secrets come from a Secret via secretKeyRef.
  - id: AVD-KSV-0109
    paths:
      - templates/clickhouse.yaml
      - templates/patroni.yaml
    statement: ConfigMap holds envsubst placeholders, not real secrets
  # KSV-0056: Patroni needs write access to endpoints & services for endpoint-DCS leader election (matches upstream patroni/patroni example RBAC).
  # The patroni ServiceAccount is already trusted for HA state.
  - id: AVD-KSV-0056
    paths:
      - base/core/postgres.yaml
    statement: Patroni endpoint-DCS leader election requires endpoints write
