name: personal
description: pandoks.com infrastructure
main: infra/index.ts
runtime:
  name: nodejs
  options:
    packagemanager: pnpm
backend:
  url: s3://pandoks-pulumi-state?endpoint=<cloudflare-account-id>.r2.cloudflarestorage.com&region=auto&s3ForcePathStyle=true&awssdk=v2&profile=pandoks-pulumi-state
config:
  aws:region:
    value: us-west-1
  pulumi:disable-default-providers:
    value: [cloudflare, github, hcloud, ovh, tailscale]
