[workspace]
resolver = "3"
members = [
    "packages/gpui",
    "templates/native-desktop",
]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.29.3", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.29.3", default-features = false, features = ["font-kit", "wayland", "x11"] }
pandoks-gpui = { path = "packages/gpui" }
rand = "=0.9.5"
ttf-parser = "=0.25.1"
unicode-segmentation = "=1.13.3"
wuff = { version = "=0.2.10", default-features = false, features = ["brotli"] }

[profile.release]
strip = true
panic = "abort"
