[workspace]
resolver = "3"
members = [
    "packages/gpui",
    "templates/native-desktop",
]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.29.3" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.29.3", features = ["font-kit", "wayland", "x11"] }
pandoks-gpui = { path = "packages/gpui" }
wuff = "=0.2.10"

[profile.release]
strip = true
panic = "abort"
