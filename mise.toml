[tools]
pnpm = "11.25.0"
node = "24.20.0"
go = "1.27.0"
uv = "0.12.7"
python = "3.14.7"
aws-cli = "2.36.34"
gh = "2.98.0"
jq = "1.8.2"

helm = "4.2.4"
kubectl = "1.37.0"
k9s = "0.51.0"
k3d = "5.9.0"
kubeconform = "0.8.0"

shellcheck = "0.11.0"
shfmt = "3.14.0"
hadolint = "2.15.1"
actionlint = "1.7.12"
golangci-lint = "2.13.2"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.3.0"

[settings]
python.uv_venv_auto = "source" # auto-activate uv-created .venvs (uv.lock projects)

[env]
# uv resolves interpreters from PATH (mise's python) instead of downloading its own
UV_PYTHON_PREFERENCE = "system"
