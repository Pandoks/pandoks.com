[tools]
pnpm = "11.5.1"
node = "24.19.0"
go = "1.26.6"
uv = "0.12.5"
python = "3.14.7"
aws-cli = "2.36.24"
gh = "2.97.0"
jq = "1.8.2"

helm = "4.2.4"
kubectl = "1.36.2"
k9s = "0.51.0"
k3d = "5.9.0"
kubeconform = "0.8.0"

shellcheck = "0.11.0"
shfmt = "3.13.1"
hadolint = "2.15.1"
actionlint = "1.7.12"
golangci-lint = "2.12.2"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.3.0"

[settings]
python.uv_venv_auto = "source" # auto-activate uv-created .venvs (uv.lock projects)

[env]
# uv resolves interpreters from PATH (mise's python) instead of downloading its own
UV_PYTHON_PREFERENCE = "system"
