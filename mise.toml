[tools]
pnpm = "12.16.1"
node = "24.22.2"
go = "1.27.4"
uv = "0.13.6"
python = "3.15.2"
aws-cli = "2.39.3"
gh = "2.103.3"
jq = "1.8.2"

helm = "4.3.1"
kubectl = "1.37.2"
kustomize = "5.8.3"
k9s = "0.51.0"
k3d = "5.9.0"
kubeconform = "0.8.0"

shellcheck = "0.11.0"
shfmt = "3.14.1"
hadolint = "2.15.1"
actionlint = "1.7.12"
golangci-lint = "2.15.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"

ruby = "4.0.9"
java = "temurin-17.0.21+9"
cocoapods = "1.17.0"
maestro = { version = "2.11.0", version_prefix = "cli-" }

[settings]
python.uv_venv_auto = "source" # auto-activate uv-created .venvs (uv.lock projects)

[env]
# uv resolves interpreters from PATH (mise's python) instead of downloading its own
UV_PYTHON_PREFERENCE = "system"
