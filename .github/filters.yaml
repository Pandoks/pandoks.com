shared-node-setup: &shared-node-setup
  - '.github/filters.yaml'
  - '.github/actions/setup-node-pnpm/**'
  - 'mise.toml'
  - 'package.json'
  - 'pnpm-lock.yaml'
  - 'pnpm-workspace.yaml'
shared-mise-setup: &shared-mise-setup
  - '.github/filters.yaml'
  - '.github/actions/setup-mise/**'
  - 'mise.toml'
checks-workflow: &checks-workflow
  - '.github/workflows/checks.yaml'
tests-workflow: &tests-workflow
  - '.github/workflows/tests.yaml'

# checks.yaml
prettier:
  - '**/*.ts'
  - '**/*.tsx'
  - '**/*.js'
  - '**/*.jsx'
  - '**/*.svelte'
  - '**/*.md'
  - '**/*.json'
  - '**/*.yaml'
  - '**/*.yml'
  - '**/*.css'
  - '.prettierrc'
  - '.prettierignore'
  - 'scripts/format/**'
  - *shared-node-setup
  - *checks-workflow
eslint:
  - '**/*.ts'
  - '**/*.tsx'
  - '**/*.js'
  - '**/*.jsx'
  - '**/*.svelte'
  - 'eslint.config.ts'
  - 'tsconfig.eslint.json'
  - 'scripts/lint/**'
  - *shared-node-setup
  - *checks-workflow
go:
  - '**/*.go'
  - '**/go.mod'
  - '**/go.sum'
  - 'go.work'
  - 'go.work.sum'
  - '.golangci.yaml'
  - 'scripts/format/**'
  - 'scripts/lint/**'
  - *shared-mise-setup
  - *checks-workflow
shell:
  - '**/*.sh'
  - '.shellcheckrc'
  - *shared-mise-setup
  - *checks-workflow
helm:
  - '**/chart/**'
  - 'scripts/lint/**'
  - *shared-mise-setup
  - *checks-workflow
actions:
  - '.github/workflows/**'
  - '.github/actions/**'
renovate:
  - 'renovate.json'
  - 'renovate.json5'
  - '.renovaterc'
  - '.renovaterc.json'
  - '.renovaterc.json5'
  - '.github/filters.yaml'
  - *checks-workflow
infra:
  - 'infra/**'
  - 'sst.config.ts'
  - 'tsconfig.json'
  - *shared-node-setup
  - *checks-workflow

# tests.yaml
web:
  - 'apps/web/**'
  - 'packages/svelte/**'
  - *shared-node-setup
  - *tests-workflow
desktop:
  - 'apps/desktop-template/**'
  - 'packages/svelte/**'
  - *shared-node-setup
  - *tests-workflow
svelte:
  - 'packages/svelte/**'
  - *shared-node-setup
  - *tests-workflow
prettier-pkg:
  - 'packages/prettier/**'
  - *shared-node-setup
  - *tests-workflow
valkey-reconciler:
  - 'packages/valkey/reconciler/**'
  - 'packages/valkey/package.json'
  - 'go.work'
  - 'go.work.sum'
  - *shared-node-setup
  - *tests-workflow
