name: Checks

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      jobs:
        description: JSON list of the check groups to run, like ["prettier","go"]; workspace-check always runs.
        type: string
        required: true

jobs:
  # ─── JS / TS ──────────────────────────────────────────────────────────
  format-js:
    if: contains(fromJSON(inputs.jobs), 'prettier')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Run Prettier check
        run: pnpm format check js

  lint-js:
    if: contains(fromJSON(inputs.jobs), 'eslint')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Run ESLint
        run: pnpm lint js

  # ─── Go ───────────────────────────────────────────────────────────────
  format-go:
    if: contains(fromJSON(inputs.jobs), 'go')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-mise
        with:
          tools: go golangci-lint

      - name: Run format check
        run: ./scripts/format/main.sh check go

  lint-go:
    if: contains(fromJSON(inputs.jobs), 'go')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - uses: ./.github/actions/setup-mise
        with:
          tools: go golangci-lint

      - name: Run lint
        run: ./scripts/lint/main.sh go

  # ─── Shell ────────────────────────────────────────────────────────────
  format-shell:
    if: contains(fromJSON(inputs.jobs), 'shell')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-mise
        with:
          tools: shfmt

      - name: Run format check
        run: ./scripts/format/main.sh check shell

  lint-shell:
    if: contains(fromJSON(inputs.jobs), 'shell')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-mise
        with:
          tools: shellcheck

      - name: Run ShellCheck
        run: ./scripts/lint/main.sh shell

  # ─── Helm ─────────────────────────────────────────────────────────────
  lint-helm:
    if: contains(fromJSON(inputs.jobs), 'helm')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-mise
        with:
          tools: helm kubeconform

      - name: Run helm lint chain
        run: ./scripts/lint/main.sh helm

  # ─── GitHub Actions ───────────────────────────────────────────────────
  lint-actions:
    if: contains(fromJSON(inputs.jobs), 'actions')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run actionlint
        uses: reviewdog/action-actionlint@619a81ec64ff8c0211cd6146eb2b21e8f1d7f440 # v1.81.1
        with:
          fail_level: info

  # ─── Renovate ─────────────────────────────────────────────────────────
  validate-renovate:
    if: contains(fromJSON(inputs.jobs), 'renovate')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate renovate.json
        uses: docker://ghcr.io/renovatebot/renovate:44@sha256:05b3a6b06d2c452e11bf0f3cd792f13d44d7e37b9a4bbd8106f6de6f5de4842b
        with:
          entrypoint: renovate-config-validator
          args: --strict --no-global renovate.json

  # ─── Workspace checks ─────────────────────────────────────────────────
  workspace-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-node-pnpm

      # NOTE: If a workspace `check` adds a non-npm system binary (Go, helm, hadolint, etc.),
      # add an install step above this — mirror the pattern in the `format-go` / `lint-helm` jobs.
      - name: Run workspace checks
        env:
          BASE: ${{ github.base_ref || 'main' }}
        run: pnpm --filter "...[origin/${BASE}]" --if-present check

  # ─── Infra typecheck ──────────────────────────────────────────────────
  check-infra:
    if: contains(fromJSON(inputs.jobs), 'infra')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Typecheck infra
        run: pnpm check:infra
