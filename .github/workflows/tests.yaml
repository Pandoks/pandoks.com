name: Tests

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
      mobile-template: ${{ steps.filter.outputs.mobile-template }}
      svelte: ${{ steps.filter.outputs.svelte }}
      prettier: ${{ steps.filter.outputs.prettier }}
      valkey-reconciler: ${{ steps.filter.outputs.valkey-reconciler }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/svelte/**'
            desktop:
              - 'apps/desktop-template/**'
              - 'packages/svelte/**'
            mobile-template:
              - 'apps/mobile-template/**'
            svelte:
              - 'packages/svelte/**'
            prettier:
              - 'packages/prettier/**'
            valkey-reconciler:
              - 'packages/valkey/reconciler/**'

  test-web:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm --filter @pandoks.com/web exec playwright install --with-deps chromium

      - name: Run web tests
        run: pnpm --filter @pandoks.com/web test

  test-desktop:
    needs: detect-changes
    if: needs.detect-changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm --filter @pandoks.com/desktop-template exec playwright install --with-deps chromium

      - name: Run desktop tests
        run: xvfb-run -a pnpm --filter @pandoks.com/desktop-template test

  test-mobile-template:
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile-template == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Check Expo SDK versions
        run: pnpm --filter @pandoks.com/mobile-template exec expo install --check

      - name: Run mobile unit tests
        run: pnpm --filter @pandoks.com/mobile-template test:unit

      - name: Generate native projects
        run: pnpm --filter @pandoks.com/mobile-template exec expo prebuild --no-install

      - name: Bundle iOS and Android JS
        run: pnpm --filter @pandoks.com/mobile-template exec expo export

  test-svelte-pkg:
    needs: detect-changes
    if: needs.detect-changes.outputs.svelte == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm --filter @pandoks.com/svelte exec playwright install --with-deps chromium

      - name: Run svelte package tests
        run: pnpm --filter @pandoks.com/svelte test

  test-prettier-pkg:
    needs: detect-changes
    if: needs.detect-changes.outputs.prettier == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Run prettier package tests
        run: pnpm --filter @pandoks.com/prettier test

  test-valkey-reconciler:
    needs: detect-changes
    if: needs.detect-changes.outputs.valkey-reconciler == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/valkey/reconciler/go.mod
          cache-dependency-path: packages/valkey/reconciler/go.sum

      - name: Run tests
        run: pnpm --filter @pandoks.com/valkey test

  tests-pass:
    needs:
      - test-web
      - test-desktop
      - test-mobile-template
      - test-svelte-pkg
      - test-prettier-pkg
      - test-valkey-reconciler
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "ok"
