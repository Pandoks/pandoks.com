name: Tests

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
      svelte: ${{ steps.filter.outputs.svelte }}
      prettier: ${{ steps.filter.outputs.prettier }}
      queue: ${{ steps.filter.outputs.queue }}
      valkey-reconciler: ${{ steps.filter.outputs.valkey-reconciler }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/svelte/**'
            desktop:
              - 'apps/desktop-template/**'
              - 'packages/svelte/**'
            svelte:
              - 'packages/svelte/**'
            prettier:
              - 'packages/prettier/**'
            queue:
              - '.github/actions/setup-mise/**'
              - 'mise.toml'
              - 'packages/queue/**'
              - 'packages/valkey/chart/files/users.acl'
            valkey-reconciler:
              - 'packages/valkey/reconciler/**'

  test-web:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm --filter @pandoks.com/web exec playwright install --with-deps chromium

      - name: Run web tests
        run: pnpm --filter @pandoks.com/web test

  test-desktop:
    needs: detect-changes
    if: needs.detect-changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm --filter @pandoks.com/desktop-template exec playwright install --with-deps chromium

      - name: Run desktop tests
        run: xvfb-run -a pnpm --filter @pandoks.com/desktop-template test

  test-svelte-pkg:
    needs: detect-changes
    if: needs.detect-changes.outputs.svelte == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm --filter @pandoks.com/svelte exec playwright install --with-deps chromium

      - name: Run svelte package tests
        run: pnpm --filter @pandoks.com/svelte test

  test-prettier-pkg:
    needs: detect-changes
    if: needs.detect-changes.outputs.prettier == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Run prettier package tests
        run: pnpm --filter @pandoks.com/prettier test

  test-queue-pkg:
    needs: detect-changes
    if: needs.detect-changes.outputs.queue == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/queue/go.mod
          cache-dependency-path: packages/queue/go.sum

      - uses: ./.github/actions/setup-mise
        with:
          tools: uv python

      - name: Start Moto and Valkey
        run: docker compose -f packages/queue/compose.yaml up -d --wait

      - name: Run tests
        run: pnpm --filter @pandoks.com/queue test

  # NOTE: Cloudflare Queues has no emulator, so this job creates this run's queues and deletes them
  test-queue-cloudflare:
    needs: detect-changes
    if: needs.detect-changes.outputs.queue == 'true'
    runs-on: ubuntu-latest
    environment: dev
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_QUEUES_API_TOKEN }}
      QUEUE_PREFIX: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/queue/go.mod
          cache-dependency-path: packages/queue/go.sum

      - uses: ./.github/actions/setup-mise
        with:
          tools: uv python jq

      - name: Create this run's queues
        id: queues
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Add a Cloudflare API token with Account > Queues > Edit as CLOUDFLARE_QUEUES_API_TOKEN in the dev environment}"
          api() {
            curl --fail-with-body -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues$1" "${@:2}"
          }
          for name in dlq queue subscription; do
            id=$(api '' -d "{\"queue_name\":\"${QUEUE_PREFIX}-${name}\"}" | jq -er .result.queue_id)
            echo "${name}=${id}" >> "${GITHUB_OUTPUT}"
            consumer='{"type":"http_pull"}'
            if [ "${name}" = queue ]; then
              consumer="{\"type\":\"http_pull\",\"dead_letter_queue\":\"${QUEUE_PREFIX}-dlq\",\"settings\":{\"max_retries\":2}}"
            fi
            api "/${id}/consumers" -d "${consumer}" > /dev/null
          done

      - name: Run Cloudflare tests
        env:
          QUEUE_TEST_CLOUDFLARE_QUEUE: ${{ steps.queues.outputs.queue }}
          QUEUE_TEST_CLOUDFLARE_DLQ: ${{ steps.queues.outputs.dlq }}
          QUEUE_TEST_CLOUDFLARE_SUBSCRIPTION: ${{ steps.queues.outputs.subscription }}
        working-directory: packages/queue
        run: |
          GOWORK=off go test -race -count=1 -run Cloudflare ./...
          uv run --project ./python --frozen --all-extras python -m unittest discover -s ./python/tests -k Cloudflare
          pnpm exec vitest run src/cloudflare.test.ts src/contract.test.ts -t cloudflare

      - name: Delete this run's queues
        if: always() && steps.queues.outputs.dlq != ''
        env:
          QUEUE_IDS: ${{ steps.queues.outputs.dlq }} ${{ steps.queues.outputs.queue }} ${{ steps.queues.outputs.subscription }}
        run: |
          api() {
            curl --fail-with-body -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/queues$1" "${@:2}"
          }
          failed=0
          for id in ${QUEUE_IDS}; do
            for consumer in $(api "/${id}/consumers" | jq -er '.result[].consumer_id'); do
              api "/${id}/consumers/${consumer}" -X DELETE > /dev/null || failed=1
            done
            api "/${id}" -X DELETE > /dev/null || failed=1
          done
          exit "${failed}"

  test-valkey-reconciler:
    needs: detect-changes
    if: needs.detect-changes.outputs.valkey-reconciler == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/valkey/reconciler/go.mod
          cache-dependency-path: packages/valkey/reconciler/go.sum

      - name: Run tests
        run: pnpm --filter @pandoks.com/valkey test

  tests-pass:
    needs:
      - detect-changes
      - test-web
      - test-desktop
      - test-svelte-pkg
      - test-prettier-pkg
      - test-queue-pkg
      - test-queue-cloudflare
      - test-valkey-reconciler
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
