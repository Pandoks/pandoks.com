name: Tests

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
      svelte: ${{ steps.filter.outputs.svelte }}
      valkey-reconciler: ${{ steps.filter.outputs.valkey-reconciler }}
      release: ${{ steps.filter.outputs.release }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            web:
              - 'apps/web/**'
              - 'packages/svelte/**'
            desktop:
              - 'apps/desktop-template/**'
              - 'packages/svelte/**'
            svelte:
              - 'packages/svelte/**'
            release:
              - 'scripts/ci/**'
              - 'k3s/components/images/**'
              - '.github/workflows/build-and-publish.yaml'
            valkey-reconciler:
              - 'packages/valkey/reconciler/**'

  test-web:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm --filter @pandoks.com/web exec playwright install --with-deps chromium

      - name: Run web tests
        run: pnpm --filter @pandoks.com/web test

  test-desktop:
    needs: detect-changes
    if: needs.detect-changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm --filter @pandoks.com/desktop-template exec playwright install --with-deps chromium

      - name: Run desktop tests
        run: pnpm --filter @pandoks.com/desktop-template test

  test-svelte-pkg:
    needs: detect-changes
    if: needs.detect-changes.outputs.svelte == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm --filter @pandoks.com/svelte exec playwright install --with-deps chromium

      - name: Run svelte package tests
        run: pnpm --filter @pandoks.com/svelte test

  test-valkey-reconciler:
    needs: detect-changes
    if: needs.detect-changes.outputs.valkey-reconciler == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: ./.github/actions/setup-node-pnpm

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/valkey/reconciler/go.mod
          cache-dependency-path: packages/valkey/reconciler/go.sum

      - name: Run tests
        run: pnpm --filter @pandoks.com/valkey test

  test-release:
    needs: detect-changes
    if: needs.detect-changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup-mise
        with:
          tools: kustomize yq
      - run: python3 -B -m unittest discover -s scripts/ci/tests -v

  tests-pass:
    needs:
      - test-web
      - test-desktop
      - test-svelte-pkg
      - test-valkey-reconciler
      - test-release
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "ok"
