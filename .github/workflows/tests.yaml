name: Tests

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      jobs:
        description: JSON list of the unit test jobs to run, like ["web","valkey-reconciler"].
        type: string
        required: true

jobs:
  test-web:
    if: contains(fromJSON(inputs.jobs), 'web')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm --filter @pandoks.com/web exec playwright install --with-deps chromium

      - name: Run web tests
        run: pnpm --filter @pandoks.com/web test

  test-desktop-template:
    if: contains(fromJSON(inputs.jobs), 'desktop-template')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm --filter @pandoks.com/desktop exec playwright install --with-deps chromium

      - name: Run desktop template tests
        run: xvfb-run -a pnpm --filter @pandoks.com/desktop test

  test-mobile-template:
    if: contains(fromJSON(inputs.jobs), 'mobile-template')
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      # NOTE: offline, so Expo patches still inside Renovate's minimumReleaseAge don't fail every PR
      - name: Check Expo SDK versions
        env:
          EXPO_OFFLINE: '1'
        run: pnpm --filter @pandoks.com/mobile exec expo install --check

      - name: Run mobile unit tests
        run: pnpm --filter @pandoks.com/mobile test:unit

      - name: Generate native projects
        run: pnpm --filter @pandoks.com/mobile exec expo prebuild --no-install

      - name: Bundle iOS and Android JS
        run: pnpm --filter @pandoks.com/mobile exec expo export

  test-mobile-template-android:
    if: contains(fromJSON(inputs.jobs), 'mobile-template')
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - uses: ./.github/actions/setup-mise
        with:
          tools: java
          working_directory: templates/mobile

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Generate Android project
        run: pnpm --filter @pandoks.com/mobile exec expo prebuild --platform android --no-install

      - name: Compile Android release
        working-directory: templates/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

  test-mobile-template-ios:
    if: contains(fromJSON(inputs.jobs), 'mobile-template')
    runs-on: macos-26
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - uses: ./.github/actions/setup-mise
        with:
          tools: ruby cocoapods
          working_directory: templates/mobile

      - name: Generate iOS project
        run: pnpm --filter @pandoks.com/mobile exec expo prebuild --platform ios --no-install

      - name: Install pods
        working-directory: templates/mobile/ios
        run: pod install

      - name: Compile iOS simulator release
        working-directory: templates/mobile/ios
        run: >-
          xcodebuild build -workspace MobileTemplate.xcworkspace -scheme MobileTemplate
          -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64 CODE_SIGNING_ALLOWED=NO

  test-svelte-pkg:
    if: contains(fromJSON(inputs.jobs), 'svelte')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm --filter @pandoks.com/svelte exec playwright install --with-deps chromium

      - name: Run svelte package tests
        run: pnpm --filter @pandoks.com/svelte test

  test-prettier-pkg:
    if: contains(fromJSON(inputs.jobs), 'prettier')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Run prettier package tests
        run: pnpm --filter @pandoks.com/prettier test

  test-valkey-reconciler:
    if: contains(fromJSON(inputs.jobs), 'valkey-reconciler')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/valkey/reconciler/go.mod
          cache-dependency-path: packages/valkey/reconciler/go.sum

      - name: Run tests
        run: pnpm --filter @pandoks.com/valkey test

  test-mobile-updates:
    if: contains(fromJSON(inputs.jobs), 'mobile-updates')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Run tests
        run: pnpm --filter @pandoks.com/mobile-updates test
