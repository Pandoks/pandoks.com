name: Tests

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      jobs:
        description: JSON list of the unit test jobs to run, like ["web","valkey-reconciler"].
        type: string
        required: true

jobs:
  test-web:
    if: contains(fromJSON(inputs.jobs), 'web')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm --filter @pandoks.com/web exec playwright install --with-deps chromium

      - name: Run web tests
        run: pnpm --filter @pandoks.com/web test

  test-desktop:
    if: contains(fromJSON(inputs.jobs), 'desktop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm --filter @pandoks.com/desktop-template exec playwright install --with-deps chromium

      - name: Run desktop tests
        run: xvfb-run -a pnpm --filter @pandoks.com/desktop-template test

  test-svelte-pkg:
    if: contains(fromJSON(inputs.jobs), 'svelte')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm --filter @pandoks.com/svelte exec playwright install --with-deps chromium

      - name: Run svelte package tests
        run: pnpm --filter @pandoks.com/svelte test

  test-prettier-pkg:
    if: contains(fromJSON(inputs.jobs), 'prettier')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Run prettier package tests
        run: pnpm --filter @pandoks.com/prettier test

  test-queue:
    if: contains(fromJSON(inputs.jobs), 'queue')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-retries 15
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/queue/go.mod
          cache-dependency-path: packages/queue/go.sum

      - uses: ./.github/actions/setup-mise
        with:
          tools: uv python

      - name: Run tests
        run: pnpm --filter @pandoks.com/queue test

  test-valkey-reconciler:
    if: contains(fromJSON(inputs.jobs), 'valkey-reconciler')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/valkey/reconciler/go.mod
          cache-dependency-path: packages/valkey/reconciler/go.sum

      - name: Run tests
        run: pnpm --filter @pandoks.com/valkey test

  test-push:
    if: contains(fromJSON(inputs.jobs), 'push')
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-retries 15
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/push/go.mod
          cache-dependency-path: apps/push/go.sum

      - name: Run tests
        run: pnpm --filter @pandoks.com/push test
