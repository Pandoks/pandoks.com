name: Tests

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
      mobile-template: ${{ steps.filter.outputs.mobile-template }}
      svelte: ${{ steps.filter.outputs.svelte }}
      prettier: ${{ steps.filter.outputs.prettier }}
      valkey-reconciler: ${{ steps.filter.outputs.valkey-reconciler }}
      mobile-updates: ${{ steps.filter.outputs.mobile-updates }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            needs-node-setup: &needs-node-setup
              - '.github/workflows/tests.yaml'
              - '.github/actions/setup-node-pnpm/**'
              - 'mise.toml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            web:
              - 'apps/web/**'
              - 'packages/svelte/**'
              - *needs-node-setup
            desktop:
              - 'apps/desktop-template/**'
              - 'packages/svelte/**'
              - *needs-node-setup
            mobile-template:
              - '.github/actions/setup-mise/**'
              - 'apps/mobile-template/**'
              - *needs-node-setup
            svelte:
              - 'packages/svelte/**'
              - *needs-node-setup
            prettier:
              - 'packages/prettier/**'
              - *needs-node-setup
            valkey-reconciler:
              - 'packages/valkey/reconciler/**'
              - 'packages/valkey/package.json'
              - 'go.work'
              - 'go.work.sum'
              - *needs-node-setup
            mobile-updates:
              - 'packages/mobile-updates/**'
              - *needs-node-setup

  test-web:
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm --filter @pandoks.com/web exec playwright install --with-deps chromium

      - name: Run web tests
        run: pnpm --filter @pandoks.com/web test

  test-desktop:
    needs: detect-changes
    if: needs.detect-changes.outputs.desktop == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm --filter @pandoks.com/desktop-template exec playwright install --with-deps chromium

      - name: Run desktop tests
        run: xvfb-run -a pnpm --filter @pandoks.com/desktop-template test

  test-mobile-template:
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile-template == 'true'
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      # NOTE: offline checks against the installed SDK's bundledNativeModules.json, so new Expo patch
      # releases inside Renovate's minimumReleaseAge don't fail every PR
      - name: Check Expo SDK versions
        env:
          EXPO_OFFLINE: '1'
        run: pnpm --filter @pandoks.com/mobile-template exec expo install --check

      - name: Run mobile unit tests
        run: pnpm --filter @pandoks.com/mobile-template test:unit

      - name: Generate native projects
        run: pnpm --filter @pandoks.com/mobile-template exec expo prebuild --no-install

      - name: Bundle iOS and Android JS
        run: pnpm --filter @pandoks.com/mobile-template exec expo export

  test-mobile-template-android:
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile-template == 'true'
    runs-on: ubuntu-latest
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - uses: ./.github/actions/setup-mise
        with:
          tools: java
          working_directory: apps/mobile-template

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Generate Android project
        run: pnpm --filter @pandoks.com/mobile-template exec expo prebuild --platform android --no-install

      - name: Compile Android release
        working-directory: apps/mobile-template/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a

  test-mobile-template-ios:
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile-template == 'true'
    runs-on: macos-26
    env:
      EXPO_NO_TELEMETRY: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - uses: ./.github/actions/setup-mise
        with:
          tools: ruby cocoapods
          working_directory: apps/mobile-template

      - name: Generate iOS project
        run: pnpm --filter @pandoks.com/mobile-template exec expo prebuild --platform ios --no-install

      - name: Install pods
        working-directory: apps/mobile-template/ios
        run: pod install

      - name: Compile iOS simulator release
        working-directory: apps/mobile-template/ios
        run: >-
          xcodebuild build -workspace MobileTemplate.xcworkspace -scheme MobileTemplate
          -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          ARCHS=arm64 CODE_SIGNING_ALLOWED=NO

  test-svelte-pkg:
    needs: detect-changes
    if: needs.detect-changes.outputs.svelte == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Install Playwright browsers
        run: pnpm --filter @pandoks.com/svelte exec playwright install --with-deps chromium

      - name: Run svelte package tests
        run: pnpm --filter @pandoks.com/svelte test

  test-prettier-pkg:
    needs: detect-changes
    if: needs.detect-changes.outputs.prettier == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Run prettier package tests
        run: pnpm --filter @pandoks.com/prettier test

  test-valkey-reconciler:
    needs: detect-changes
    if: needs.detect-changes.outputs.valkey-reconciler == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/valkey/reconciler/go.mod
          cache-dependency-path: packages/valkey/reconciler/go.sum

      - name: Run tests
        run: pnpm --filter @pandoks.com/valkey test

  test-mobile-updates:
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile-updates == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/mobile-updates/go.mod
          cache: false

      - name: Run tests
        run: pnpm --filter @pandoks.com/mobile-updates test

  tests-pass:
    needs:
      - detect-changes
      - test-web
      - test-desktop
      - test-mobile-template
      - test-mobile-template-android
      - test-mobile-template-ios
      - test-svelte-pkg
      - test-prettier-pkg
      - test-valkey-reconciler
      - test-mobile-updates
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
