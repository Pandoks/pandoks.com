name: Build

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      dispatch:
        description: JSON of the pipeline's manual-run inputs, which pick the images and charts instead of the path filters.
        type: string
        default: '{}'
    outputs:
      images:
        description: JSON list of the images built, each {"name","package","path"}, uploaded as the artifact image-<package>-<name>.
        value: ${{ jobs.detect-changes.outputs.images }}
      charts:
        description: JSON list of the charts to publish, each {"name","path"}.
        value: ${{ jobs.detect-changes.outputs.charts }}
      e2e:
        description: JSON list of the packages whose e2e suite runs.
        value: ${{ jobs.detect-changes.outputs.e2e }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.set-image-matrix.outputs.images }}
      charts: ${{ steps.set-chart-matrix.outputs.charts }}
      e2e: ${{ steps.set-e2e-matrix.outputs.e2e }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: image-changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            patroni:
              - 'packages/postgres/patroni/**'
            pgbackrest:
              - 'packages/postgres/pgbackrest/**'
            valkey:
              - 'packages/valkey/Dockerfile'
              - 'packages/valkey/entrypoint.sh'
            valkey-reconciler:
              - 'packages/valkey/reconciler/**'
            argocd-sst-plugin:
              - 'packages/argocd/**'
            clickhouse:
              - 'packages/clickhouse/clickhouse/**'
            clickhouse-keeper:
              - 'packages/clickhouse/keeper/**'
            clickhouse-backup:
              - 'packages/clickhouse/backup/**'

      - id: chart-changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            postgres:
              - 'packages/postgres/chart/**'
            valkey:
              - 'packages/valkey/chart/**'
            clickhouse:
              - 'packages/clickhouse/chart/**'

      - id: e2e-changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            needs-e2e-setup: &needs-e2e-setup
              - '.github/workflows/pipeline.yaml'
              - '.github/workflows/build.yaml'
              - '.github/workflows/publish.yaml'
              - '.github/workflows/e2e.yaml'
              - '.github/actions/**'
              - 'packages/e2e/**'
              - 'scripts/cluster/**'
              - 'scripts/lib/**'
              - 'docker-compose.yaml'
              - 'go.work'
              - 'go.work.sum'
              - 'mise.toml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            valkey:
              - 'packages/valkey/**'
              - 'k3s/base/core/valkey.yaml'
              - *needs-e2e-setup

      - id: set-image-matrix
        env:
          DISPATCH: ${{ inputs.dispatch }}
        run: |
          all='[
            {"name":"patroni","package":"postgres","path":"./packages/postgres/patroni/Dockerfile"},
            {"name":"pgbackrest","package":"postgres","path":"./packages/postgres/pgbackrest/Dockerfile"},
            {"name":"valkey","package":"valkey","path":"./packages/valkey/Dockerfile"},
            {"name":"valkey-reconciler","package":"valkey","path":"./packages/valkey/reconciler/Dockerfile"},
            {"name":"argocd-sst-plugin","package":"argocd","path":"./packages/argocd/Dockerfile"},
            {"name":"clickhouse","package":"clickhouse","path":"./packages/clickhouse/clickhouse/Dockerfile"},
            {"name":"clickhouse-keeper","package":"clickhouse","path":"./packages/clickhouse/keeper/Dockerfile"},
            {"name":"clickhouse-backup","package":"clickhouse","path":"./packages/clickhouse/backup/Dockerfile"}
          ]'
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            selected=$(jq -c 'to_entries | map(select(.value == true) | .key)' <<<"${DISPATCH}")
          else
            selected='${{ steps.image-changes.outputs.changes || '[]' }}'
          fi
          images=$(jq -c --argjson sel "${selected}" 'map(select(.name as $n | $sel | index($n)))' <<<"${all}")
          echo "images=${images}" >> "${GITHUB_OUTPUT}"

      - id: set-chart-matrix
        env:
          DISPATCH: ${{ inputs.dispatch }}
        run: |
          all='[
            {"name":"postgres","path":"./packages/postgres/chart"},
            {"name":"valkey","path":"./packages/valkey/chart"},
            {"name":"clickhouse","path":"./packages/clickhouse/chart"}
          ]'
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            selected=$(jq -c 'to_entries | map(select(.value == true and (.key | endswith("-chart"))) | .key | sub("-chart$"; ""))' <<<"${DISPATCH}")
          else
            selected='${{ steps.chart-changes.outputs.changes || '[]' }}'
          fi
          charts=$(jq -c --argjson sel "${selected}" 'map(select(.name as $n | $sel | index($n)))' <<<"${all}")
          echo "charts=${charts}" >> "${GITHUB_OUTPUT}"

      - id: set-e2e-matrix
        env:
          DISPATCH: ${{ inputs.dispatch }}
          IMAGES: ${{ steps.set-image-matrix.outputs.images }}
        run: |
          suites='["valkey"]'
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            selected=$(jq -c --argjson images "${IMAGES}" '[(to_entries[] | select(.value == true and (.key | endswith("-chart"))) | .key | sub("-chart$"; "")), $images[].package]' <<<"${DISPATCH}")
          else
            selected='${{ steps.e2e-changes.outputs.changes || '[]' }}'
          fi
          e2e=$(jq -c --argjson sel "${selected}" 'map(select(. as $suite | $sel | index($suite)))' <<<"${suites}")
          echo "e2e=${e2e}" >> "${GITHUB_OUTPUT}"

  build-images:
    needs: detect-changes
    if: needs.detect-changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ${{ fromJSON(needs.detect-changes.outputs.images) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.image.path }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          tags: |
            type=ref,event=branch
            type=raw,value=ref-{{branch}}-{{sha}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.path }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=docker,dest=${{ runner.temp }}/${{ matrix.image.name }}.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/${{ matrix.image.name }}.tar
          scanners: vuln,secret
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.image.package }}-${{ matrix.image.name }}
          path: ${{ runner.temp }}/${{ matrix.image.name }}.tar
          retention-days: 1
