name: Branch Deletion Cleanup
on:
  delete:

permissions: {}

jobs:
  cleanup-cloudflare-previews:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Cloudflare Pages previews for deleted branch
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BRANCH: ${{ github.event.ref }} # WARNING: do not inline this (security risk)
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}/pages/projects/pandoks/deployments"
          ids=()
          page=1
          while :; do
            response=$(curl -fsS -H "Authorization: Bearer ${TOKEN}" "${api}?per_page=25&page=${page}")
            matches=$(printf '%s' "${response}" | jq -r --arg b "${BRANCH}" '.result[] | select(.deployment_trigger.metadata.branch==$b) | .id')
            while IFS= read -r id; do
              [ -n "${id}" ] && ids+=("${id}")
            done <<<"${matches}"
            total=$(printf '%s' "${response}" | jq '.result_info.total_pages')
            [ "${page}" -ge "${total}" ] && break
            page=$((page + 1))
          done
          [ ${#ids[@]} -eq 0 ] && exit 0
          printf '%s\n' "${ids[@]}" | xargs -I{} curl -fsS -X DELETE -H "Authorization: Bearer ${TOKEN}" "${api}/{}?force=true"

  cleanup-ghcr-images:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name:
          - patroni
          - pgbackrest
          - valkey
          - valkey-reconciler
          - argocd-sst-plugin
          - clickhouse
          - clickhouse-keeper
          - clickhouse-backup
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Delete GHCR versions for deleted branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PACKAGE_MANAGEMENT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ matrix.name }}
          BRANCH: ${{ github.event.ref }} # WARNING: do not inline this (security risk)
        run: |
          . ./scripts/lib/branch-tag.sh
          api="/users/${OWNER,,}/packages/container/${PACKAGE}/versions"
          branches=$(gh api --paginate "/repos/${{ github.repository }}/branches?per_page=100" --jq '.[].name')
          canonical_key=$(branch_tag "${BRANCH}")
          legacy_key=$(legacy_image_branch_tag "${BRANCH}")
          tag_prefix="ref-${canonical_key}-"
          staging_tag_prefix="try-${tag_prefix}"
          legacy_tag_prefix="ref-${legacy_key}-"
          canonical_safe=false
          legacy_safe=false
          if printf '%s\n' "${branches}" | image_branch_tag_is_unique "${BRANCH}" "${canonical_key}"; then
            canonical_safe=true
          fi
          if printf '%s\n' "${branches}" | image_branch_tag_is_unique "${BRANCH}" "${legacy_key}"; then
            legacy_safe=true
          fi
          ids=$(gh api --paginate --slurp "${api}" \
            | jq -r --arg p "${tag_prefix}" --arg staging "${staging_tag_prefix}" \
                --arg legacy "${legacy_tag_prefix}" \
                --argjson canonical_safe "${canonical_safe}" --argjson legacy_safe "${legacy_safe}" '
                def exact_canonical_image_ref($prefix):
                  startswith($prefix) and (.[($prefix | length):]
                    | test("^([0-9a-f]{40}|[0-9a-f]{12}-[0-9]+-[0-9]+)$"));
                def exact_legacy_image_ref($prefix):
                  startswith($prefix) and (.[($prefix | length):] | test("^([0-9a-f]{7}|[0-9a-f]{40})$"));
                add | .[]
                | select((.metadata.container.tags // []) | any(
                    ($canonical_safe and exact_canonical_image_ref($p))
                    or ($canonical_safe and exact_canonical_image_ref($staging))
                    or ($legacy_safe and exact_legacy_image_ref($legacy))))
                | .id')
          if [ -z "${ids}" ]; then
            echo "No ${PACKAGE} versions with an exact ${tag_prefix}<cohort-id> tag; nothing to delete."
            exit 0
          fi
          while read -r id; do
            [ -z "${id}" ] && continue
            echo "Deleting ${PACKAGE} version ${id}"
            gh api --method DELETE "${api}/${id}"
          done <<<"${ids}"

  cleanup-ghcr-charts:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        chart:
          - postgres
          - valkey
          - clickhouse
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Delete GHCR chart versions for deleted branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PACKAGE_MANAGEMENT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          CHART: ${{ matrix.chart }}
          BRANCH: ${{ github.event.ref }} # WARNING: do not inline this (security risk)
        run: |
          . ./scripts/lib/branch-tag.sh
          api="/users/${OWNER,,}/packages/container/charts%2F${CHART}/versions"
          branches=$(gh api --paginate "/repos/${{ github.repository }}/branches?per_page=100" --jq '.[].name')
          canonical_key=$(branch_tag "${BRANCH}")
          legacy_key=$(legacy_chart_branch_tag "${BRANCH}")
          tag_suffix="-${canonical_key}"
          legacy_tag_suffix="-${legacy_key}"
          canonical_safe=false
          legacy_safe=false
          if printf '%s\n' "${branches}" | chart_branch_tag_is_unique "${BRANCH}" "${canonical_key}"; then
            canonical_safe=true
          fi
          if printf '%s\n' "${branches}" | chart_branch_tag_is_unique "${BRANCH}" "${legacy_key}"; then
            legacy_safe=true
          fi
          ids=$(gh api --paginate --slurp "${api}" \
            | jq -r --arg s "${tag_suffix}" --arg legacy "${legacy_tag_suffix}" \
                --argjson canonical_safe "${canonical_safe}" --argjson legacy_safe "${legacy_safe}" '
                def exact_chart_version($suffix):
                  endswith($suffix) and (rtrimstr($suffix) | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"));
                add | .[]
                | select((.metadata.container.tags // []) | any(
                    ($canonical_safe and exact_chart_version($s))
                    or ($legacy_safe and exact_chart_version($legacy))))
                | .id')
          if [ -z "${ids}" ]; then
            echo "No ${CHART} chart versions with exact suffix ${tag_suffix}; nothing to delete."
            exit 0
          fi
          while read -r id; do
            [ -z "${id}" ] && continue
            echo "Deleting ${CHART} chart version ${id}"
            gh api --method DELETE "${api}/${id}"
          done <<<"${ids}"
