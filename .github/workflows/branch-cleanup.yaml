name: Preview Cleanup

on:
  delete:
  pull_request_target:
    branches: [main]
    types: [closed, unlabeled]

permissions: {}

jobs:
  cleanup-cloudflare-previews:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Delete Cloudflare Pages previews for deleted branch
        shell: bash
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BRANCH: ${{ github.event.ref }} # WARNING: do not inline this (security risk)
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}/pages/projects/pandoks/deployments"
          ids=()
          page=1
          while :; do
            response=$(curl -fsS -H "Authorization: Bearer ${TOKEN}" "${api}?per_page=25&page=${page}")
            matches=$(printf '%s' "${response}" | jq -r --arg b "${BRANCH}" '.result[] | select(.deployment_trigger.metadata.branch==$b) | .id')
            while IFS= read -r id; do
              [ -n "${id}" ] && ids+=("${id}")
            done <<<"${matches}"
            total=$(printf '%s' "${response}" | jq '.result_info.total_pages')
            [ "${page}" -ge "${total}" ] && break
            page=$((page + 1))
          done
          [ ${#ids[@]} -eq 0 ] && exit 0
          printf '%s\n' "${ids[@]}" | xargs -I{} curl -fsS -X DELETE -H "Authorization: Bearer ${TOKEN}" "${api}/{}?force=true"

  cleanup-preview-ref:
    if: github.event_name == 'pull_request_target' && (github.event.action == 'closed' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PREVIEW_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Remove the closed or opted-out preview's release ref and GHCR versions
        shell: bash
        env:
          PACKAGES_TOKEN: ${{ secrets.GH_PACKAGE_MANAGEMENT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PREVIEW_NUMBER")
          if jq -e '.state == "open" and any(.labels[]; .name == "preview")' <<<"$current" >/dev/null; then
            exit 0
          fi
          ref="heads/deploy/preview-$PREVIEW_NUMBER"
          exists=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/$ref" --jq ".[] | select(.ref == \"refs/$ref\") | .ref")
          [ -z "$exists" ] || gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/$ref"

          # NOTE: closing a PR doesn't revert deploy/dev, so keep the image digests it still pins.
          pinned=''
          dev=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/deploy/dev" --jq '.[] | select(.ref == "refs/heads/deploy/dev") | .ref')
          if [ -n "$dev" ]; then
            pinned=$(gh api "repos/$GITHUB_REPOSITORY/contents/k3s/components/images/kustomization.yaml?ref=deploy/dev" --jq .content \
              | base64 -d | grep -o 'sha256:[0-9a-f]\{64\}')
          fi
          export GH_TOKEN="$PACKAGES_TOKEN"
          for package in patroni pgbackrest valkey valkey-reconciler argocd-sst-plugin clickhouse clickhouse-keeper clickhouse-backup \
            charts/postgres charts/valkey charts/clickhouse; do
            api="/users/${OWNER,,}/packages/container/${package//\//%2F}/versions"
            gh api --paginate --slurp "$api" \
              | jq -r --arg image "pr-$PREVIEW_NUMBER" --arg chart "0.0.0-pr.$PREVIEW_NUMBER." --arg pinned "$pinned" '
                  add | .[]
                  | select(any(.metadata.container.tags[]; . == $image or startswith($chart)))
                  | select(.name as $digest | $pinned | contains($digest) | not)
                  | .id' \
              | xargs -rI{} gh api --method DELETE "$api/{}"
          done

  cleanup-ghcr-images:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        name:
          - patroni
          - pgbackrest
          - valkey
          - valkey-reconciler
          - argocd-sst-plugin
          - clickhouse
          - clickhouse-keeper
          - clickhouse-backup
    steps:
      - name: Delete GHCR versions for deleted branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PACKAGE_MANAGEMENT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ matrix.name }}
          BRANCH: ${{ github.event.ref }} # WARNING: do not inline this (security risk)
        run: |
          api="/users/${OWNER,,}/packages/container/${PACKAGE}/versions"
          tag_prefix="ref-$(sed -E 's/[^a-zA-Z0-9._-]+/-/g' <<<"${BRANCH}")-"
          ids=$(gh api --paginate --slurp "${api}" \
            | jq -r --arg p "${tag_prefix}" '
                add | .[]
                | select((.metadata.container.tags // []) | any(startswith($p)))
                | .id')
          if [ -z "${ids}" ]; then
            echo "No ${PACKAGE} versions tagged ${tag_prefix}*; nothing to delete."
            exit 0
          fi
          while read -r id; do
            [ -z "${id}" ] && continue
            echo "Deleting ${PACKAGE} version ${id}"
            gh api --method DELETE "${api}/${id}"
          done <<<"${ids}"

  cleanup-ghcr-charts:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        chart:
          - postgres
          - valkey
          - clickhouse
    steps:
      - name: Delete GHCR chart versions for deleted branch
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PACKAGE_MANAGEMENT_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          CHART: ${{ matrix.chart }}
          BRANCH: ${{ github.event.ref }} # WARNING: do not inline this (security risk)
        run: |
          api="/users/${OWNER,,}/packages/container/charts%2F${CHART}/versions"
          tag_suffix="-${BRANCH//\//-}"
          ids=$(gh api --paginate --slurp "${api}" \
            | jq -r --arg s "${tag_suffix}" '
                add | .[]
                | select((.metadata.container.tags // []) | any(endswith($s)))
                | .id')
          if [ -z "${ids}" ]; then
            echo "No ${CHART} chart versions ending in ${tag_suffix}; nothing to delete."
            exit 0
          fi
          while read -r id; do
            [ -z "${id}" ] && continue
            echo "Deleting ${CHART} chart version ${id}"
            gh api --method DELETE "${api}/${id}"
          done <<<"${ids}"
