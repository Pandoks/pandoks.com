name: Deploy Infrastructure

# Main deploys production SST; dev is manual. The preview label only deploys Kubernetes workloads.
on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - 'sst.config.ts'
      - 'pnpm-lock.yaml'
      - 'apps/**'
      - '!apps/desktop-template/**'
      - '!apps/example/**'
      - 'packages/svelte/**'
  workflow_dispatch:
    inputs:
      stage:
        description: 'SST stage'
        type: choice
        default: dev
        options:
          - dev
          - production
      revision:
        description: 'Source revision (default: main)'
        type: string
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-infrastructure-${{ inputs.stage || 'production' }}
  cancel-in-progress: false

jobs:
  deploy-sst:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage == 'dev' && 'preview' || 'production' }}
    env:
      SST_STAGE: ${{ inputs.stage || 'production' }}
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
      OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}

      - uses: ./.github/actions/setup-node-pnpm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # TODO: remove continue-on-error after sst fixes refresh exit code bug
      # https://github.com/anomalyco/sst/issues/6713
      - name: Refresh SST state
        continue-on-error: true
        run: pnpm sst refresh --stage "$SST_STAGE"

      - name: Deploy SST
        run: pnpm sst deploy --stage "$SST_STAGE"
