name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'Pulumi.yaml'
      - 'Pulumi.production.yaml'
      - 'infra/**'
      - 'apps/**'
      - '!apps/example/**'
      - 'apps/*/kube/**'
      - 'packages/svelte/**'
      - 'k3s/**'
      - 'scripts/cluster/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'What to deploy'
        type: choice
        default: all
        options:
          - all
          - pulumi
          - kubernetes

permissions:
  id-token: write
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      pulumi: ${{ github.event_name != 'workflow_dispatch' && steps.filter.outputs.pulumi || contains(fromJSON('["all","pulumi"]'), inputs.deploy) }}
      kubernetes: ${{ github.event_name != 'workflow_dispatch' && steps.filter.outputs.kubernetes || contains(fromJSON('["all","kubernetes"]'), inputs.deploy) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            pulumi:
              - 'Pulumi.yaml'
              - 'Pulumi.production.yaml'
              - 'infra/**'
              - 'apps/!(example)/**'
              - 'packages/svelte/**'
            kubernetes:
              - 'k3s/**'
              - 'apps/*/kube/**'
              - 'scripts/cluster/**'

  deploy-pulumi:
    concurrency:
      group: deploy-pulumi
      cancel-in-progress: false
    needs: detect-changes
    if: needs.detect-changes.outputs.pulumi == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Read pulumi version from mise.toml
        id: mise-pulumi
        run: echo "version=$(sed -n -E 's/^"aqua:pulumi\/pulumi"[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

      - name: Setup Pulumi
        uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        with:
          pulumi-version: ${{ steps.mise-pulumi.outputs.version }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Load Pulumi passphrase
        run: |
          passphrase=$(aws ssm get-parameter --name /sst/passphrase/personal/production \
            --with-decryption --query Parameter.Value --output text)
          echo "::add-mask::${passphrase}"
          echo "PULUMI_CONFIG_PASSPHRASE=${passphrase}" >> "$GITHUB_ENV"

      # TODO: drop this step once the SST cut-over deploy has run; it only gates that one deploy.
      - name: Check the SST cut-over preview
        run: |
          pulumi preview --stack production --refresh --json > preview.json
          jq -e '
            def type: .urn | split("::")[2] | split("$") | last;
            if any(.steps[]; .op == "delete" and (type | startswith("sst:"))) | not then true
            else [.steps[] | select(
              (.op | IN("same", "update", "refresh", "read") | not)
              and (.op == "delete" and (type | test("^(sst:|aws:cloudfront/|aws:acm/|aws:lambda/(functionUrl|permission):|aws:s3/(bucketObjectv2|bucketCorsConfiguration):|random:|pulumi:providers:)")) | not)
              and (.op == "create" and (type | test("^(aws:apigatewayv2/|aws:acm/|aws:lambda/permission:)")) | not)
              and (type | test("^aws:imagebuilder/") | not)
              and ((.urn | endswith("::ApiCertificateValidationRecord")) | not)
            ) | "\(.op) \(.urn)"] | if length == 0 then true else (.[] | debug) | false end
            end' preview.json > /dev/null

      - name: Deploy Pulumi
        run: pulumi up --yes --refresh --stack production

  deploy-kubernetes:
    concurrency:
      group: deploy-kubernetes
      cancel-in-progress: false
    needs:
      - detect-changes
      - deploy-pulumi
    if: |
      always() &&
      needs.detect-changes.outputs.kubernetes == 'true' &&
      (needs.deploy-pulumi.result == 'success' || needs.deploy-pulumi.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Setup Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure kubeconfig
        run: |
          PEERS=$(sudo tailscale status --peers) || { echo "tailscale status failed"; exit 1; }
          if ! echo "$PEERS" | grep -q prod-cluster; then
            echo "No cluster found — skipping deployment"
            echo "SKIP_DEPLOY=true" >> "$GITHUB_ENV"
            exit 0
          fi
          sudo tailscale configure kubeconfig prod-cluster

      - name: Trigger ArgoCD Sync
        if: env.SKIP_DEPLOY != 'true'
        run: |
          sudo kubectl annotate application prod-cluster \
            argocd.argoproj.io/refresh=hard \
            --overwrite \
            --namespace argocd

      - name: Wait for ArgoCD Sync
        if: env.SKIP_DEPLOY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)

          while [ "${SECONDS}" -lt 600 ]; do
            argocd_app=$(sudo kubectl get application prod-cluster -n argocd -o json)
            argocd_revision=$(jq -r .status.sync.revision <<<"${argocd_app}")
            deploy_state=$(jq -r '
              if .metadata.annotations["argocd.argoproj.io/refresh"] then "refreshing"
              elif any(.status.conditions[]?; .type == "ComparisonError")
                or (.status.operationState.operation.sync.revision == .status.sync.revision
                  and (.status.operationState.phase | IN("Failed", "Error"))) then "failed"
              elif .status.sync.status == "Synced" and .status.health.status == "Healthy" then "healthy"
              else "waiting" end' <<<"${argocd_app}")

            if [ "${deploy_state}" = failed ] || [ "${deploy_state}" = healthy ]; then
              # NOTE: main may have moved on, so a newer revision that contains main_commit also counts.
              comparison_to_main=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${main_commit}...${argocd_revision}" --jq .status)
              case "${deploy_state}:${comparison_to_main}" in
                failed:identical | failed:ahead)
                  echo "Sync failed at ${argocd_revision}:"
                  jq -r '.status.conditions[]?.message, .status.operationState.message // empty' <<<"${argocd_app}"
                  exit 1
                  ;;
                healthy:identical | healthy:ahead)
                  echo "Synced and healthy at ${argocd_revision}"
                  exit 0
                  ;;
              esac
            fi
            sleep 5
          done
          echo "Timed out waiting for main (${main_commit}) to sync healthy: ${deploy_state} at ${argocd_revision}"
          exit 1
