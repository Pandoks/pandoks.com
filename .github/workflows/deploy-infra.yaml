name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'sst.config.ts'
      - 'infra/**'
      - 'apps/**'
      - '!apps/example/**'
      - 'apps/*/kube/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'packages/svelte/**'
      - 'k3s/**'
      - 'scripts/cluster/**'
      - 'scripts/mobile-updates/**'
      - 'templates/mobile/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'What to deploy'
        type: choice
        default: all
        options:
          - all
          - sst
          - kubernetes

permissions:
  id-token: write
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      sst: ${{ github.event_name != 'workflow_dispatch' && steps.filter.outputs.sst || contains(fromJSON('["all","sst"]'), inputs.deploy) }}
      kubernetes: ${{ github.event_name != 'workflow_dispatch' && steps.filter.outputs.kubernetes || contains(fromJSON('["all","kubernetes"]'), inputs.deploy) }}
      mobile-template: ${{ steps.filter.outputs.mobile-template }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            sst:
              - 'sst.config.ts'
              - 'infra/**'
              - 'apps/!(example)/**'
              - 'packages/svelte/**'
            kubernetes:
              - 'k3s/**'
              - 'apps/*/kube/**'
              - 'scripts/cluster/**'
            mobile-template:
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'scripts/mobile-updates/**'
              - 'templates/mobile/**'
              - '!templates/mobile/{README.md,e2e/**,src/__tests__/**}'

  deploy-sst:
    concurrency:
      group: deploy-sst
      cancel-in-progress: false
    needs: detect-changes
    if: needs.detect-changes.outputs.sst == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
      OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # TODO: remove continue-on-error after sst fixes refresh exit code bug
      # https://github.com/anomalyco/sst/issues/6713
      - name: Refresh sst state
        continue-on-error: true
        run: pnpm sst refresh --stage production

      - name: Deploy SST
        run: pnpm sst deploy --stage production

  # NOTE: expo and every dependency it loads run here, so it gets no secrets, AWS, or OIDC token
  build-mobile-template:
    # NOTE: one build and one publish run at a time, and a newer pending one replaces the older one.
    # GitHub queues jobs by when they start waiting, not by merge, so merges close together can publish
    # out of order; rerun the newer run's jobs to fix it. Job-level, so a run that skips it doesn't
    # cancel another run's pending one
    concurrency:
      group: build-mobile-template
      cancel-in-progress: false
    needs: detect-changes
    if: needs.detect-changes.outputs.mobile-template == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EXPO_NO_TELEMETRY: 1

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Export update
        run: pnpm mobile-updates export templates/mobile production "${RUNNER_TEMP}/mobile-template-update"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-template-update
          path: ${{ runner.temp }}/mobile-template-update
          retention-days: 1

  # NOTE: runs only main.sh over the export, with no install, so no dependency sees the signing key
  publish-mobile-template:
    concurrency:
      group: publish-mobile-template
      cancel-in-progress: false
    needs: build-mobile-template
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      MOBILE_UPDATES_SIGNING_KEY: ${{ secrets.MOBILE_UPDATES_SIGNING_KEY }}
      MOBILE_UPDATES_BUCKET: ${{ vars.MOBILE_UPDATES_BUCKET }}
      MOBILE_UPDATES_MANIFESTS_NAMESPACE_ID: ${{ vars.MOBILE_UPDATES_MANIFESTS_NAMESPACE_ID }}
      MOBILE_UPDATES_ASSETS_DOMAIN: ${{ vars.MOBILE_UPDATES_ASSETS_DOMAIN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mobile-template-update
          path: ${{ runner.temp }}/mobile-template-update

      - name: Publish update
        run: |
          ./scripts/mobile-updates/main.sh upload "${RUNNER_TEMP}/mobile-template-update" \
            "${MOBILE_UPDATES_BUCKET}" "${MOBILE_UPDATES_MANIFESTS_NAMESPACE_ID}" "${MOBILE_UPDATES_ASSETS_DOMAIN}"

  deploy-kubernetes:
    concurrency:
      group: deploy-kubernetes
      cancel-in-progress: false
    needs:
      - detect-changes
      - deploy-sst
    if: |
      always() &&
      needs.detect-changes.outputs.kubernetes == 'true' &&
      (needs.deploy-sst.result == 'success' || needs.deploy-sst.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Setup Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure kubeconfig
        run: |
          PEERS=$(sudo tailscale status --peers) || { echo "tailscale status failed"; exit 1; }
          if ! echo "$PEERS" | grep -q prod-cluster; then
            echo "No cluster found — skipping deployment"
            echo "SKIP_DEPLOY=true" >> "$GITHUB_ENV"
            exit 0
          fi
          sudo tailscale configure kubeconfig prod-cluster

      - name: Trigger ArgoCD Sync
        if: env.SKIP_DEPLOY != 'true'
        run: |
          sudo kubectl annotate application prod-cluster \
            argocd.argoproj.io/refresh=hard \
            --overwrite \
            --namespace argocd

      - name: Wait for ArgoCD Sync
        if: env.SKIP_DEPLOY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_commit=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)

          while [ "${SECONDS}" -lt 600 ]; do
            argocd_app=$(sudo kubectl get application prod-cluster -n argocd -o json)
            argocd_revision=$(jq -r .status.sync.revision <<<"${argocd_app}")
            deploy_state=$(jq -r '
              if .metadata.annotations["argocd.argoproj.io/refresh"] then "refreshing"
              elif any(.status.conditions[]?; .type == "ComparisonError")
                or (.status.operationState.operation.sync.revision == .status.sync.revision
                  and (.status.operationState.phase | IN("Failed", "Error"))) then "failed"
              elif .status.sync.status == "Synced" and .status.health.status == "Healthy" then "healthy"
              else "waiting" end' <<<"${argocd_app}")

            if [ "${deploy_state}" = failed ] || [ "${deploy_state}" = healthy ]; then
              # NOTE: main may have moved on, so a newer revision that contains main_commit also counts.
              comparison_to_main=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${main_commit}...${argocd_revision}" --jq .status)
              case "${deploy_state}:${comparison_to_main}" in
                failed:identical | failed:ahead)
                  echo "Sync failed at ${argocd_revision}:"
                  jq -r '.status.conditions[]?.message, .status.operationState.message // empty' <<<"${argocd_app}"
                  exit 1
                  ;;
                healthy:identical | healthy:ahead)
                  echo "Synced and healthy at ${argocd_revision}"
                  exit 0
                  ;;
              esac
            fi
            sleep 5
          done
          echo "Timed out waiting for main (${main_commit}) to sync healthy: ${deploy_state} at ${argocd_revision}"
          exit 1
