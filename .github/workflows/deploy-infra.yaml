name: Deploy Infrastructure

on:
  push:
    branches:
      - main
    paths:
      - 'sst.config.ts'
      - 'infra/**'
      - 'apps/**'
      - '!apps/desktop-template/**'
      - '!apps/example/**'
      - 'packages/svelte/**'
      - 'k3s/**'
      - 'scripts/cluster/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'What to deploy'
        type: choice
        default: all
        options:
          - all
          - sst
          - kubernetes

permissions:
  id-token: write
  contents: read

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      sst: ${{ github.event_name != 'workflow_dispatch' && steps.filter.outputs.sst || contains(fromJSON('["all","sst"]'), inputs.deploy) }}
      kubernetes: ${{ github.event_name != 'workflow_dispatch' && steps.filter.outputs.kubernetes || contains(fromJSON('["all","kubernetes"]'), inputs.deploy) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name != 'workflow_dispatch'
        id: filter
        with:
          filters: |
            sst:
              - 'sst.config.ts'
              - 'infra/**'
              - 'apps/!(desktop-template|example)/**'
              - 'packages/svelte/**'
            kubernetes:
              - 'k3s/**'
              - 'scripts/cluster/**'

  deploy-sst:
    concurrency:
      group: deploy-sst
      cancel-in-progress: false
    needs: detect-changes
    if: needs.detect-changes.outputs.sst == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_DEFAULT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_DEFAULT_ACCOUNT_ID }}
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
      OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
      OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
      TAILSCALE_OAUTH_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # TODO: remove continue-on-error after sst fixes refresh exit code bug
      # https://github.com/anomalyco/sst/issues/6713
      - name: Refresh sst state
        continue-on-error: true
        run: pnpm sst refresh --stage production

      - name: Deploy SST
        run: pnpm sst deploy --stage production

  deploy-kubernetes:
    concurrency:
      group: deploy-kubernetes
      cancel-in-progress: false
    needs:
      - detect-changes
      - deploy-sst
    if: |
      always() &&
      needs.detect-changes.outputs.kubernetes == 'true' &&
      (needs.deploy-sst.result == 'success' || needs.deploy-sst.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Setup Tailscale
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure kubeconfig
        run: |
          PEERS=$(sudo tailscale status --peers) || { echo "tailscale status failed"; exit 1; }
          if ! echo "$PEERS" | grep -q prod-cluster; then
            echo "No cluster found — skipping deployment"
            echo "SKIP_DEPLOY=true" >> "$GITHUB_ENV"
            exit 0
          fi
          sudo tailscale configure kubeconfig prod-cluster

      - name: Trigger ArgoCD Sync
        if: env.SKIP_DEPLOY != 'true'
        run: |
          sudo kubectl annotate application prod-cluster \
            argocd.argoproj.io/refresh=hard \
            --overwrite \
            --namespace argocd

      - name: Wait for ArgoCD Sync
        if: env.SKIP_DEPLOY != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # NOTE: Argo always deploys main, and a manual dispatch may run from another ref.
          TARGET_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          CHECKED_REVISION=""
          DEADLINE=$((SECONDS + 600))
          while [ "${SECONDS}" -lt "${DEADLINE}" ]; do
            APP=$(sudo kubectl get application prod-cluster -n argocd \
              -o jsonpath='{.metadata.annotations.argocd\.argoproj\.io/refresh}|{.status.sync.revision}|{.status.sync.status}|{.status.health.status}|{.status.operationState.operation.sync.revision}|{.status.operationState.phase}|{.status.conditions[?(@.type=="ComparisonError")].type}')
            IFS='|' read -r REFRESH REVISION SYNC HEALTH OPERATION_REVISION PHASE ERROR <<< "${APP}"

            # NOTE: Argo drops the refresh annotation with the first status written after the hard refresh.
            if [ -z "${REFRESH}" ] && [ -n "${REVISION}" ]; then
              # NOTE: main may have moved on, so a newer revision that contains TARGET_SHA also counts.
              if [ "${REVISION}" != "${CHECKED_REVISION}" ]; then
                CHECKED_REVISION="${REVISION}"
                COMPARE=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${TARGET_SHA}...${REVISION}" --jq .status)
              fi

              if [ "${COMPARE}" = identical ] || [ "${COMPARE}" = ahead ]; then
                if [ -n "${ERROR}" ] || { [ "${OPERATION_REVISION}" = "${REVISION}" ] && [[ "${PHASE}" =~ ^(Failed|Error)$ ]]; }; then
                  echo "Sync failed at ${REVISION}:"
                  sudo kubectl get application prod-cluster -n argocd \
                    -o jsonpath='{range .status.conditions[*]}{.message}{"\n"}{end}{.status.operationState.message}{"\n"}'
                  exit 1
                fi
                if [ "${SYNC}" = Synced ] && [ "${HEALTH}" = Healthy ]; then
                  echo "Synced and healthy at ${REVISION}"
                  exit 0
                fi
              fi
            fi
            sleep 5
          done
          echo "Timed out waiting for main (${TARGET_SHA}) to sync healthy: ${APP}"
          exit 1
