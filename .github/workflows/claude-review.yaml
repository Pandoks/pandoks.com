name: Claude Review

on:
  pull_request:
    types:
      - opened
      - ready_for_review
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-app-token-probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          oidc=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=claude-code-github-action" | jq -r .value)
          body=$(curl -sS -w '\n%{http_code}' -X POST -H "Authorization: Bearer $oidc" https://api.anthropic.com/api/github/github-app-token-exchange)
          code=$(tail -n1 <<<"$body"); json=$(sed '$d' <<<"$body")
          token=$(jq -r '.token // .app_token // empty' <<<"$json")
          echo "exchange status: $code"
          if [ -z "$token" ]; then echo "$json"; exit 1; fi
          echo "::add-mask::$token"
          GH_TOKEN=$token gh api /installation/repositories -q '"app installation repos: \(.total_count) \([.repositories[].full_name])"'
          curl -sS -o /dev/null -w 'revoke status: %{http_code}\n' -X DELETE -H "Authorization: Bearer $token" https://api.github.com/installation/token

  review:
    if: ${{ false && !github.event.pull_request.draft && (github.event.pull_request.user.type != 'Bot' || github.event.pull_request.user.login == 'pandoks-grok[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - uses: ./.github/actions/setup-node-pnpm

      - run: node scripts/claude-review/review.js
        env:
          ANTHROPIC_BASE_URL: https://cliproxyapi-ci.tailb2c81d.ts.net
          ANTHROPIC_API_KEY: cliproxyapi
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
