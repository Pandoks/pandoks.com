name: Claude Review

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - synchronize
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Install Claude Agent SDK
        run: npm install --no-save --prefix "$RUNNER_TEMP/sdk" @anthropic-ai/claude-agent-sdk@0.3.308

      - name: Review
        env:
          ANTHROPIC_BASE_URL: https://cliproxyapi-ci.tailb2c81d.ts.net
          ANTHROPIC_API_KEY: cliproxyapi
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          cat > "$RUNNER_TEMP/sdk/review.mjs" <<'EOF'
          import { query } from '@anthropic-ai/claude-agent-sdk';

          let result;
          for await (const message of query({
            prompt: `/code-review --comment ${process.env.PR_NUMBER}`,
            options: {
              cwd: process.env.GITHUB_WORKSPACE,
              settingSources: ['project'],
              allowedTools: [
                'Read',
                'Grep',
                'Glob',
                'Write(//tmp/**)',
                'Bash(gh pr diff:*)',
                'Bash(gh pr view:*)',
                'Bash(gh api:*)'
              ]
            }
          })) {
            if (message.type === 'system') console.log(`system ${message.subtype ?? ''}`);
            if (message.type === 'result') result = message;
          }
          console.log(JSON.stringify(result, null, 2));
          if (!result || result.is_error || result.subtype !== 'success') process.exit(1);
          EOF
          node "$RUNNER_TEMP/sdk/review.mjs"
