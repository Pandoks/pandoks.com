name: Claude Review

on:
  pull_request:
    types:
      - opened
      - ready_for_review
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft && (github.event.pull_request.user.type != 'Bot' || github.event.pull_request.user.login == 'pandoks-grok[bot]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - uses: ./.github/actions/setup-node-pnpm

      - run: node scripts/claude-review/review.js
        env:
          ANTHROPIC_BASE_URL: https://cliproxyapi-ci.tailb2c81d.ts.net
          ANTHROPIC_API_KEY: cliproxyapi
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
