name: Security

permissions:
  contents: read
  security-events: write
  actions: read

on:
  workflow_call:
    inputs:
      kubernetes-config:
        description: Scan the Kubernetes manifests in k3s/ and apps/.
        type: boolean
        default: false
      images:
        description: JSON list of the built images to scan, each {"name","package","path"}, from build.yaml's artifacts.
        type: string
        default: '[]'
      charts:
        description: JSON list of the charts to scan, each {"name","path"}.
        type: string
        default: '[]'
      go-dependencies:
        description: Run govulncheck on every Go module, test code included.
        type: boolean
        default: false

jobs:
  scan-kubernetes-config:
    if: inputs.kubernetes-config
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - k3s
          - apps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan manifests with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.dir }}
          scanners: misconfig
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy-${{ matrix.dir }}.sarif

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-${{ matrix.dir }}.sarif
          category: trivy-${{ matrix.dir }}

  scan-images:
    if: inputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(inputs.images) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.image.package }}-${{ matrix.image.name }}
          path: ${{ runner.temp }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/${{ matrix.image.name }}.tar
          scanners: vuln,secret
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml

  scan-charts:
    if: inputs.charts != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJSON(inputs.charts) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan Helm chart with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.chart.path }}
          scanners: misconfig
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml

  scan-go-dependencies:
    if: inputs.go-dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: packages/valkey/reconciler/go.mod
          cache-dependency-path: '**/go.sum'

      - uses: ./.github/actions/setup-mise
        with:
          tools: go go:golang.org/x/vuln/cmd/govulncheck

      - name: Run govulncheck
        run: |
          for d in $(go list -m -f '{{.Dir}}'); do
            (cd "$d" && govulncheck -test ./...)
          done
