name: Maintenance

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: renovatebot/github-action@dd5302ec17783b2fc721b19ae7209b57b1587765 # v46.1.17
        with:
          token: ${{ secrets.GH_TOKEN }}
        env:
          LOG_LEVEL: info
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'true'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_GIT_AUTHOR: 'Renovate Bot <renovate@pandoks.com>'

  cleanup-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - patroni
          - pgbackrest
          - valkey
          - valkey-reconciler
          - argocd-sst-plugin
          - clickhouse
          - clickhouse-keeper
          - clickhouse-backup
          - charts/postgres
          - charts/valkey
          - charts/clickhouse
    env:
      GH_TOKEN: ${{ secrets.GH_PACKAGE_MANAGEMENT_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v6

      - name: Delete legacy unpromoted image builds for ${{ matrix.package }}
        if: ${{ !startsWith(matrix.package, 'charts/') }}
        shell: bash
        run: |
          api="/users/${OWNER,,}/packages/container/${PACKAGE}/versions"
          all=$(gh api --paginate --slurp "${api}" | jq 'add')
          cutoff=$(date -u -d '14 days ago' '+%Y-%m-%dT%H:%M:%SZ')
          ids=$(jq -r --arg cutoff "${cutoff}" '
            .[]
            | select(.updated_at < $cutoff)
            | (.metadata.container.tags // []) as $tags
            | select(($tags | length) > 0)
            | select(all($tags[]; startswith("build-ref-")))
            | .id' <<<"${all}")
          while read -r id; do
            [ -n "${id}" ] || continue
            echo "Deleting stale unpromoted ${PACKAGE} build ${id}"
            gh api --method DELETE "${api}/${id}"
          done <<<"${ids}"

      - name: Retain the newest 30 default-branch SHA images for ${{ matrix.package }}
        if: ${{ !startsWith(matrix.package, 'charts/') }}
        shell: bash
        run: |
          api="/users/${OWNER,,}/packages/container/${PACKAGE}/versions"
          all=$(gh api --paginate --slurp "${api}" | jq 'add')
          locked=$(jq -er --arg package "${PACKAGE}" '.[$package] | split("@")[1]' k3s/images.lock.json)
          ids=$(jq -r --arg locked "${locked}" '
            [
              .[]
              | select(.name != $locked)
              | (.metadata.container.tags // []) as $tags
              | select(($tags | length) > 0)
              | select(all($tags[]; test("^sha-[0-9a-f]{12}$")))
            ]
            | sort_by(.updated_at) | reverse | .[30:][]?.id' <<<"${all}")
          while read -r id; do
            [ -n "${id}" ] || continue
            echo "Deleting old ${PACKAGE} SHA image ${id}"
            gh api --method DELETE "${api}/${id}"
          done <<<"${ids}"

      - name: Delete orphan untagged versions for ${{ matrix.package }}
        shell: bash
        run: |
          api="/users/${OWNER,,}/packages/container/${PACKAGE//\//%2F}/versions"
          repo="${OWNER,,}/${PACKAGE}"
          all=$(gh api --paginate --slurp "${api}" | jq 'add')
          token=$(curl -fsSL "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r '.token')
          accept='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json'
          children=$(jq -r '.[] | select(.metadata.container.tags != []) | .name' <<<"${all}" \
            | xargs -I{} curl -fsSL -H "Authorization: Bearer ${token}" -H "Accept: ${accept}" "https://ghcr.io/v2/${repo}/manifests/{}" \
            | jq -rs '[.[].manifests[]?.digest] | unique[]')
          tagged=$(jq -r '.[] | select(.metadata.container.tags != []) | .name' <<<"${all}")
          attestations=$(printf '%s\n%s\n' "${tagged}" "${children}" | sort -u \
            | xargs -I{} curl -fsSL -H "Authorization: Bearer ${token}" -H "Accept: ${accept}" "https://ghcr.io/v2/${repo}/referrers/{}" \
            | jq -rs '[.[].manifests[]?.digest] | unique[]')
          keep=$(printf '%s\n%s\n' "${children}" "${attestations}" | sort -u)
          jq -r --argjson refs "$(jq -Rn '[inputs | select(length > 0)]' <<<"${keep}")" \
            '.[] | select(.metadata.container.tags == []) | select(.name as $d | $refs | index($d) | not) | .id' <<<"${all}" \
            | xargs -rI{} gh api --method DELETE "${api}/{}"
