name: Maintenance

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: renovatebot/github-action@dd5302ec17783b2fc721b19ae7209b57b1587765 # v46.1.17
        with:
          token: ${{ secrets.GH_TOKEN }}
        env:
          LOG_LEVEL: info
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'true'
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_GIT_AUTHOR: 'Renovate Bot <renovate@pandoks.com>'

  cleanup-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package:
          - patroni
          - pgbackrest
          - valkey
          - valkey-reconciler
          - argocd-sst-plugin
          - clickhouse
          - clickhouse-keeper
          - clickhouse-backup
          - charts/postgres
          - charts/valkey
          - charts/clickhouse
    env:
      GH_TOKEN: ${{ secrets.GH_PACKAGE_MANAGEMENT_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v6

      - name: Discover live branch tags
        id: branches
        if: ${{ !startsWith(matrix.package, 'charts/') }}
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          remote=$(git ls-remote --heads origin) \
            || { echo "Unable to enumerate live branches" >&2; exit 1; }
          branches=$(awk '{sub("refs/heads/", "", $2); print $2}' <<<"${remote}")
          tags=$(while IFS= read -r branch; do
            [ "${branch}" = "${DEFAULT_BRANCH}" ] && continue
            tag=$(printf '%s' "${branch}" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9._-]+/-/g' \
              | cut -c1-63)
            [[ "${tag}" =~ ^[a-z0-9_][a-z0-9_.-]*$ ]] \
              || { echo "Branch cannot form a valid image tag: ${branch}" >&2; exit 1; }
            printf '%s\n' "${tag}"
          done <<<"${branches}") || exit 1
          duplicate=$(printf '%s\n' "${tags}" | sort | uniq -d | head -1)
          [ -z "${duplicate}" ] \
            || { echo "Multiple live branches normalize to ${duplicate}" >&2; exit 1; }
          tags_json=$(printf '%s\n' "${tags}" | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "tags=${tags_json}" >> "${GITHUB_OUTPUT}"

      - name: Apply image retention policy to ${{ matrix.package }}
        if: ${{ !startsWith(matrix.package, 'charts/') }}
        shell: bash
        env:
          LIVE_TAGS: ${{ steps.branches.outputs.tags }}
        run: |
          api="/users/${OWNER,,}/packages/container/${PACKAGE}/versions"
          all=$(gh api --paginate --slurp "${api}" | jq 'add')
          cutoff=$(date -u -d '30 days ago' '+%Y-%m-%dT%H:%M:%SZ')
          locked=$(jq -er --arg package "${PACKAGE}" '.[$package] | split("@")[1]' k3s/images.lock.json)
          newest=$(jq -c '
            [.[]
              | select(any(.metadata.container.tags[]?; test("^sha-[0-9a-f]{12}$")))]
            | sort_by(.created_at) | reverse | .[:10] | map(.id)' <<<"${all}")
          ids=$(jq -r \
            --arg cutoff "${cutoff}" \
            --arg locked "${locked}" \
            --argjson live "${LIVE_TAGS}" \
            --argjson newest "${newest}" '
              def has_live_tag($tags):
                any($tags[]; . as $tag | $live | index($tag) != null);
              .[]
              | (.metadata.container.tags // []) as $tags
              | select(($tags | length) > 0)
              | select(.name != $locked)
              | select(.created_at < $cutoff)
              | .id as $id
              | select(($newest | index($id)) == null)
              | select(($tags | index("latest")) == null)
              | select(has_live_tag($tags) | not)
              | .id' <<<"${all}")
          while read -r id; do
            [ -n "${id}" ] || continue
            echo "Deleting expired ${PACKAGE} image version ${id}"
            gh api --method DELETE "${api}/${id}"
          done <<<"${ids}"

      - name: Delete orphan untagged versions for ${{ matrix.package }}
        shell: bash
        run: |
          api="/users/${OWNER,,}/packages/container/${PACKAGE//\//%2F}/versions"
          repo="${OWNER,,}/${PACKAGE}"
          all=$(gh api --paginate --slurp "${api}" | jq 'add')
          token=$(curl -fsSL "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r '.token')
          accept='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json'
          children=$(jq -r '.[] | select(.metadata.container.tags != []) | .name' <<<"${all}" \
            | xargs -I{} curl -fsSL -H "Authorization: Bearer ${token}" -H "Accept: ${accept}" "https://ghcr.io/v2/${repo}/manifests/{}" \
            | jq -rs '[.[].manifests[]?.digest] | unique[]')
          tagged=$(jq -r '.[] | select(.metadata.container.tags != []) | .name' <<<"${all}")
          attestations=$(printf '%s\n%s\n' "${tagged}" "${children}" | sort -u \
            | xargs -I{} curl -fsSL -H "Authorization: Bearer ${token}" -H "Accept: ${accept}" "https://ghcr.io/v2/${repo}/referrers/{}" \
            | jq -rs '[.[].manifests[]?.digest] | unique[]')
          keep=$(printf '%s\n%s\n' "${children}" "${attestations}" | sort -u)
          jq -r --argjson refs "$(jq -Rn '[inputs | select(length > 0)]' <<<"${keep}")" \
            '.[] | select(.metadata.container.tags == []) | select(.name as $d | $refs | index($d) | not) | .id' <<<"${all}" \
            | xargs -rI{} gh api --method DELETE "${api}/{}"
