name: Sync Notion Content
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      - uses: ./.github/actions/setup-mise
        with:
          tools: aqua:pulumi/pulumi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-west-1

      - name: Configure the Pulumi state profile
        run: |
          aws configure set profile.pandoks-pulumi-state.region auto
          aws configure set profile.pandoks-pulumi-state.credential_process \
            'aws ssm get-parameter --region us-west-1 --name /pulumi/r2-state-credentials --with-decryption --query Parameter.Value --output text'

      - name: Sync all Notion content
        run: |
          outputs=$(pulumi stack output --stack production --json --show-secrets)
          NOTION_API_KEY=$(jq -r .NotionApiKey <<<"${outputs}")
          echo "::add-mask::${NOTION_API_KEY}"
          BLOG_NOTION_DATABASE_ID=$(jq -r .NotionBlogDatabaseId <<<"${outputs}")
          export NOTION_API_KEY BLOG_NOTION_DATABASE_ID
          pnpm -r --if-present run sync:notion

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: 'update(notion): sync from Notion'
          title: 'update(notion): sync from Notion'
          body: |
            Automated content sync from Notion
          branch: auto/notion-sync
          delete-branch: true
          add-paths: |
            apps/web/*
