name: Sync Notion Content
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-node-pnpm

      # NOTE: a Notion webhook starts this job, so it gets the Notion key alone, not sst shell or AWS
      - name: Sync all Notion content
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          BLOG_NOTION_DATABASE_ID: ${{ vars.BLOG_NOTION_DATABASE_ID }}
        run: pnpm -r --if-present run sync:notion

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: 'update(notion): sync from Notion'
          title: 'update(notion): sync from Notion'
          body: |
            Automated content sync from Notion
          branch: auto/notion-sync
          delete-branch: true
          add-paths: |
            apps/web/*
