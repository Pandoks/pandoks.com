name: Build and Publish

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
  PUBLISH: ${{ github.ref == 'refs/heads/main' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'preview')) }}
  CHART_VERSION: 0.0.0-${{ github.event.pull_request.number && format('pr.{0}.', github.event.pull_request.number) || '' }}ci.${{ github.run_id }}.${{ github.run_attempt }}

concurrency:
  group: build-and-publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.select.outputs.images }}
      charts: ${{ steps.select.outputs.charts }}
      release: ${{ steps.released.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
      - name: Find the released source
        id: released
        if: github.event_name != 'pull_request' || env.PUBLISH == 'true'
        run: |
          release=$(git ls-remote origin refs/heads/deploy/production)
          if [ -n "$release" ]; then
            git fetch --depth=1 origin deploy/production
            source=$(git show FETCH_HEAD:SOURCE_REVISION)
            printf 'release=%s\nsource=%s\n' "$(git rev-parse FETCH_HEAD)" "$source" >> "$GITHUB_OUTPUT"
          fi
      - id: changes
        if: github.event_name == 'pull_request' || steps.released.outputs.source != ''
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # NOTE: without a token, dorny diffs a preview against base instead of listing the PR's files.
          token: ${{ steps.released.outputs.source == '' && github.token || '' }}
          base: ${{ steps.released.outputs.source }}
          ref: ${{ env.SOURCE_REVISION }}
          filters: |
            patroni:
              - 'packages/postgres/patroni/**'
            pgbackrest:
              - 'packages/postgres/pgbackrest/**'
            valkey:
              - 'packages/valkey/Dockerfile'
              - 'packages/valkey/entrypoint.sh'
            valkey-reconciler:
              - 'packages/valkey/reconciler/**'
            argocd-sst-plugin:
              - 'packages/argocd/**'
            clickhouse:
              - 'packages/clickhouse/clickhouse/**'
            clickhouse-keeper:
              - 'packages/clickhouse/keeper/**'
            clickhouse-backup:
              - 'packages/clickhouse/backup/**'
            postgres-chart:
              - 'packages/postgres/chart/**'
            valkey-chart:
              - 'packages/valkey/chart/**'
            clickhouse-chart:
              - 'packages/clickhouse/chart/**'
      - name: Select images and charts
        id: select
        env:
          CHANGES: ${{ steps.changes.outputs.changes }}
        run: |
          images='[
            {"name":"patroni","dockerfile":"packages/postgres/patroni/Dockerfile"},
            {"name":"pgbackrest","dockerfile":"packages/postgres/pgbackrest/Dockerfile"},
            {"name":"valkey","dockerfile":"packages/valkey/Dockerfile"},
            {"name":"valkey-reconciler","dockerfile":"packages/valkey/reconciler/Dockerfile"},
            {"name":"argocd-sst-plugin","dockerfile":"packages/argocd/Dockerfile"},
            {"name":"clickhouse","dockerfile":"packages/clickhouse/clickhouse/Dockerfile"},
            {"name":"clickhouse-keeper","dockerfile":"packages/clickhouse/keeper/Dockerfile"},
            {"name":"clickhouse-backup","dockerfile":"packages/clickhouse/backup/Dockerfile"}
          ]'
          charts='["postgres","valkey","clickhouse"]'
          # NOTE: with no release to compare against, everything is built.
          if [ -z "$CHANGES" ]; then
            CHANGES=$(jq -nc --argjson images "$images" --argjson charts "$charts" '[$images[].name, ($charts[] + "-chart")]')
          fi
          images=$(jq -c --argjson changes "$CHANGES" 'map(select(.name | IN($changes[])))' <<<"$images")
          charts=$(jq -c --argjson changes "$CHANGES" 'map(select(. + "-chart" | IN($changes[])))' <<<"$charts")
          printf 'images=%s\ncharts=%s\n' "$images" "$charts" >> "$GITHUB_OUTPUT"

  images:
    needs: detect-changes
    if: needs.detect-changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.images) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.name }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.name }}:scan
          scanners: vuln,secret
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_REVISION }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=build-${{ github.run_id }}-${{ github.run_attempt }}
            type=raw,value=pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }},enable=${{ github.event_name == 'pull_request' }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        if: env.PUBLISH == 'true'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.push.outputs.digest != ''
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
      - name: Record image digest
        if: steps.push.outputs.digest != ''
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: printf 'ghcr.io/%s/%s@%s\n' "${OWNER,,}" "$IMAGE" "$DIGEST" > "$RUNNER_TEMP/$IMAGE.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.push.outputs.digest != ''
        with:
          name: release-image-${{ matrix.name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ matrix.name }}.txt
          if-no-files-found: error

  charts:
    needs: detect-changes
    if: needs.detect-changes.outputs.charts != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        chart: ${{ fromJSON(needs.detect-changes.outputs.charts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
      - uses: ./.github/actions/setup-mise
        with:
          tools: helm
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: packages/${{ matrix.chart }}/chart
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml
      - name: Package chart
        run: helm package "packages/${{ matrix.chart }}/chart" --version "$CHART_VERSION"
      - name: Publish chart
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          CHART: ${{ matrix.chart }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$CHART-$CHART_VERSION.tgz" "oci://ghcr.io/${OWNER,,}/charts"
          printf '%s\n' "$CHART_VERSION" > "$RUNNER_TEMP/$CHART.version"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.PUBLISH == 'true'
        with:
          name: release-chart-${{ matrix.chart }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ matrix.chart }}.version
          if-no-files-found: error

  publish:
    needs: [detect-changes, images, charts]
    if: ${{ !failure() && !cancelled() && (github.ref == 'refs/heads/main' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'preview'))) }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.event.pull_request.number || 'production' }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      pull-requests: read
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      infrastructure: ${{ steps.release.outputs.infrastructure }}
    env:
      GH_TOKEN: ${{ github.token }}
      PREVIEW_NUMBER: ${{ github.event.pull_request.number }}
      BASE_REVISION: ${{ github.event.pull_request.base.sha }}
      CHECK_EVENT: ${{ github.event_name == 'pull_request' && 'pull_request' || 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          fetch-depth: 0
      - name: Require successful checks for this source
        run: |
          for workflow in Checks Tests Security; do
            run=$(gh run list --workflow "$workflow" --commit "$SOURCE_REVISION" --event "$CHECK_EVENT" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run" ] || { echo "No $workflow run for $SOURCE_REVISION" >&2; exit 1; }
            gh run watch "$run" --exit-status
          done
      - uses: ./.github/actions/setup-mise
        with:
          tools: kustomize yq
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*-${{ github.run_attempt }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-inputs
      - name: Publish source and artifact pins for Argo CD
        id: release
        env:
          BUILT_IMAGES: ${{ join(fromJSON(needs.detect-changes.outputs.images).*.name, ' ') }}
          BUILT_CHARTS: ${{ join(fromJSON(needs.detect-changes.outputs.charts), ' ') }}
          PRODUCTION_RELEASE: ${{ needs.detect-changes.outputs.release }}
        run: scripts/ci/publish.sh "$RUNNER_TEMP/release-inputs" "$BUILT_IMAGES" "$BUILT_CHARTS" "$PRODUCTION_RELEASE"

  shared-dev:
    needs: publish
    if: needs.publish.outputs.infrastructure == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: release-dev
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PREVIEW_NUMBER: ${{ github.event.pull_request.number }}
      RELEASE_REVISION: ${{ needs.publish.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish.outputs.revision }}
          fetch-depth: 0
      - name: Publish shared infrastructure changes once for the dev cluster
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PREVIEW_NUMBER")
          jq -e --arg source "$SOURCE_REVISION" '.state == "open" and .head.sha == $source and any(.labels[]; .name == "preview")' <<<"$current" >/dev/null || exit 0
          previous=$(git ls-remote origin refs/heads/deploy/dev | cut -f1)
          git push --force-with-lease="refs/heads/deploy/dev:$previous" origin "$RELEASE_REVISION:refs/heads/deploy/dev"
          printf 'Shared dev infrastructure now follows PR #%s, source %s.\n' "$PREVIEW_NUMBER" "$SOURCE_REVISION" >> "$GITHUB_STEP_SUMMARY"

  wait-for-argocd:
    needs: publish
    if: needs.publish.outputs.revision != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Tailscale
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure kubeconfig
        run: |
          PEERS=$(sudo tailscale status --peers) || { echo "tailscale status failed"; exit 1; }
          if ! echo "$PEERS" | grep -q prod-cluster; then
            echo "No cluster found — skipping the wait"
            echo "SKIP_WAIT=true" >> "$GITHUB_ENV"
            exit 0
          fi
          sudo tailscale configure kubeconfig prod-cluster

      - name: Trigger ArgoCD Sync
        if: env.SKIP_WAIT != 'true'
        run: |
          sudo kubectl annotate application prod-cluster \
            argocd.argoproj.io/refresh=hard \
            --overwrite \
            --namespace argocd

      - name: Wait for ArgoCD Sync
        if: env.SKIP_WAIT != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REVISION: ${{ needs.publish.outputs.revision }}
        run: |
          while [ "${SECONDS}" -lt 600 ]; do
            argocd_app=$(sudo kubectl get application prod-cluster -n argocd -o json)
            argocd_revision=$(jq -r .status.sync.revision <<<"${argocd_app}")
            deploy_state=$(jq -r '
              if .metadata.annotations["argocd.argoproj.io/refresh"] then "refreshing"
              elif any(.status.conditions[]?; .type == "ComparisonError")
                or (.status.operationState.operation.sync.revision == .status.sync.revision
                  and (.status.operationState.phase | IN("Failed", "Error"))) then "failed"
              elif .status.sync.status == "Synced" and .status.health.status == "Healthy" then "healthy"
              else "waiting" end' <<<"${argocd_app}")

            if [ "${deploy_state}" = failed ] || [ "${deploy_state}" = healthy ]; then
              # NOTE: a newer release may have replaced this one, so a revision that contains it also counts.
              comparison_to_release=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${RELEASE_REVISION}...${argocd_revision}" --jq .status)
              case "${deploy_state}:${comparison_to_release}" in
                failed:identical | failed:ahead)
                  echo "Sync failed at ${argocd_revision}:"
                  jq -r '.status.conditions[]?.message, .status.operationState.message // empty' <<<"${argocd_app}"
                  exit 1
                  ;;
                healthy:identical | healthy:ahead)
                  echo "Synced and healthy at ${argocd_revision}"
                  exit 0
                  ;;
              esac
            fi
            sleep 5
          done
          echo "Timed out waiting for release ${RELEASE_REVISION} to sync healthy: ${deploy_state} at ${argocd_revision}"
          jq -r '"Health: \(.status.health.status)",
            (.status.resources[]? | select(.health.status == "Degraded") | "\(.kind) \(.name): \(.health.message // "")"),
            .status.conditions[]?.message, .status.operationState.message // empty' <<<"${argocd_app}"
          exit 1

  build-and-publish-pass:
    needs: [detect-changes, images, charts, publish, shared-dev, wait-for-argocd]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
