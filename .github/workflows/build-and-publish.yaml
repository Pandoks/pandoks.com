name: Build and Publish

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      patroni:
        description: 'Image · patroni'
        type: boolean
        default: false
      pgbackrest:
        description: 'Image · pgbackrest'
        type: boolean
        default: false
      valkey:
        description: 'Image · valkey'
        type: boolean
        default: false
      valkey-reconciler:
        description: 'Image · valkey-reconciler'
        type: boolean
        default: false
      argocd-sst-plugin:
        description: 'Image · argocd-sst-plugin'
        type: boolean
        default: false
      clickhouse:
        description: 'Image · clickhouse'
        type: boolean
        default: false
      clickhouse-keeper:
        description: 'Image · clickhouse-keeper'
        type: boolean
        default: false
      clickhouse-backup:
        description: 'Image · clickhouse-backup'
        type: boolean
        default: false
      postgres-chart:
        description: 'Chart · postgres'
        type: boolean
        default: false
      valkey-chart:
        description: 'Chart · valkey'
        type: boolean
        default: false
      clickhouse-chart:
        description: 'Chart · clickhouse'
        type: boolean
        default: false
  push:
    branches:
      - '**'

concurrency:
  group: build-and-publish-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.set-image-matrix.outputs.images }}
      charts: ${{ steps.set-chart-matrix.outputs.charts }}
      moving-tag: ${{ steps.image-tags.outputs.moving }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Define build catalog
        id: build-catalog
        shell: bash
        run: |
          catalog='{
            "rebuild-all": [
              ".github/workflows/build-and-publish.yaml",
              "scripts/ci/build-and-publish.sh",
              "trivy.yaml",
              ".trivyignore.yaml"
            ],
            "images": [
              {
                "name": "patroni",
                "path": "./packages/postgres/patroni/Dockerfile",
                "watch": ["packages/postgres/patroni/**"]
              },
              {
                "name": "pgbackrest",
                "path": "./packages/postgres/pgbackrest/Dockerfile",
                "watch": ["packages/postgres/pgbackrest/**"]
              },
              {
                "name": "valkey",
                "path": "./packages/valkey/Dockerfile",
                "watch": [
                  "packages/valkey/Dockerfile",
                  "packages/valkey/entrypoint.sh"
                ]
              },
              {
                "name": "valkey-reconciler",
                "path": "./packages/valkey/reconciler/Dockerfile",
                "watch": ["packages/valkey/reconciler/**"]
              },
              {
                "name": "argocd-sst-plugin",
                "path": "./packages/argocd/Dockerfile",
                "watch": [
                  "packages/argocd/**",
                  "package.json",
                  "pnpm-lock.yaml",
                  "pnpm-workspace.yaml",
                  "mise.toml"
                ]
              },
              {
                "name": "clickhouse",
                "path": "./packages/clickhouse/clickhouse/Dockerfile",
                "watch": ["packages/clickhouse/clickhouse/**"]
              },
              {
                "name": "clickhouse-keeper",
                "path": "./packages/clickhouse/keeper/Dockerfile",
                "watch": ["packages/clickhouse/keeper/**"]
              },
              {
                "name": "clickhouse-backup",
                "path": "./packages/clickhouse/backup/Dockerfile",
                "watch": ["packages/clickhouse/backup/**"]
              }
            ],
            "charts": [
              {"name":"postgres","path":"./packages/postgres/chart","watch":["packages/postgres/chart/**"]},
              {"name":"valkey","path":"./packages/valkey/chart","watch":["packages/valkey/chart/**"]},
              {"name":"clickhouse","path":"./packages/clickhouse/chart","watch":["packages/clickhouse/chart/**"]}
            ]
          }'
          catalog=$(jq -c . <<< "${catalog}")
          image_filters=$(scripts/ci/build-and-publish.sh image-filters "${catalog}")
          chart_filters=$(scripts/ci/build-and-publish.sh chart-filters "${catalog}")
          {
            printf "catalog=%s\n" "${catalog}"
            printf "image-filters=%s\n" "${image_filters}"
            printf "chart-filters=%s\n" "${chart_filters}"
          } >> "${GITHUB_OUTPUT}"

      - id: image-changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: ${{ steps.build-catalog.outputs.image-filters }}

      - id: chart-changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: ${{ steps.build-catalog.outputs.chart-filters }}

      - name: Create image matrix
        id: set-image-matrix
        run: |
          images=$(scripts/ci/build-and-publish.sh image-matrix \
            '${{ steps.build-catalog.outputs.catalog }}' \
            '${{ github.event_name == 'workflow_dispatch' && toJSON(inputs) || steps.image-changes.outputs.changes || '[]' }}')
          printf "images=%s\n" "${images}" >> "${GITHUB_OUTPUT}"

      - name: Create chart matrix
        id: set-chart-matrix
        run: |
          charts=$(scripts/ci/build-and-publish.sh chart-matrix \
            '${{ steps.build-catalog.outputs.catalog }}' \
            '${{ github.event_name == 'workflow_dispatch' && toJSON(inputs) || steps.chart-changes.outputs.changes || '[]' }}')
          printf "charts=%s\n" "${charts}" >> "${GITHUB_OUTPUT}"

      - name: Validate moving image tag
        id: image-tags
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          moving=$(scripts/ci/build-and-publish.sh moving-tag \
            "${GITHUB_REF_NAME}" "${DEFAULT_BRANCH}")
          printf "moving=%s\n" "${moving}" >> "${GITHUB_OUTPUT}"

  build-publish-images:
    needs: detect-changes
    if: needs.detect-changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.detect-changes.outputs.images) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.image.path }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        env:
          DOCKER_METADATA_SHORT_SHA_LENGTH: 12
        with:
          # NOTE: github.repository includes the owner/org (ghcr.io/<owner/org>/repo-name)
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          tags: |
            type=raw,value=${{ needs.detect-changes.outputs.moving-tag }}
            type=sha

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: . # WARN: all dockerfiles should have a context of the root of the repo
          file: ${{ matrix.image.path }}
          load: true
          push: false
          tags: ${{ matrix.image.name }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image.name }}:scan
          scanners: vuln,secret
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml

      - name: Push image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Generate Attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false

  build-publish-charts:
    needs: detect-changes
    if: needs.detect-changes.outputs.charts != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        chart: ${{ fromJSON(needs.detect-changes.outputs.charts) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan Helm chart with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.chart.path }}
          scanners: misconfig
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml

      - uses: ./.github/actions/setup-mise
        with:
          tools: helm

      - name: Package Helm Chart
        run: helm package "${{ matrix.chart.path }}"

      - name: Login to GHCR
        if: github.ref_name == github.event.repository.default_branch && matrix.chart.publish
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Helm Chart
        if: github.ref_name == github.event.repository.default_branch && matrix.chart.publish
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          helm push "${{ matrix.chart.name }}"-*.tgz "oci://ghcr.io/${OWNER,,}/charts"

  build-and-publish-pass:
    needs:
      - detect-changes
      - build-publish-images
      - build-publish-charts
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "ok"
