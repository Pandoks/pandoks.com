name: Build and Publish

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      patroni:
        description: 'Image · patroni'
        type: boolean
        default: false
      pgbackrest:
        description: 'Image · pgbackrest'
        type: boolean
        default: false
      valkey:
        description: 'Image · valkey'
        type: boolean
        default: false
      valkey-reconciler:
        description: 'Image · valkey-reconciler'
        type: boolean
        default: false
      argocd-sst-plugin:
        description: 'Image · argocd-sst-plugin'
        type: boolean
        default: false
      clickhouse:
        description: 'Image · clickhouse'
        type: boolean
        default: false
      clickhouse-keeper:
        description: 'Image · clickhouse-keeper'
        type: boolean
        default: false
      clickhouse-backup:
        description: 'Image · clickhouse-backup'
        type: boolean
        default: false
      postgres-chart:
        description: 'Chart · postgres'
        type: boolean
        default: false
      valkey-chart:
        description: 'Chart · valkey'
        type: boolean
        default: false
      clickhouse-chart:
        description: 'Chart · clickhouse'
        type: boolean
        default: false
  push:
    branches:
      - '**'

concurrency:
  group: build-and-publish-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.set-image-matrix.outputs.images }}
      charts: ${{ steps.set-chart-matrix.outputs.charts }}
      valkey-image: ${{ steps.image-changes.outputs.valkey == 'true' || inputs.valkey }}
      valkey-reconciler-image: ${{ steps.image-changes.outputs.valkey-reconciler == 'true' || inputs.valkey-reconciler }}
      valkey-e2e: ${{ steps.e2e-changes.outputs.valkey == 'true' || inputs.valkey-chart }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: image-changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            patroni:
              - 'packages/postgres/patroni/**'
            pgbackrest:
              - 'packages/postgres/pgbackrest/**'
            valkey:
              - 'packages/valkey/Dockerfile'
              - 'packages/valkey/entrypoint.sh'
            valkey-reconciler:
              - 'packages/valkey/reconciler/**'
            argocd-sst-plugin:
              - 'packages/argocd/**'
            clickhouse:
              - 'packages/clickhouse/clickhouse/**'
            clickhouse-keeper:
              - 'packages/clickhouse/keeper/**'
            clickhouse-backup:
              - 'packages/clickhouse/backup/**'

      - id: chart-changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            postgres:
              - 'packages/postgres/chart/**'
            valkey:
              - 'packages/valkey/chart/**'
            clickhouse:
              - 'packages/clickhouse/chart/**'

      - id: e2e-changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            needs-e2e-setup: &needs-e2e-setup
              - '.github/workflows/build-and-publish.yaml'
              - '.github/actions/**'
              - 'packages/e2e/**'
              - 'scripts/cluster/**'
              - 'scripts/lib/**'
              - 'docker-compose.yaml'
              - 'go.work'
              - 'go.work.sum'
              - 'mise.toml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            valkey:
              - 'packages/valkey/**'
              - 'k3s/base/core/valkey.yaml'
              - *needs-e2e-setup

      - id: set-image-matrix
        env:
          DISPATCH: ${{ toJSON(inputs) }}
        run: |
          all='[
            {"name":"patroni","path":"./packages/postgres/patroni/Dockerfile"},
            {"name":"pgbackrest","path":"./packages/postgres/pgbackrest/Dockerfile"},
            {"name":"argocd-sst-plugin","path":"./packages/argocd/Dockerfile"},
            {"name":"clickhouse","path":"./packages/clickhouse/clickhouse/Dockerfile"},
            {"name":"clickhouse-keeper","path":"./packages/clickhouse/keeper/Dockerfile"},
            {"name":"clickhouse-backup","path":"./packages/clickhouse/backup/Dockerfile"}
          ]'
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            selected=$(jq -c 'to_entries | map(select(.value == true) | .key)' <<<"${DISPATCH}")
          else
            selected='${{ steps.image-changes.outputs.changes || '[]' }}'
          fi
          images=$(jq -c --argjson sel "${selected}" 'map(select(.name as $n | $sel | index($n)))' <<<"${all}")
          echo "images=${images}" >> "${GITHUB_OUTPUT}"

      - id: set-chart-matrix
        env:
          DISPATCH: ${{ toJSON(inputs) }}
        run: |
          all='[
            {"name":"postgres","path":"./packages/postgres/chart"},
            {"name":"valkey","path":"./packages/valkey/chart"},
            {"name":"clickhouse","path":"./packages/clickhouse/chart"}
          ]'
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            selected=$(jq -c 'to_entries | map(select(.value == true and (.key | endswith("-chart"))) | .key | sub("-chart$"; ""))' <<<"${DISPATCH}")
          else
            selected='${{ steps.chart-changes.outputs.changes || '[]' }}'
          fi
          charts=$(jq -c --argjson sel "${selected}" 'map(select(.name as $n | $sel | index($n)))' <<<"${all}")
          echo "charts=${charts}" >> "${GITHUB_OUTPUT}"

  build-publish-images:
    needs: detect-changes
    if: needs.detect-changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        image: ${{ fromJSON(needs.detect-changes.outputs.images) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/build-image
        with:
          name: ${{ matrix.image.name }}
          dockerfile: ${{ matrix.image.path }}

  build-test-publish-valkey:
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.valkey-e2e == 'true' ||
      needs.detect-changes.outputs.valkey-image == 'true' ||
      needs.detect-changes.outputs.valkey-reconciler-image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: needs.detect-changes.outputs.valkey-image == 'true'
        uses: ./.github/actions/build-image
        with:
          name: valkey
          dockerfile: ./packages/valkey/Dockerfile

      - if: needs.detect-changes.outputs.valkey-reconciler-image == 'true'
        uses: ./.github/actions/build-image
        with:
          name: valkey-reconciler
          dockerfile: ./packages/valkey/reconciler/Dockerfile

      - uses: ./.github/actions/setup-node-pnpm

      - uses: ./.github/actions/setup-mise
        with:
          tools: go k3d kubectl helm

      - name: Create k3d cluster
        run: pnpm cluster k3d deps up && pnpm cluster k3d up

      # NOTE: below the job timeout, so a hung spec still dumps its diagnostics
      - name: Run e2e tests
        env:
          VALKEY_IMAGE_BUILT: ${{ needs.detect-changes.outputs.valkey-image }}
          RECONCILER_IMAGE_BUILT: ${{ needs.detect-changes.outputs.valkey-reconciler-image }}
        run: |
          suite_flags=()
          if [[ "${VALKEY_IMAGE_BUILT}" == 'true' ]]; then
            docker tag valkey:scan localhost:12345/valkey:latest
            docker push localhost:12345/valkey:latest
            suite_flags+=(--valkey-image=local-registry:5000/valkey:latest)
          fi
          if [[ "${RECONCILER_IMAGE_BUILT}" == 'true' ]]; then
            docker tag valkey-reconciler:scan localhost:12345/valkey-reconciler:latest
            docker push localhost:12345/valkey-reconciler:latest
            suite_flags+=(--reconciler-image=local-registry:5000/valkey-reconciler:latest)
          fi
          go tool ginkgo -p --timeout=20m ./packages/valkey/e2e -- "${suite_flags[@]}"

  build-publish-charts:
    needs: detect-changes
    if: needs.detect-changes.outputs.charts != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        chart: ${{ fromJSON(needs.detect-changes.outputs.charts) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan Helm chart with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.chart.path }}
          scanners: misconfig
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml

      - uses: ./.github/actions/setup-mise
        with:
          tools: helm

      - name: Login to GHCR
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and Push Helm Chart
        env:
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.ref_name }} # WARNING: do not inline this (security risk)
        run: |
          version_arg=()
          if [[ "${BRANCH}" != "${{ github.event.repository.default_branch }}" ]]; then
            version_arg=(--version "$(yq .version "${{ matrix.chart.path }}/Chart.yaml")-${BRANCH//\//-}")
          fi
          helm package "${{ matrix.chart.path }}" "${version_arg[@]}"
          helm push "${{ matrix.chart.name }}"-*.tgz "oci://ghcr.io/${OWNER,,}/charts"

  build-and-publish-pass:
    needs:
      - detect-changes
      - build-publish-images
      - build-test-publish-valkey
      - build-publish-charts
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
