name: Build and Publish

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      patroni:
        description: 'Image · patroni'
        type: boolean
        default: false
      pgbackrest:
        description: 'Image · pgbackrest'
        type: boolean
        default: false
      valkey:
        description: 'Image · valkey'
        type: boolean
        default: false
      valkey-reconciler:
        description: 'Image · valkey-reconciler'
        type: boolean
        default: false
      argocd-sst-plugin:
        description: 'Image · argocd-sst-plugin'
        type: boolean
        default: false
      clickhouse:
        description: 'Image · clickhouse'
        type: boolean
        default: false
      clickhouse-keeper:
        description: 'Image · clickhouse-keeper'
        type: boolean
        default: false
      clickhouse-backup:
        description: 'Image · clickhouse-backup'
        type: boolean
        default: false
      postgres-chart:
        description: 'Chart · postgres'
        type: boolean
        default: false
      valkey-chart:
        description: 'Chart · valkey'
        type: boolean
        default: false
      clickhouse-chart:
        description: 'Chart · clickhouse'
        type: boolean
        default: false
  push:
    branches:
      - '**'

concurrency:
  group: build-and-publish-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.set-image-matrix.outputs.images }}
      charts: ${{ steps.set-chart-matrix.outputs.charts }}
      moving-tag: ${{ steps.image-tags.outputs.moving }}
      immutable-tag: ${{ steps.image-tags.outputs.immutable }}

    steps:
      - uses: actions/checkout@v6

      - id: image-changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            scan-all:
              - '.github/workflows/build-and-publish.yaml'
              - 'trivy.yaml'
              - '.trivyignore.yaml'
            patroni:
              - 'packages/postgres/patroni/**'
            pgbackrest:
              - 'packages/postgres/pgbackrest/**'
            valkey:
              - 'packages/valkey/Dockerfile'
              - 'packages/valkey/entrypoint.sh'
            valkey-reconciler:
              - 'packages/valkey/reconciler/**'
            argocd-sst-plugin:
              - 'packages/argocd/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'mise.toml'
            clickhouse:
              - 'packages/clickhouse/clickhouse/**'
            clickhouse-keeper:
              - 'packages/clickhouse/keeper/**'
            clickhouse-backup:
              - 'packages/clickhouse/backup/**'

      - id: chart-changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        with:
          filters: |
            scan-all:
              - '.github/workflows/build-and-publish.yaml'
              - 'trivy.yaml'
              - '.trivyignore.yaml'
            postgres:
              - 'packages/postgres/chart/**'
            valkey:
              - 'packages/valkey/chart/**'
            clickhouse:
              - 'packages/clickhouse/chart/**'

      - id: set-image-matrix
        env:
          DISPATCH: ${{ toJSON(inputs) }}
        run: |
          all='[
            {"name":"patroni","path":"./packages/postgres/patroni/Dockerfile"},
            {"name":"pgbackrest","path":"./packages/postgres/pgbackrest/Dockerfile"},
            {"name":"valkey","path":"./packages/valkey/Dockerfile"},
            {"name":"valkey-reconciler","path":"./packages/valkey/reconciler/Dockerfile"},
            {"name":"argocd-sst-plugin","path":"./packages/argocd/Dockerfile"},
            {"name":"clickhouse","path":"./packages/clickhouse/clickhouse/Dockerfile"},
            {"name":"clickhouse-keeper","path":"./packages/clickhouse/keeper/Dockerfile"},
            {"name":"clickhouse-backup","path":"./packages/clickhouse/backup/Dockerfile"}
          ]'
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            selected=$(jq -c 'to_entries | map(select(.value == true and (.key | endswith("-chart") | not)) | .key)' <<<"${DISPATCH}")
          elif [[ "${{ steps.image-changes.outputs.scan-all }}" == "true" ]]; then
            selected=$(jq -c 'map(.name)' <<<"${all}")
          else
            selected='${{ steps.image-changes.outputs.changes || '[]' }}'
          fi
          images=$(jq -c --argjson selected "${selected}" \
            'map(select(.name as $name | $selected | index($name)))' <<<"${all}")
          echo "images=${images}" >> "${GITHUB_OUTPUT}"

      - id: set-chart-matrix
        env:
          DISPATCH: ${{ toJSON(inputs) }}
        run: |
          all='[
            {"name":"postgres","path":"./packages/postgres/chart"},
            {"name":"valkey","path":"./packages/valkey/chart"},
            {"name":"clickhouse","path":"./packages/clickhouse/chart"}
          ]'
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            selected=$(jq -c 'to_entries | map(select(.value == true and (.key | endswith("-chart"))) | .key | sub("-chart$"; ""))' <<<"${DISPATCH}")
            scan_all=false
          else
            selected='${{ steps.chart-changes.outputs.changes || '[]' }}'
            scan_all='${{ steps.chart-changes.outputs.scan-all || 'false' }}'
          fi
          charts=$(jq -c --argjson sel "${selected}" --argjson scan_all "${scan_all}" '
            map(. + {publish: (.name as $n | $sel | index($n) != null)})
            | map(select($scan_all or .publish))' <<<"${all}")
          echo "charts=${charts}" >> "${GITHUB_OUTPUT}"

      - name: Compute conventional image tags
        id: image-tags
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }} # WARNING: do not inline this (security risk)
          COMMIT_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          short_sha=${COMMIT_SHA:0:12}
          if [[ "${BRANCH}" == "${DEFAULT_BRANCH}" ]]; then
            moving=latest
            immutable="sha-${short_sha}"
          else
            moving=$(printf '%s' "${BRANCH}" \
              | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9._-]+/-/g' \
              | cut -c1-63)
            [[ "${moving}" =~ ^[a-z0-9_][a-z0-9_.-]*$ ]] \
              || { echo "Branch cannot form a valid image tag: ${BRANCH}" >&2; exit 1; }
            immutable="${moving}-sha-${short_sha}"

            remote_branches=$(git ls-remote --heads origin) \
              || { echo "Unable to enumerate origin branches" >&2; exit 1; }
            collision=$(while IFS= read -r candidate; do
                  [[ "${candidate}" == "${BRANCH}" ]] && continue
                  candidate_tag=$(printf '%s' "${candidate}" \
                    | tr '[:upper:]' '[:lower:]' \
                    | sed -E 's/[^a-z0-9._-]+/-/g' \
                    | cut -c1-63)
                  if [[ "${candidate_tag}" == "${moving}" ]]; then
                    printf '%s\n' "${candidate}"
                    break
                  fi
                done < <(awk '{sub("refs/heads/", "", $2); print $2}' <<<"${remote_branches}"))
            [[ -z "${collision}" ]] \
              || { echo "Image tag collision: ${BRANCH} and ${collision} both normalize to ${moving}" >&2; exit 1; }
          fi
          echo "moving=${moving}" >> "${GITHUB_OUTPUT}"
          echo "immutable=${immutable}" >> "${GITHUB_OUTPUT}"

  build-publish-images:
    needs: detect-changes
    if: needs.detect-changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.detect-changes.outputs.images) }}

    steps:
      - uses: actions/checkout@v6

      - name: Run Hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: ${{ matrix.image.path }}

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          # NOTE: github.repository includes the owner/org (ghcr.io/<owner/org>/repo-name)
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          tags: |
            type=raw,value=${{ needs.detect-changes.outputs.moving-tag }}
            type=raw,value=${{ needs.detect-changes.outputs.immutable-tag }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: . # WARN: all dockerfiles should have a context of the root of the repo
          file: ${{ matrix.image.path }}
          load: true
          push: false
          tags: ${{ matrix.image.name }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image.name }}:scan
          scanners: vuln,secret
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml

      - name: Push image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image.path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Generate Attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false

  build-publish-charts:
    needs: detect-changes
    if: needs.detect-changes.outputs.charts != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        chart: ${{ fromJSON(needs.detect-changes.outputs.charts) }}

    steps:
      - uses: actions/checkout@v6

      - name: Scan Helm chart with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.chart.path }}
          scanners: misconfig
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml

      - uses: ./.github/actions/setup-mise
        with:
          tools: helm

      - name: Package Helm Chart
        run: helm package "${{ matrix.chart.path }}"

      - name: Login to GHCR
        if: github.ref_name == github.event.repository.default_branch && matrix.chart.publish
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push Helm Chart
        if: github.ref_name == github.event.repository.default_branch && matrix.chart.publish
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          helm push "${{ matrix.chart.name }}"-*.tgz "oci://ghcr.io/${OWNER,,}/charts"

  build-and-publish-pass:
    needs:
      - detect-changes
      - build-publish-images
      - build-publish-charts
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "ok"
