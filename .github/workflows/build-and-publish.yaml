name: Build and Publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
  PUBLISH: ${{ github.ref == 'refs/heads/main' }}

concurrency:
  group: build-and-publish-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: patroni, dockerfile: packages/postgres/patroni/Dockerfile }
          - { name: pgbackrest, dockerfile: packages/postgres/pgbackrest/Dockerfile }
          - { name: valkey, dockerfile: packages/valkey/Dockerfile }
          - { name: valkey-reconciler, dockerfile: packages/valkey/reconciler/Dockerfile }
          - { name: argocd-sst-plugin, dockerfile: packages/argocd/Dockerfile }
          - { name: clickhouse, dockerfile: packages/clickhouse/clickhouse/Dockerfile }
          - { name: clickhouse-keeper, dockerfile: packages/clickhouse/keeper/Dockerfile }
          - { name: clickhouse-backup, dockerfile: packages/clickhouse/backup/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: ${{ matrix.name }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.name }}:scan
          scanners: vuln,secret
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          labels: org.opencontainers.image.revision=${{ env.SOURCE_REVISION }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=build-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        if: env.PUBLISH == 'true'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.push.outputs.digest != ''
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
      - name: Record image digest
        if: steps.push.outputs.digest != ''
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: printf 'ghcr.io/%s/%s@%s\n' "${OWNER,,}" "$IMAGE" "$DIGEST" > "$RUNNER_TEMP/$IMAGE.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.push.outputs.digest != ''
        with:
          name: release-image-${{ matrix.name }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ matrix.name }}.txt
          if-no-files-found: error

  charts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        chart: [postgres, valkey, clickhouse]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
      - uses: ./.github/actions/setup-mise
        with:
          tools: helm
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: packages/${{ matrix.chart }}/chart
          trivy-config: trivy.yaml
          trivyignores: .trivyignore.yaml
      - name: Package chart
        run: helm package "packages/${{ matrix.chart }}/chart" --version "0.0.0-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}"
      - name: Publish chart
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          CHART: ${{ matrix.chart }}
        run: |
          echo "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "$CHART-0.0.0-ci.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}.tgz" "oci://ghcr.io/${OWNER,,}/charts"
          printf '0.0.0-ci.%s.%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/$CHART.version"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.PUBLISH == 'true'
        with:
          name: release-chart-${{ matrix.chart }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/${{ matrix.chart }}.version
          if-no-files-found: error

  publish:
    needs: [images, charts]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-production
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      CHART_VERSION: 0.0.0-ci.${{ github.run_id }}.${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          fetch-depth: 0
      - name: Require successful checks for this source
        run: |
          for workflow in Checks Tests Security; do
            run=$(gh run list --workflow "$workflow" --commit "$SOURCE_REVISION" --event push --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$run" ] || { echo "No $workflow run for $SOURCE_REVISION" >&2; exit 1; }
            gh run watch "$run" --exit-status
          done
      - uses: ./.github/actions/setup-mise
        with:
          tools: kustomize yq
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*-${{ github.run_attempt }}
          merge-multiple: true
          path: ${{ runner.temp }}/release-inputs
      - name: Publish source and artifact pins for Argo CD
        run: scripts/ci/publish.sh "$RUNNER_TEMP/release-inputs"

  build-and-publish-pass:
    needs: [images, charts]
    if: ${{ always() && !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
