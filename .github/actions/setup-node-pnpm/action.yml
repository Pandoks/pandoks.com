name: Setup Node + pnpm
description: Read the node version from mise.toml, set up pnpm and node with the pnpm-store cache, then install workspace dependencies.

runs:
  using: composite
  steps:
    - name: Read node version from mise.toml
      id: mise-node
      shell: bash
      run: echo "version=$(sed -n -E 's/^node[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' mise.toml)" >> "$GITHUB_OUTPUT"

    - name: Setup pnpm
      uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

    - name: Setup Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ steps.mise-node.outputs.version }}
        cache: 'pnpm'

    - name: Install pnpm dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
