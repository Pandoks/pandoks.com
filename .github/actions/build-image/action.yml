name: Build image
description: Lint, build, scan, and push an image to GHCR, leaving it loaded in Docker as <name>:scan. Needs docker/setup-buildx-action and a GHCR login first.

inputs:
  name:
    description: Image name, pushed as ghcr.io/<owner>/<name>.
    required: true
  dockerfile:
    description: Path to the Dockerfile, built with the repo root as its context.
    required: true

runs:
  using: composite
  steps:
    - name: Run Hadolint
      uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
      with:
        dockerfile: ${{ inputs.dockerfile }}

    - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      id: meta
      with:
        # NOTE: github.repository includes the owner/org (ghcr.io/<owner/org>/repo-name)
        images: ghcr.io/${{ github.repository_owner }}/${{ inputs.name }}
        tags: |
          type=ref,event=branch
          type=raw,value=ref-{{branch}}-{{sha}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: . # WARN: all dockerfiles should have a context of the root of the repo
        file: ${{ inputs.dockerfile }}
        load: true
        push: false
        tags: ${{ inputs.name }}:scan
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Scan image with Trivy
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.name }}:scan
        scanners: vuln,secret
        trivy-config: trivy.yaml
        trivyignores: .trivyignore.yaml

    - name: Push image
      id: push
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        sbom: true
        provenance: mode=max

    - name: Generate Attestation
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-name: ghcr.io/${{ github.repository_owner }}/${{ inputs.name }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: false
