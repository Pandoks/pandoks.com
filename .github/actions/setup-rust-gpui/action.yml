name: Setup Rust + GPUI
description: Install Linux GPUI system libraries when on Linux, pinned Rust via mise, and Rust cargo cache.

runs:
  using: composite
  steps:
    - name: Install GPUI Linux dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: >-
        sudo apt-get update &&
        sudo apt-get install -y --no-install-recommends
        libfontconfig-dev libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev
        libwayland-dev libx11-xcb-dev libxcb1-dev

    - uses: ./.github/actions/setup-mise
      with:
        tools: rust

    # NOTE: must run after setup-mise so rust-cache keys on the pinned rustc version
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
