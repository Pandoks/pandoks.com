#cloud-config
# env variables:
# PRIVATE_IP_RANGE (every location's range)
# STAGE_NAME
# ROLE (bootstrap, server, worker, or gateway)
# CLUSTER_NAME
# K3S_TOKEN
# SERVER_API
# NODE_IP
# PRIVATE_INTERFACE (private network interface for flannel and the firewall)
# PRIVATE_NETPLAN (base64 netplan for the private interface, its routes, and a gateway's tunnel)
# K3S_NODE_ARGS (the pool's --node-label and --node-taint flags)
# GPU (nvidia, or empty)
# TAILSCALE_HOSTNAME
# REGISTRATION_TAILNET_AUTH_KEY
# KUBERNETES_TAILSCALE_OAUTH_CLIENT_ID (for bootstrap)
# KUBERNETES_TAILSCALE_OAUTH_CLIENT_SECRET (for bootstrap)
# KUBERNETES_TAILSCALE_HOSTNAME (for bootstrap)
# S3_HOST (for control-plane)
# BACKUP_BUCKET (for control-plane)
# S3_ACCESS_KEY (for control-plane)
# S3_SECRET_KEY (for control-plane)
package_update: true
package_upgrade: true
ssh_pwauth: false
disable_root: true

bootcmd: []

users:
  - name: pandoks
    gecos: 'Admin User'
    groups: [sudo]
    sudo: 'ALL=(ALL) NOPASSWD:ALL'
    shell: /bin/bash

packages:
  - curl

write_files:
  - path: /etc/ssh/sshd_config
    owner: root:root
    permissions: '0644'
    content: |
      PubkeyAuthentication yes
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      PermitRootLogin no
      AllowUsers pandoks
      Subsystem sftp internal-sftp
      UsePAM yes
  - path: /etc/sysctl.d/90-pandoks.conf
    owner: root:root
    permissions: '0644'
    content: |
      # NOTE: gateways route between locations; k3s nodes forward too
      net.ipv4.ip_forward = 1
  - path: /etc/nftables.conf
    owner: root:root
    permissions: '0755'
    content: |
      #!/usr/sbin/nft -f

      # NOTE: an owned table instead of `flush ruleset`, so reloading nftables never wipes k3s's rules
      table inet pandoks
      delete table inet pandoks

      table inet pandoks {
        # NOTE: NodePort traffic is DNAT'd in prerouting and never reaches the input chain
        chain prerouting {
          type filter hook prerouting priority dstnat - 10; policy accept;

          ct state established,related accept comment "Return traffic"
          iifname { "lo", "tailscale0", "cni0", "flannel.1", "wg0", "${PRIVATE_INTERFACE}" } accept comment "Internal interfaces"
          meta l4proto { tcp, udp } th dport 30000-32767 counter drop comment "Public NodePorts"
        }

        chain input {
          type filter hook input priority -100; policy drop;

          ct state established,related accept comment "Return traffic"
          ct state invalid drop comment "Invalid packets"

          iif "lo" accept comment "Loopback"
          iifname "tailscale0" accept comment "Tailscale interface"
          iifname "cni0" accept comment "K3s CNI bridge"
          iifname "flannel.1" accept comment "K3s Flannel"
          iifname "${PRIVATE_INTERFACE}" ip saddr ${PRIVATE_IP_RANGE} accept comment "Private network"
          iifname "wg0" ip saddr ${PRIVATE_IP_RANGE} accept comment "Gateway tunnels"

          udp dport 41641 accept comment "Tailscale"
          udp dport 51820 accept comment "Gateway WireGuard"

          ip6 nexthdr ipv6-icmp accept comment "ICMPv6 (required for IPv6)"

          limit rate 5/minute counter log prefix "nft-drop: "
          counter drop
        }

        chain forward {
          type filter hook forward priority filter; policy accept;
        }

        chain output {
          type filter hook output priority filter; policy accept;
        }
      }

runcmd:
  - |
    printf '%s' "${PRIVATE_NETPLAN}" | base64 -d > /etc/netplan/60-private.yaml
    chmod 600 /etc/netplan/60-private.yaml
    netplan apply
  - sysctl --system
  - systemctl enable nftables
  - nft -f /etc/nftables.conf
  - curl -fsSL https://tailscale.com/install.sh | sh
  - |
    tailscale up --ssh \
      --authkey "${REGISTRATION_TAILNET_AUTH_KEY}" \
      --hostname "${TAILSCALE_HOSTNAME}" \
      --accept-dns=false
  - |
    set -eu
    if [ "${GPU}" = "nvidia" ]; then
      # renovate: datasource=deb depName=nvidia-headless-580-server registryUrl=https://archive.ubuntu.com/ubuntu?suite=noble-updates&components=restricted&binaryArch=amd64
      NVIDIA_DRIVER_VERSION=580.178.04-0ubuntu0.24.04.1
      # renovate: datasource=github-releases depName=NVIDIA/nvidia-container-toolkit
      NVIDIA_CONTAINER_TOOLKIT_VERSION=1.20.1
      curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | \
        gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit.gpg
      echo "deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit.gpg] https://nvidia.github.io/libnvidia-container/stable/deb/$(dpkg --print-architecture) /" \
        > /etc/apt/sources.list.d/nvidia-container-toolkit.list
      apt-get update
      # NOTE: k3s finds the NVIDIA runtime at start, so the driver and toolkit go in first
      apt-get install -y "linux-headers-$(uname -r)" \
        "nvidia-headless-580-server=$NVIDIA_DRIVER_VERSION" \
        "nvidia-utils-580-server=$NVIDIA_DRIVER_VERSION" \
        "nvidia-container-toolkit=$NVIDIA_CONTAINER_TOOLKIT_VERSION-1" \
        "nvidia-container-toolkit-base=$NVIDIA_CONTAINER_TOOLKIT_VERSION-1" \
        "libnvidia-container-tools=$NVIDIA_CONTAINER_TOOLKIT_VERSION-1" \
        "libnvidia-container1=$NVIDIA_CONTAINER_TOOLKIT_VERSION-1"
      modprobe nvidia
    fi
    if [ "${ROLE}" = "bootstrap" ]; then
      curl -sfL https://get.k3s.io | \
        INSTALL_K3S_VERSION="v1.36.5+k3s1" K3S_TOKEN="${K3S_TOKEN}" sh -s - server \
          --cluster-init \
          --disable=traefik \
          --disable=servicelb \
          --node-ip="${NODE_IP}" \
          --advertise-address="${NODE_IP}" \
          --tls-san="${NODE_IP}" \
          --flannel-iface=${PRIVATE_INTERFACE} \
          --etcd-expose-metrics \
          --etcd-s3 \
          --etcd-s3-endpoint="${S3_HOST}" \
          --etcd-s3-bucket="${BACKUP_BUCKET}" \
          --etcd-s3-access-key="${S3_ACCESS_KEY}" \
          --etcd-s3-secret-key="${S3_SECRET_KEY}" \
          --etcd-s3-folder=kubernetes/${CLUSTER_NAME}/etcd \
          --etcd-snapshot-schedule-cron="0 */6 * * *" \
          --etcd-snapshot-retention=5 ${K3S_NODE_ARGS}

      export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

      kubectl create secret generic tailscale \
        --namespace kube-system \
        --from-literal=tailscale-oauth="$(cat << EOF
    oauth:
      clientId: "${KUBERNETES_TAILSCALE_OAUTH_CLIENT_ID}"
      clientSecret: "${KUBERNETES_TAILSCALE_OAUTH_CLIENT_SECRET}"
    EOF
    )" \
        --from-literal=operator-config="$(cat << EOF
    operatorConfig:
      hostname: "${KUBERNETES_TAILSCALE_HOSTNAME}"
      defaultTags:
        - tag:k8s-operator
        - tag:k8s
        - tag:${STAGE_NAME}
    EOF
    )" \
        --dry-run=client -o yaml | kubectl apply --server-side -f -

      kubectl create namespace tailscale --dry-run=client -o yaml | kubectl apply --server-side -f -

      kubectl wait --for=create --for=condition=Established crd/helmcharts.helm.cattle.io --timeout=300s
      kubectl apply --server-side -f - << EOF
    apiVersion: helm.cattle.io/v1
    kind: HelmChart
    metadata:
      name: tailscale-operator
      namespace: kube-system
    spec:
      repo: https://pkgs.tailscale.com/helmcharts
      chart: tailscale-operator
      version: 1.104.4
      targetNamespace: tailscale
      valuesContent: |-
        apiServerProxyConfig:
          mode: "true"
      valuesSecrets:
        - name: tailscale
          keys:
            - tailscale-oauth
            - operator-config
    EOF
      kubectl create clusterrolebinding pandoks \
        --user='Pandoks@github' \
        --clusterrole=cluster-admin \
        --dry-run=client -o yaml | kubectl apply --server-side -f -
    elif [ "${ROLE}" = "server" ]; then
      curl -sfL https://get.k3s.io | \
        INSTALL_K3S_VERSION="v1.36.5+k3s1" K3S_TOKEN="${K3S_TOKEN}" sh -s - server \
          --server="${SERVER_API}" \
          --disable=traefik \
          --disable=servicelb \
          --node-ip="${NODE_IP}" \
          --advertise-address="${NODE_IP}" \
          --tls-san="${NODE_IP}" \
          --flannel-iface=${PRIVATE_INTERFACE} \
          --etcd-expose-metrics \
          --etcd-s3 \
          --etcd-s3-endpoint="${S3_HOST}" \
          --etcd-s3-bucket="${BACKUP_BUCKET}" \
          --etcd-s3-access-key="${S3_ACCESS_KEY}" \
          --etcd-s3-secret-key="${S3_SECRET_KEY}" \
          --etcd-s3-folder=kubernetes/${CLUSTER_NAME}/etcd \
          --etcd-snapshot-schedule-cron="0 */6 * * *" \
          --etcd-snapshot-retention=5 ${K3S_NODE_ARGS}
    elif [ "${ROLE}" = "worker" ]; then
      curl -sfL https://get.k3s.io | \
        INSTALL_K3S_VERSION="v1.36.5+k3s1" K3S_TOKEN="${K3S_TOKEN}" sh -s - agent \
          --server="${SERVER_API}" \
          --node-ip="${NODE_IP}" \
          --flannel-iface=${PRIVATE_INTERFACE} ${K3S_NODE_ARGS}
    fi
