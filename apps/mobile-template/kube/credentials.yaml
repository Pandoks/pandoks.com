# used to pull private images from ghcr.io
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-auth
  namespace: mobile-template
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "ghcr.io": {
          "username": "Pandoks",
          "password": "${GithubPersonalAccessToken}"
        }
      }
    }

---
# lets the namespace's default service account pull private images from ghcr.io
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: mobile-template
imagePullSecrets:
  - name: ghcr-auth

---
apiVersion: v1
kind: Secret
metadata:
  name: mobile-updates-mobile-template-signing-key
  namespace: mobile-template
type: Opaque
data:
  private-key.pem: ${MobileUpdatesSigningKey | base64}

---
# used to terminate TLS at the ingress controller for the traffic flow: client -> cloudflare -- here -> k3s
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-origin-tls
  namespace: mobile-template
type: kubernetes.io/tls
data:
  tls.crt: ${HetznerOriginTlsCrt | base64}
  tls.key: ${HetznerOriginTlsKey | base64}
