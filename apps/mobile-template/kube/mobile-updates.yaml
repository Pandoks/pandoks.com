apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: mobile-template-mobile-updates-mobile-template
  namespace: kube-system
spec:
  chart: oci://${ImageRegistry}/charts/mobile-updates
  version: 0.1.0
  targetNamespace: &namespace mobile-template
  createNamespace: true
  failurePolicy: abort
  plainHTTP: ${IsLocal}
  set:
    name: mobile-template
    namespace: *namespace
    # NOTE: Renovate bumps the digest after main builds a new image, so merging that PR releases the update
    image: ghcr.io/pandoks/mobile-template-mobile-updates:latest@sha256:73a2e5040370fcb0ebbedd0f95cf797c3ab5d9d1744f465459313ba3516d3ee8
    host: ${MobileUpdatesDomain}
    signingKey.secret: mobile-updates-mobile-template-signing-key
