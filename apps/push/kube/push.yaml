apiVersion: v1
kind: Service
metadata:
  name: push
  namespace: main
spec:
  type: ClusterIP
  selector:
    app: push
  ports:
    - name: http
      port: 80
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: push
  namespace: main
spec:
  replicas: 2
  selector:
    matchLabels:
      app: &app push
  template:
    metadata:
      labels:
        app: *app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: push
          image: ${ImageRegistry}/push:${ImageTag}
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: push-creds
          env:
            - name: PGHOST
              value: main-pgdog
            - name: PGPORT
              value: '6432'
            - name: PGDATABASE
              value: main
            - name: PGUSER
              value: admin
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-main-creds
                  key: ADMIN_PASSWORD
            - name: VALKEY_ADDRESS
              value: valkey-main-cluster:6379
            - name: VALKEY_USERNAME
              value: admin
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: valkey-main-creds
                  key: ADMIN_PASSWORD
            - name: APNS_URL
              value: https://api.push.apple.com
            - name: FCM_URL
              value: https://fcm.googleapis.com
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
          # NOTE: no CPU limit; throttling adds latency spikes
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
