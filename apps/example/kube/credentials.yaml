# used to terminate TLS at the ingress controller for the traffic flow: client -> cloudflare -- here -> k3s
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-origin-tls
  namespace: example
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-secrets
  target:
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: HetznerOriginTlsCrt
    - secretKey: tls.key
      remoteRef:
        key: HetznerOriginTlsKey

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup-bucket-creds
  namespace: main
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-secrets
  data:
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: CloudflareBackupAccessKey
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: CloudflareBackupSecretKey

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-main-creds
  namespace: main
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: cluster-secrets
  target:
    template:
      mergePolicy: Merge
      data:
        users.toml: |
          [[users]]
          name = "admin"
          database = "main"
          password = "{{ .ADMIN_PASSWORD }}"

          [[users]]
          name = "client"
          database = "main"
          password = "{{ .CLIENT_PASSWORD }}"
          pool_size = 20
  data:
    - secretKey: SUPERUSER_PASSWORD
      remoteRef:
        key: MainMainPostgresSuperuserPassword
    - secretKey: ADMIN_PASSWORD
      remoteRef:
        key: MainMainPostgresAdminPassword
    - secretKey: CLIENT_PASSWORD
      remoteRef:
        key: MainMainPostgresClientPassword
    - secretKey: REPLICATION_PASSWORD
      remoteRef:
        key: MainMainPostgresReplicationPassword
    - secretKey: PATRONI_PASSWORD
      remoteRef:
        key: MainMainPostgresPatroniPassword

