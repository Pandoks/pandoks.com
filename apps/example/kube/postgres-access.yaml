# NOTE: you need one service account per namespace
apiVersion: v1
kind: ServiceAccount
metadata:
  name: patroni
  namespace: main

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: patroni
  namespace: main
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: patroni
subjects:
  - kind: ServiceAccount
    name: patroni
    namespace: main
