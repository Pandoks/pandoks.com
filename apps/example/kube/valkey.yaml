apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: main-valkey-main-cluster
  namespace: kube-system
spec:
  chart: oci://ghcr.io/pandoks/charts/valkey
  version: 0.1.1 # renovate: datasource=docker packageName=pandoks/charts/valkey
  targetNamespace: &namespace main
  createNamespace: true
  failurePolicy: abort
  plainHTTP: false
  set:
    name: main
    namespace: *namespace
    image: ghcr.io/pandoks/valkey
    cluster.reconcilerImage: ghcr.io/pandoks/valkey-reconciler
    cluster.masters: 1
    cluster.replicasPerMaster: 0
    credentials.secret: valkey-main-creds
