networks:
  local-network:
    name: pandoks-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

services:
  s3:
    build: ./scripts/cluster/aws-emulator
    container_name: s3
    restart: always
    ports:
      - 9297:9297
    healthcheck:
      test: curl -fs --cacert /tmp/.aws/emulator/9297/ca.pem https://127.0.0.1:9297/__admin/health
      interval: 2s
    networks:
      - local-network
  # WARNING: the emulator keeps everything in memory, so a restart loses every bucket and backup.
  # Only compose restarts of s3 re-run s3-buckets; after a docker restart, crash, or reboot, run
  # `pnpm cluster k3d deps up` again
  s3-buckets:
    image: amazon/aws-cli:2.40.1@sha256:4ade0fe3e60e0b9e1fb0910f86c6d992baf4e12d3172c25a3c8c11f6c81cee08
    depends_on:
      s3:
        condition: service_healthy
        restart: true
    environment:
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_REGION=us-west-1
      - AWS_ENDPOINT_URL=https://s3:9297
    # NOTE: the emulator's certificate only names localhost
    entrypoint: [sh, -c]
    command:
      - |
        set -eu
        for bucket in backups dev-backups; do
          aws s3api head-bucket --no-verify-ssl --bucket "$${bucket}" >/dev/null 2>&1 || aws s3 mb --no-verify-ssl "s3://$${bucket}"
        done
    networks:
      - local-network
