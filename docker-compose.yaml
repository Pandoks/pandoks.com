networks:
  local-network:
    name: pandoks-net
    driver: bridge
    ipam:
      config:
        # NOTE: explicit gateway — newer docker engines leave it unset for
        # subnet-only configs and k3d refuses networks without one
        - subnet: 172.30.0.0/16
          gateway: 172.30.0.1

services:
  s3:
    # NOTE: last community release line — newer tags hard-exit without a license token
    image: localstack/localstack:4.14.0
    container_name: s3
    restart: always
    ports:
      - 4566:4566
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=us-west-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=testsecret
      - BACKUP_BUCKET=database
      - PERSISTENCE=1
    networks:
      local-network:
        # NOTE: static IP so k3d pods can reach localstack without hairpin NAT or
        # docker DNS (blocked on some hosts); .254 stays clear of node auto-assign
        # (.2+) and the MetalLB pool (172.30.100.x)
        ipv4_address: 172.30.0.254
    volumes:
      - ./data/localstack:/var/lib/localstack
    entrypoint:
      - sh
      - -c
      - |
        mkdir -p /etc/localstack/init/ready.d
        cat > /etc/localstack/init/ready.d/s3.sh << 'EOF'
        #!/bin/sh
        awslocal s3 mb s3://$$BACKUP_BUCKET || true
        EOF
        chmod +x /etc/localstack/init/ready.d/s3.sh
        exec docker-entrypoint.sh
