networks:
  local-network:
    name: pandoks-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  s3:
    name: pandoks-s3

services:
  s3:
    image: adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    container_name: s3
    restart: always
    ports:
      - 4566:9090
      # NOTE: pgBackRest only speaks TLS to S3, so it gets the HTTPS port; ClickHouse uses plain HTTP
      - 4567:9191
    environment:
      - COM_ADOBE_TESTING_S3MOCK_STORE_ROOT=/s3mockroot
      - COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT=true
      - COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS=backups,dev-backups
      - COM_ADOBE_TESTING_S3MOCK_STORE_REGION=us-west-1
    networks:
      - local-network
    volumes:
      - s3:/s3mockroot
